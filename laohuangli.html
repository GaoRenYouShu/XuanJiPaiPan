.cal-page .cal-title{color:var(--red)}

.cal-title{font-weight:700;font-size:1.05rem;margin:var(--sp-1) 0 var(--sp-2);text-align:center;color:var(--gold2)}

.nav-btn{width:30px;height:30px;border:1px solid transparent;background:transparent;color:var(--gold2);
  border-radius:0;font-family:inherit;font-size:17px;line-height:1;cursor:pointer;transition:.15s;padding:0}

.nav-btn:hover{border-color:var(--gold);background:var(--gold);color:#fff}

.btn-mini{display:inline-flex;align-items:center;justify-content:center;height:30px;padding:0 var(--sp-1);
  border:0;border-radius:0;background:transparent;color:var(--gold);font:inherit;font-size:12px;cursor:pointer;box-sizing:border-box}

.btn-mini:hover{color:var(--gold2)}

.xj-query-row{display:flex;flex:0 0 auto;flex-wrap:nowrap;align-items:flex-end;gap:var(--sp-2);max-width:100%}

.xj-query-row .field label{white-space:nowrap;color:var(--gold2)}

.xj-search-out:empty{display:none}

.xj-only-has:empty{display:none}

.xj-filter-row{display:flex;flex:0 1 auto;flex-wrap:wrap;align-items:center;justify-content:flex-start;gap:var(--sp-1) var(--sp-2);margin:0;max-width:100%;min-width:0;font-size:var(--tier4);color:var(--ink2)}

.xj-filter-opts{display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-1) var(--sp-2)}

.xj-filter-cap{color:var(--gold2);letter-spacing:.08em}

.xj-chk{display:inline-flex;align-items:center;gap:var(--sp-1);cursor:pointer}

.xj-chk input{width:14px;height:14px;accent-color:var(--gold2)}

@media(max-width:640px){
.fei-wrap{grid-template-columns:1fr;gap:var(--sp-3);justify-items:center}

.cal-grid{gap:var(--sp-1) var(--sp-1);width:100%;max-width:100%;box-sizing:border-box;padding:var(--sp-2)}

.cal-nav-grp{gap:var(--sp-1)}
}

@media(max-width:420px){
.cal-nav{flex-wrap:wrap}

.cal-nav .cal-title{flex:1 1 100%;order:-1}
}

@media print{
.data-export-hide{display:none !important}
}

.rev-row{display:contents}

.rev-row .rev-fields{display:flex;flex:0 0 auto;flex-wrap:wrap;align-items:flex-end;gap:var(--sp-2);max-width:100%;min-width:0}

.rev-row .field{display:flex;flex:0 0 auto;width:auto;min-width:0;flex-direction:column;gap:var(--sp-1)}

.rev-row .field label{color:var(--gold2);font-weight:400;white-space:nowrap;margin:0}

.rev-row .field input[type="number"]{width:76px}

.rev-row .field select{width:auto;max-width:none}

.rev-row .rev-check-line{display:flex;align-items:center;gap:var(--sp-1);height:30px}

.rev-row .field input[type="checkbox"]{width:auto;height:auto;padding:0;margin:0}

.rev-row .rev-note{flex:1 1 100%;max-width:none;margin:var(--sp-1) 0 0;font-size:12px;color:var(--ink2);line-height:1.6;text-align:left}

     cardTpl: ['<.today-card 内 HTML，{0} 起为 dict 下标>'],
     cardDays: { 'YYYY-MM-DD': [shapeIdx, v0, ...] },
     notes: { 'YYYY-MM-DD': dictIdx },
     noteSpan: 'month' }
   cellDays 的记录按格位还原日期，dayNumber 为当月日号并作校验；classIdx 取 dict 里的附加类名，
   无附加类记 -1。cellTpl 与 cardTpl 的占位 {i} 取记录第 i 个值作 dict 下标，经 tpl 还原。
   notes 的值为页内注记文本的 dict 下标，有当日注记即写入该页注记元素；
   noteSpan 为 month 时注记只记在农历月首日，当日无记录即向前找至多 31 日取最近一条。
   整月格只由本件写 #calGrid：紧凑渲染与页内交互渲染共用同一写入者，不留第二处赋值。 */
(function () {
  'use strict';

  var WD = ['一', '二', '三', '四', '五', '六', '日'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function ymd(y, m, d) { return y + '-' + pad(m) + '-' + pad(d); }
  function ymKey(y, m) {
    var ys = String(y);
    while (ys.length < 4) ys = '0' + ys;
    return ys + '-' + pad(m);
  }

  /* 公元 0 至 99 年按 setFullYear 校正，与全站 safeDate 同法。 */
  function safeDate(y, m, d) {
    var dt = new Date(y, m - 1, d);
    if (y >= 0 && y < 100) dt.setFullYear(y);
    return dt;
  }

  function daysOfMonth(y, m) { var first = safeDate(y, m, 1); var next = safeDate(y, m + 1, 1); return Math.round((next.getTime() - first.getTime()) / 86400000); }

  function readKey(v) {
    var p = String(v == null ? '' : v).trim().split('-');
    if (p.length !== 3) return null;
    var y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
    if (!isFinite(y) || !isFinite(m) || !isFinite(d)) return null;
    if (m < 1 || m > 12 || d < 1 || d > daysOfMonth(y, m)) return null;
    return { y: y, m: m, d: d };
  }

  function keyOf(dt) {
    return ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
  }

  function normDay(v) {
    if (v instanceof Date) return keyOf(v);
    var p = readKey(v);
    return p ? ymd(p.y, p.m, p.d) : '';
  }

  /* 网格首格：周一起始，与五页首列一致。lead 为当月一日落在周几之前的补位日数。 */
  function leadDays(y, m) {
    return (safeDate(y, m, 1).getDay() + 6) % 7;
  }

  /* 模板还原：{i} 换成 dict[vs[i]]；占位越界或字典缺值即原样留占位，与生成器打包口径一致。 */
  function tpl(s, vs) {
    var facts = window.__CAL_FACTS__ || {};
    var dict = facts.dict || [];
    return String(s == null ? '' : s).replace(/\{(\d+)\}/g, function (m, k) {
      var i = Number(k);
      if (!(vs && i >= 0 && i < vs.length)) return m;
      var v = dict ? dict[vs[i]] : undefined;
      return v == null ? m : String(v);
    });
  }

  function setTitle(y, m) {
    var title = document.getElementById('calTitle');
    if (title) title.textContent = y + '年' + m + '月';
  }

  /* 唯一 #calGrid 写入者：紧凑渲染与交互渲染都先备成 [{date, cls, html}]，此处一次写出。
     网格布局类在渲染时补上，body.part 只留空容器，不留 cal-grid 类。 */
  function gridHtml(cells, todayKey, selKey) {
    var out = WD.map(function (w) { return '<div class="wd">' + w + '</div>'; });
    var list = (cells && cells.length) ? cells : [];
    for (var i = 0; i < list.length; i++) {
      var it = list[i] || {};
      var k = String(it.date == null ? '' : it.date);
      var cls = 'cal-cell';
      var extra = String(it.cls == null ? '' : it.cls).trim();
      if (extra) cls += ' ' + extra;
      if (todayKey && k === todayKey) cls += ' today';
      if (selKey && k === selKey) cls += ' selected';
      out.push('<div class="' + cls + '" data-date="' + k + '">'
        + (it.html == null ? '' : String(it.html)) + '</div>');
    }
    return out.join('');
  }
  function paintGrid(cells, todayKey, selKey) {
    var grid = document.getElementById('calGrid');
    if (!grid) return false;
    grid.className = 'cal-grid';
    grid.innerHTML = gridHtml(cells, todayKey, selKey);
    bindClick(grid);
    return true;
  }

  /* 一格日期：优先取数据里的日期键；给日号时只在本月内按日号取；
     补位格按格位与当月首格推算，跨月跨年由 Date 自动归位。 */
  function cellKey(it, y, m, i, lead) {
    var d = it && it.d;
    if (typeof d === 'string') {
      var p = readKey(d);
      if (p) return ymd(p.y, p.m, p.d);
    }
    if (typeof d === 'number' && d >= 1 && d <= 31) {
      var c = ' ' + String((it && it.c) || '') + ' ';
      if (c.indexOf(' other ') < 0) return ymd(y, m, d);
    }
    return keyOf(safeDate(y, m, 1 - lead + i));
  }

  /* 交互路径：页内给一格一貌的 cell 与访问日，本件按格位还原日期并一次写出整月格。 */
  function render(y, m, cells, opts) {
    opts = opts || {};
    var todayKey = normDay(opts.today);
    var selKey = normDay(opts.selected) || todayKey;
    var lead = leadDays(y, m);
    var list = (cells && cells.length) ? cells : [];
    var plan = [];
    for (var i = 0; i < list.length; i++) {
      var it = list[i] || {};
      plan.push({
        date: cellKey(it, y, m, i, lead),
        cls: it.c == null ? '' : String(it.c).trim(),
        html: it.h == null ? '' : String(it.h)
      });
    }
    setTitle(y, m);
    paintGrid(plan, todayKey, selKey);
  }

  /* 紧凑格日期：格位推出月内基准日，日号与基准日相符即取；
     不符时按同一星期位在邻月找同日号，避免补位格跨月错位。 */
  function compactDate(y, m, i, lead, day) {
    var base = safeDate(y, m, 1 - lead + i);
    if (base.getDate() === day) return keyOf(base);
    var cand = [safeDate(y, m - 1, day), safeDate(y, m, day), safeDate(y, m + 1, day)];
    for (var j = 0; j < cand.length; j++) {
      if (cand[j].getDate() === day && (cand[j].getDay() + 6) % 7 === i % 7) return keyOf(cand[j]);
    }
    return keyOf(base);
  }

  /* 紧凑月面：cellDays 每记录还原一格，模板与附加类名都从 dict 取。
     当月无记录即返回 null，由 boot 置库渲染旗标。 */
  function compactPlan(y, m, opts) {
    var facts = window.__CAL_FACTS__;
    var recs = facts && facts.cellDays ? facts.cellDays[ymKey(y, m)] : null;
    if (!recs || !recs.length) return null;
    opts = opts || {};
    var dict = facts.dict || [];
    var tpls = facts.cellTpl || [];
    var todayKey = normDay(opts.today);
    var selKey = normDay(opts.selected) || todayKey;
    var lead = leadDays(y, m);
    var plan = [];
    for (var i = 0; i < recs.length; i++) {
      var r = recs[i] || [];
      var shape = tpls[r[0]];
      var day = Number(r[1]);
      var cls = r[2] == null || dict[r[2]] == null ? '' : String(dict[r[2]]).trim();
      plan.push({
        date: compactDate(y, m, i, lead, day),
        cls: cls,
        html: shape == null ? '' : tpl(shape, r.slice(3))
      });
    }
    return plan;
  }
  function renderCompact(y, m, opts) {
    opts = opts || {};
    var plan = compactPlan(y, m, opts);
    if (!plan) return false;
    var todayKey = normDay(opts.today);
    var selKey = normDay(opts.selected) || todayKey;
    setTitle(y, m);
    paintGrid(plan, todayKey, selKey);
    return true;
  }

  /* 点格带入：格的外层由本件生成，点击一律走事件委托读 data-date，再交页内 pickDate。 */
  function bindClick(grid) {
    if (grid.__xjCalClick) return;
    grid.__xjCalClick = 1;
    grid.addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== grid && !(t.getAttribute && t.getAttribute('data-date'))) t = t.parentNode;
      if (!t || t === grid) return;
      var key = t.getAttribute('data-date');
      if (key && typeof window.pickDate === 'function') window.pickDate(key);
    });
  }

  function pageName() {
    var f = window.__CAL_FACTS__;
    if (f && f.page) return String(f.page).replace(/\.html$/i, '');
    var base = (location.pathname.split('/').pop() || 'index').replace(/\.html?$/i, '');
    return base || 'index';
  }

  function b64urlDecode(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return decodeURIComponent(escape(atob(s)));
  }

  /* 分享链接里的日期：格式与 assets/ai.js 的 #xj= 一致，取载荷 d 里的 dInput。 */
  function shareDate() {
    var m = (location.hash || '').match(/#xj=([A-Za-z0-9\-_]+)/);
    if (!m) return '';
    try {
      var o = JSON.parse(b64urlDecode(m[1]));
      var d = o && o.d;
      return (d && typeof d.dInput === 'string') ? d.dInput : '';
    } catch (e) { return ''; }
  }

  /* 访问日：分享参数优先用于选中，其余一律本机当下。表单快照里的旧日期不参与：
     手选值由 assets/app.js 按 data-user-set 还原，自动值不得把访问日拉回昨天。 */
  function resolveDate() {
    var v = shareDate(), p = readKey(v);
    if (p) return safeDate(p.y, p.m, p.d);
    return new Date();
  }

  /* 本机当天：.today 与今日卡只认这一处，不取访问日、不取快照。 */
  function localToday() { return keyOf(new Date()); }

  /* 今日卡：cardDays 当日记录经 cardTpl 还原整卡 HTML，写入 .today-card。
     本件与页内换日后的重出是卡面的全部写者，页内首轮不再写第二份。 */
  function cardInnerOf(key) {
    var facts = window.__CAL_FACTS__;
    var rec = facts && facts.cardDays ? facts.cardDays[key] : null;
    if (!rec || !rec.length) return '';
    var shape = (facts.cardTpl || [])[rec[0]];
    if (shape == null) return '';
    return tpl(shape, rec.slice(1));
  }
  function writeCard(key) {
    var inner = cardInnerOf(key);
    if (!inner) return;
    var host = document.getElementById('dayDetail');
    if (!host) return;
    var node = host.querySelector('.today-card');
    if (!node) {
      node = document.createElement('div');
      node.className = 'today-card';
      host.insertBefore(node, host.firstChild);
    }
    node.innerHTML = inner;
  }

  /* 页内注记元素：数据契约只藏历页有卡外注记，选择器按该页 body.part 实际结构取；
     其余页与缺配置时以 .rv-note 兜底。 */
  var NOTE_SEL = { zangli: '#calReverse .rev-note' };

  /* 注记索引：当日有记录即取；noteSpan 为 month 时向前找至多 31 日取最近一条。 */
  function noteIndexOf(key) {
    var facts = window.__CAL_FACTS__;
    var notes = facts && facts.notes;
    if (!notes) return null;
    if (notes[key] != null) return notes[key];
    if (facts.noteSpan !== 'month') return null;
    var p = readKey(key);
    if (!p) return null;
    for (var i = 1; i <= 31; i++) {
      var k = keyOf(safeDate(p.y, p.m, p.d - i));
      if (notes[k] != null) return notes[k];
    }
    return null;
  }

  /* 注记：取到索引即取 dict 文本；无注记不覆盖页内既有字。 */
  function noteOf(key) {
    var idx = noteIndexOf(key);
    if (idx == null) return '';
    var facts = window.__CAL_FACTS__;
    var v = (facts.dict || [])[idx];
    return v == null ? '' : String(v);
  }
  function writeNote(key) {
    var text = noteOf(key);
    if (!text) return;
    var el = document.querySelector(NOTE_SEL[pageName()] || '.rv-note') || document.querySelector('.rv-note');
    if (el) el.textContent = text;
  }

  /* 首轮卡面单写：解析期件已写出 .today-card 时，页内首轮只重画卡面以下，原卡节点整棵保留；
     其后换日仍由页内重出卡面。takeCard 每页只让一次。 */
  var cardKept = false;
  function takeCard() {
    if (cardKept || !window.__xjCalBootDone) return null;
    var host = document.getElementById('dayDetail');
    var node = host ? host.querySelector('.today-card') : null;
    if (!node) return null;
    cardKept = true;
    return node;
  }

  /* 卡面与其余详情同在 #dayDetail 的页：有解析期卡即保留原节点，只把卡面以下内容重画。 */
  function fillDetail(cardHtml, bodyHtml) {
    var host = document.getElementById('dayDetail');
    if (!host) return false;
    var keep = takeCard();
    if (keep) {
      host.innerHTML = '';
      host.appendChild(keep);
      host.insertAdjacentHTML('beforeend', bodyHtml == null ? '' : String(bodyHtml));
      return true;
    }
    host.innerHTML = (cardHtml == null ? '' : String(cardHtml)) + (bodyHtml == null ? '' : String(bodyHtml));
    return false;
  }

  /* 卡面与其余详情分落两处的页：有解析期卡即原节点保留，不重写。 */
  function fillCard(cardHtml) {
    var host = document.getElementById('dayDetail');
    if (!host) return false;
    if (takeCard()) return true;
    host.innerHTML = cardHtml == null ? '' : String(cardHtml);
    return false;
  }

  /* 解析期起绘拆两段：buildBoot 只算字符串，不碰 DOM；applyBoot 在格位一次写入。
     这样重活（数据解析、格面与卡面还原）落在文档最前，首绘前必已完成；
     格位插入只写字符串，毫秒级，插完即终态。 */
  function buildBoot() {
    var facts = window.__CAL_FACTS__;
    if (!facts || !facts.cellDays) return false;
    var dt = resolveDate();
    var y = dt.getFullYear(), m = dt.getMonth() + 1, key = keyOf(dt);
    var todayKey = localToday();
    var plan = compactPlan(y, m, { today: todayKey, selected: key });
    window.__XJ_BOOT__ = {
      needLibrary: !plan,
      title: y + '年' + m + '月',
      grid: plan ? gridHtml(plan, todayKey, key) : '',
      card: cardInnerOf(key),
      note: noteOf(key),
      date: key,
      share: key !== todayKey
    };
    return true;
  }
  /* 格位一次插入：题头、格面、卡面、日期框与注记都在这时写，调用点紧随 #calGrid 与 #dayDetail。 */
  function applyBoot() {
    var b = window.__XJ_BOOT__;
    if (!b) return false;
    var grid = document.getElementById('calGrid');
    if (!grid) return false;
    window.__xjCalNeedLibrary = !!b.needLibrary;
    var title = document.getElementById('calTitle');
    if (title) title.textContent = b.title;
    grid.className = 'cal-grid';
    grid.innerHTML = b.grid;
    bindClick(grid);
    if (b.card) {
      var host = document.getElementById('dayDetail');
      if (host) {
        var node = host.querySelector('.today-card');
        if (!node) {
          node = document.createElement('div');
          node.className = 'today-card';
          host.insertBefore(node, host.firstChild);
        }
        node.innerHTML = b.card;
      }
    }
    var input = document.getElementById('dInput');
    if (input) {
      input.value = b.date;
      if (b.share) input.setAttribute('data-user-set', '1');
    }
    if (b.note) {
      var el = document.querySelector(NOTE_SEL[pageName()] || '.rv-note') || document.querySelector('.rv-note');
      if (el) el.textContent = b.note;
    }
    window.__xjCalBootDone = true;
    return true;
  }
  function boot() {
    if (!window.__XJ_BOOT__) buildBoot();
    if (!document.getElementById('calGrid')) return false;
    return applyBoot();
  }

  /* 格上的 .today 是否已落本机当天：页内换日重绘前先看这一处，已对即不重画。 */
  function todayMarked(key) {
    var grid = document.getElementById('calGrid');
    if (!grid) return false;
    var cell = grid.querySelector('.today');
    return !!(cell && cell.getAttribute('data-date') === key);
  }

  /* 跨午夜换日：当下件派发 xj:now 后交页内重绘；页内按 data-user-set 决定是否滚到新一天。 */
  function onNow(e) {
    var d = e && e.detail;
    if (!d || !d.day) return;
    if (typeof window.xjCalRoll === 'function') {
      try { window.xjCalRoll(d.day, d); } catch (err) { /* 页内重绘失败不阻断其余监听 */ }
    }
  }
  window.addEventListener('xj:now', onNow);

  /* 表单快照还原手选值后：日期框已是该日，页内选中、今日卡与详情随之同步到该日。 */
  function onFormRestored() {
    var input = document.getElementById('dInput');
    if (!input || !input.value) return;
    if (typeof window.xjCalSync === 'function') {
      try { window.xjCalSync(input.value); } catch (err) { /* 页内同步失败不阻断其余监听 */ }
    }
  }
  window.addEventListener('xj:form-restored', onFormRestored);

  window.xjCal = {
    render: render, renderCompact: renderCompact, boot: boot, resolveDate: resolveDate,
    buildBoot: buildBoot, applyBoot: applyBoot,
    todayMarked: todayMarked, fillDetail: fillDetail, fillCard: fillCard

  /* 数据已在页内且容器已解析时自起绘；数据缺位时留待页内脚本按库渲染。 */
  if (window.__CAL_FACTS__ && !window.__xjCalBootDone) boot();
})();</script>
