<script>
renderChrome('laohuangli.html');
/* ---------- 本地计算辅助 ---------- */
/* 地支方位：DIZHI_CHONG / pairChong / 太岁常量由 assets/xuanji-lib.js、assets/taisui-data.js 共享提供 */
const ZHI_FANG={子:'北',丑:'东北',寅:'东北',卯:'东',辰:'东南',巳:'东南',午:'南',未:'西南',申:'西南',酉:'西',戌:'西北',亥:'西北'};
/* 胎神（日/月干支占处，据《玉匣记》歌诀：甲己占门、乙庚碓磨、丙辛厨灶、丁壬仓库、戊癸占房） */
const GAN_TAISHEN={甲:'门',己:'门',乙:'碓磨',庚:'碓磨',丙:'厨灶',辛:'厨灶',丁:'仓库',壬:'仓库',戊:'房',癸:'房'};
const ZHI_TAISHEN={子:'碓磨',丑:'厕',寅:'户',卯:'门',辰:'厨',巳:'灶',午:'厕',未:'井',申:'仓',酉:'户',戌:'房',亥:'床'};
function taiShen(gan,zhi){return '占'+GAN_TAISHEN[gan]+'、'+ZHI_TAISHEN[zhi];}
/* 太岁神君与犯太岁（值/冲/刑/害/破）：TAISUI_STAR / XING_TAI / HAI_TAI / PO_TAI / ZHI_SHENG 由 assets/taisui-data.js 提供 */
function taiSuiText(ygz,yZhi,suiPo){
  const star=TAISUI_STAR[ygz]||'未载';
  const xing=(XING_TAI[yZhi]||[]).map(x=>ZHI_SHENG[x]).join('')||'无';
  const hai=ZHI_SHENG[HAI_TAI[yZhi]]||'无', po=ZHI_SHENG[PO_TAI[yZhi]]||'无';
  return `太岁神君：${star}大将军<span class="lhl-br"></span>犯太岁：值${ZHI_SHENG[yZhi]}冲${ZHI_SHENG[suiPo]}刑${xing}害${hai}破${po}`;
}
/* ---------- 双圆盘（几何走 assets/wheel.js，样式走 style.css 圆盘通用件段） ----------
   制式逐项照抄万年历经络圆盘，不另创一格。经络圆盘的环带自外向内是：
     外圈字 210 ｜ 弧带 192 ｜ 外圈线 182 ｜ 刻度 168 至 176 ｜ 内圈字 148 ｜ 内界线 120 ｜ 盘心 78
   其分法是“外圈放该盘的方位标记（地支，单字、14px、正文墨色），内圈放该盘的内容（经名，着色）”，
   刻度落在每格中点，正好把外圈字与内圈字连成一条辐条。本页两盘照此：
     时辰盘：外圈＝十二时辰名（单字，按吉凶着色）；内圈＝该时辰干支（两字，正文墨色）。
     宿盘：外圈＝四象方位（东南西北，单字，取节气盘四季名的同一组降调色）；
           内圈＝二十八宿名（单字，按吉凶着色）。
   弧带一律细（3px）、低透明（.22）、主体色，整圈看去是一条淡环；只有“当前查看”那一段转实色加粗
   （4px、不透明），全盘仅此一段抢眼。外圈只放单字，不用两字以上的词：多字沿半径排开就成了长辐条，
   既挤到画布外，也失了经络圆盘那种“外圈一圈单字”的整饬。
🔴 取字角全站一例：**最外圈**环名一律沿圆周环布（WHEEL.ring），字头朝盘外、随切线转向——
   正上横排、右半圈顺时针转向、正下倒排，整圈读作一条环带；单字两字同法，两字一前一后落于切线。
   内侧各圈照旧：单字走 WHEEL.dir（四正正立、其余沿半径散射），两字走 WHEEL.radial（全圈放射聚焦盘心）。
   🔴 全盘只有一套标记：加粗弧、指针、圆点、内侧字高亮、盘心、下方详情，统统指向同一个“当前查看”
   的格。首屏那一格就是当令，故首屏与万年历两盘同貌；此后点哪一格，整套标记跟到哪一格。
   盘内不铺选中色块：经络圆盘靠加粗弧与加粗字示选中，铺色块会盖住刻度与弧带，也显脏。 */
const W_C=220, W_ARC=192, W_OUT=182, W_IN=120, W_CORE=78,
  W_LAB_IN=148, W_LAB_OUT=206, W_TICK0=168, W_TICK1=176, W_P0=82, W_P1=116,
  /* 🔴 热区外沿（198，即弧带外沿再外扩 6）只此一处定义，命中区与悬停着色同取此值，
     与万年历两盘的“悬停覆盖与命中区同沿”一致。 */
  W_HIT1=W_ARC+6;
let LHL_SC=null, LHL_SC_CUR=0, LHL_SC_SEL=0;
/* 库在无宜事时回传单元素数组 ['无']，非空故空值兜底不触发；此处归一为“诸事不宜”，与当日宜同口径 */
function lhlYiText(a){const s=(a||[]).join('、');return(!s||s==='无')?'诸事不宜':s;}
/* 建除十二神自有一套黄黑，口诀：建满平收黑，除危定执黄，成开皆可用，破闭不可当；与值神的黄道黑道是两派，并列同存不合并 */
const JIAN12_HUANG=['除','危','定','执'], JIAN12_HEI=['建','满','平','收'], JIAN12_KAI=['成','开'];
function jian12Tag(zx){
  if(JIAN12_HUANG.indexOf(zx)>=0) return '建除派黄';
  if(JIAN12_HEI.indexOf(zx)>=0) return '建除派黑';
  return JIAN12_KAI.indexOf(zx)>=0?'成开皆可用':'破闭不可当';
}
function lhlScData(t,i,last){
  const luck=(t.getTianShenLuck&&t.getTianShenLuck())||'';
  const h=+t.getMaxHm().slice(0,2)+1;
  return {name:i===0?'子时':(last?'夜子时':t.getGanZhi().substring(1)+'时'),
    gz:t.getGanZhi(), luck:luck, good:luck==='吉',
    shen:t.getTianShen?(''+t.getTianShen()):'',
    range:t.getMinHm()+'-'+(h<24?String(h).padStart(2,'0')+':00':'24:00'),
    yi:lhlYiText(t.getYi&&t.getYi().slice(0,3))};
}
/* 第 i 段的起止钟点：0 号为早子时（1 小时），12 号为夜子时（1 小时），其余 1 至 11 号各 2 小时。
   全盘按真实时长分角（1 小时 15 度），合计正好 360 度，与十三格阵一一对应。 */
function lhlScHour(i){const h0=(i===0)?0:((i===12)?23:2*i-1);return [h0,h0+((i===0||i===12)?1:2)];}
function scSpan(i){const h=lhlScHour(i);return [h[0]*15,h[1]*15];}
function scMid(i){const sp=scSpan(i);return (sp[0]+sp[1])/2;}
/* 加粗弧、指针、圆点三件随选中走的公共改写，两盘共用 */
function wheelSpot(ids,dg,a0,a1){
  const arc=document.getElementById(ids.arc);
  if(arc) arc.setAttribute('d',WHEEL.arc(W_ARC,a0,a1));
  const q0=WHEEL.px(W_P0,dg), q1=WHEEL.px(W_P1,dg);
  const ln=document.getElementById(ids.needle);
  if(ln){
    ln.setAttribute('x1',WHEEL.n(q0[0])); ln.setAttribute('y1',WHEEL.n(q0[1]));
    ln.setAttribute('x2',WHEEL.n(q1[0])); ln.setAttribute('y2',WHEEL.n(q1[1]));
  }
  const dt=document.getElementById(ids.dot);
  if(dt){ dt.setAttribute('cx',WHEEL.n(q1[0])); dt.setAttribute('cy',WHEEL.n(q1[1])); }
}
const SC_IDS={arc:'lhlScArc',needle:'lhlScNeedle',dot:'lhlScDot'};
function shichenWheel(lunar){
  const times=lunar.getTimes();
  LHL_SC=times.map((t,i)=>lhlScData(t,i,i===times.length-1));
  const hr=new Date();
  LHL_SC_CUR=Math.max(0,times.findIndex(t=>hr.getHours()>=+t.getMinHm().slice(0,2)&&hr.getHours()<=+t.getMaxHm().slice(0,2)));
  LHL_SC_SEL=LHL_SC_CUR;
  const cur=LHL_SC[LHL_SC_SEL], curSp=scSpan(LHL_SC_SEL), curDg=scMid(LHL_SC_SEL);
  let s='';
  /* 十三段弧：段间不留缝，整圈是一条淡环；加粗那段另出一条，随选中走 */
  LHL_SC.forEach(function(x,i){
    const sp=scSpan(i);
    s+=`<path d="${WHEEL.arc(W_ARC,sp[0],sp[1])}" class="w-arc"/>`;
  });
  /* 刻度落在十二宫中点，与两侧文字同轴，连成辐条（与经络圆盘同法） */
  for(let i=0;i<12;i++){
    const dg=i*30, ta=WHEEL.px(W_TICK0,dg), tb=WHEEL.px(W_TICK1,dg);
    s+=`<line x1="${WHEEL.n(ta[0])}" y1="${WHEEL.n(ta[1])}" x2="${WHEEL.n(tb[0])}" y2="${WHEEL.n(tb[1])}" class="w-tick"/>`;
  }
  /* 热区只取环带，不盖盘心 */
  LHL_SC.forEach(function(x,i){
    const sp=scSpan(i);
    s+=`<path d="${WHEEL.band(W_IN,W_HIT1,sp[0],sp[1])}" class="w-hit${i===LHL_SC_SEL?' is-on':''}" data-i="${i}" onclick="lhlPickShichen(${i})"/>`;
    s+=`<path d="${WHEEL.band(W_IN,W_HIT1,sp[0],sp[1])}" class="w-sel"/>`;
  });
  s+=`<path id="lhlScArc" d="${WHEEL.arc(W_ARC,curSp[0],curSp[1])}" class="w-arc w-arc-cur"/>`;
  /* 外圈：十二时辰名，单字、按吉凶着色，沿圆周环布（WHEEL.ring） */
  '子丑寅卯辰巳午未申酉戌亥'.split('').forEach(function(nm,i){
    const dg=i*30, tp=WHEEL.px(W_LAB_OUT,dg);
    const seg=LHL_SC.filter(function(x,k){const sp=scSpan(k);return dg>=sp[0]&&dg<sp[1];})[0];
    const col=(seg&&seg.good)?'var(--wheel-good)':'var(--wheel-bad)';
    s+=`<text x="${WHEEL.n(tp[0])}" y="${WHEEL.n(tp[1])}" class="w-lab w-lab-xl${i===LHL_SC_SEL?' w-lab-cur':''}"`
      +` data-i="${i}" style="fill:${col}"`
      +` transform="rotate(${WHEEL.ring(dg)} ${WHEEL.n(tp[0])} ${WHEEL.n(tp[1])})">${nm}</text>`;
  });
  /* 内圈：该宫干支，两字、**一律径向散射**（聚焦向盘心）。环布只给最外圈，
     内圈全圈同一种放射排法才整齐；给内圈也套环布，整盘就失了“外圈一条环带”的层次。 */
  for(let i=0;i<12;i++){
    const dg=i*30, tp=WHEEL.px(W_LAB_IN,dg), gz=LHL_SC[i]?LHL_SC[i].gz:'';
    s+=`<text x="${WHEEL.n(tp[0])}" y="${WHEEL.n(tp[1])}" class="w-lab w-lab-lg"`
      +` transform="rotate(${WHEEL.radial(dg)} ${WHEEL.n(tp[0])} ${WHEEL.n(tp[1])})">${gz}</text>`;
  }
  s+=`<circle cx="${W_C}" cy="${W_C}" r="${W_OUT}" class="w-ring"/>`;
  s+=`<circle cx="${W_C}" cy="${W_C}" r="${W_IN}" class="w-ring"/>`;
  s+=`<circle cx="${W_C}" cy="${W_C}" r="${W_CORE}" class="w-core"/>`;
  /* 指针只走盘心与内界圈之间，不穿过盘心文字 */
  const q0=WHEEL.px(W_P0,curDg), q1=WHEEL.px(W_P1,curDg);
  s+=`<line id="lhlScNeedle" x1="${WHEEL.n(q0[0])}" y1="${WHEEL.n(q0[1])}" x2="${WHEEL.n(q1[0])}" y2="${WHEEL.n(q1[1])}" class="w-needle"/>`;
  s+=`<circle id="lhlScDot" cx="${WHEEL.n(q1[0])}" cy="${WHEEL.n(q1[1])}" r="3.5" class="w-dot"/>`;
  s+=`<text x="${W_C}" y="${W_C-16}" class="w-c1" id="lhlScC1">${cur.name}</text>`;
  s+=`<text x="${W_C}" y="${W_C+14}" class="w-c2" id="lhlScC2" style="font-weight:700;fill:${cur.good?'var(--wheel-good)':'var(--wheel-bad)'}">${cur.luck}</text>`;
  s+=`<text x="${W_C}" y="${W_C+34}" class="w-c3" id="lhlScC3">${cur.gz} ${cur.range}</text>`;
  return `<svg class="wheel" id="lhlScWheel" viewBox="0 0 440 440" role="img" aria-label="十二时辰吉凶盘">${s}</svg>`;
}
function lhlScDetailHTML(x){
  return `${x.gz}时，<span class="${x.good?'wd-g':'wd-x'}">${x.luck}</span>，值神 ${x.shen||'未载'}`
    +`<span class="wd-br"></span>宜 ${x.yi}`;
}
function lhlPickShichen(i){
  if(!LHL_SC||!LHL_SC[i]) return;
  LHL_SC_SEL=i;
  const x=LHL_SC[i], sp=scSpan(i);
  WHEEL.pick('lhlScWheel',i);
  /* 早子时与夜子时共用一个“子”字，夜子（序号 12）要落到 0 号字上，否则无字可高亮 */
  WHEEL.lab('lhlScWheel',i===12?0:i);
  wheelSpot(SC_IDS,scMid(i),sp[0],sp[1]);
  WHEEL.text('lhlScC1',x.name);
  WHEEL.text('lhlScC2',x.luck,x.good?'var(--wheel-good)':'var(--wheel-bad)');
  WHEEL.text('lhlScC3',x.gz+' '+x.range);
  const d=document.getElementById('lhlScDetail'); if(d) d.innerHTML=lhlScDetailHTML(x);
}
/* 二十八宿盘：二十八宿排成圆环，四象各七宿。
   🔴 环向为逆时针，角宿起于 135 度：二十八宿的象序是东、北、西、南，
   顺此序绕行正合逆时针，于是东方青龙落正右（东）、北方玄武落正上（北）、
   西方白虎落正左（西）、南方朱雀落正下（南）。若改顺时针，四象会全部错到对角上。
   外圈放四象方位单字（东 北 西 南），正与经络圆盘外圈排地支同制式；
   四象全名（如“北方玄武”）在盘心第三行与详情条给出。 */
const XIU_28=['角','亢','氐','房','心','尾','箕','斗','牛','女','虚','危','室','壁',
  '奎','娄','胃','昴','毕','觜','参','井','鬼','柳','星','张','翼','轸'];
/* 象序：名、全名、起宿、止宿、外圈单字、方位色。
   方位色与万年历节气盘四季名同一组降调色（东青 南赤 西白 北玄 对应 木 火 金 水）。 */
const XIU_XIANG=[
  ['青龙','东方青龙',0,7,'东','#5a8f45'],
  ['玄武','北方玄武',7,14,'北','#3f6d96'],
  ['白虎','西方白虎',14,21,'西','#a8813a'],
  ['朱雀','南方朱雀',21,28,'南','#b8543f']];
const XIU_W=360/28, XIU_A0=135;   /* 角宿起点角 */
let LHL_XIU=null, LHL_XIU_CUR=0, LHL_XIU_SEL=0;
/* 第 i 宿在环上的角度区间：自 a0 顺时针到 a1（a0 小于 a1） */
function xiuSpan(i){return [XIU_A0-(i+1)*XIU_W, XIU_A0-i*XIU_W];}
function xiuMid(i){return XIU_A0-(i+0.5)*XIU_W;}
const XIU_IDS={arc:'lhlXiuArc',needle:'lhlXiuNeedle',dot:'lhlXiuDot'};
function xiuWheel(lunar){
  const cur=lunar.getXiu();
  LHL_XIU_CUR=Math.max(0,XIU_28.indexOf(cur));
  LHL_XIU_SEL=LHL_XIU_CUR;
  LHL_XIU=XIU_28.map(function(nm,i){
    const luck=(LunarUtil.XIU_LUCK&&LunarUtil.XIU_LUCK[nm])||'';
    const xg=XIU_XIANG.filter(x=>i>=x[2]&&i<x[3])[0]||['','','','',''];
    /* 宿曜全名＝宿＋七曜＋禽兽（如室火猪），盘心与详情用全名，与基础信息条同口径 */
    return {nm:nm,full:nm+((LunarUtil.ZHENG&&LunarUtil.ZHENG[nm])||'')+((LunarUtil.ANIMAL&&LunarUtil.ANIMAL[nm])||''),

function pickJQ(y,m,d,name,ref,greater){

function baiSegment(y,m,d){

    <div class="lhl-i"><span class="k">太岁</span><span class="v">${taiSuiText(ygz,yZhi,suiPo)}</span></div>

    <div class="lhl-i"><span class="k">建除</span><span class="v">${lunar.getZhiXing()}日（${jian12Tag(lunar.getZhiXing())}）</span></div>
    <div class="lhl-i"><span class="k">吉神宜趋</span><span class="v yi">${lunar.getDayJiShen().join('、')||'无'}</span></div>
    <div class="lhl-i"><span class="k">凶煞宜忌</span><span class="v ji">${lunar.getDayXiongSha().join('、')||'无'}</span></div>
    <div class="lhl-i"><span class="k">纳音</span><span class="v">${ngwRow('年',lunar.getYearNaYin(),ygz,GAN_WX[ygz[0]],lunar.getYearShengXiao())}<span class="lhl-br"></span>${ngwRow('月',lunar.getMonthNaYin(),mgz,GAN_WX[mgz[0]],lunar.getMonthShengXiao())}<span class="lhl-br"></span>${ngwRow('日',lunar.getDayNaYin(),dgz,GAN_WX[dgz[0]],lunar.getDayShengXiao())}<span class="lhl-br"></span>${ngwRow('时',hTime.getNaYin(),hTime.getGanZhi(),GAN_WX[hTime.getGanZhi()[0]],hTime.getShengXiao())}</span></div>
    <div class="lhl-i"><span class="k">节气</span><span class="v">${lunar.getJieQi()?('当前：'+lunar.getJieQi()+'<span class="lhl-br"></span>'):''}上：${pj.getName()} ${pj.getSolar().toYmd()}<span class="lhl-br"></span>下：${nj.getName()} ${nj.getSolar().toYmd()}</span></div>

    <div class="lhl-i lhl-oneline"><span class="k">空亡所值</span><span class="v">年：${lunar.getYearXunKong()}<span class="lhl-br"></span>月：${lunar.getMonthXunKong()}<span class="lhl-br"></span>日：${lunar.getDayXunKong()}</span></div>
    <div class="lhl-i lhl-oneline"><span class="k">胎神</span><span class="v"><span class="lhl-s">本月：${taiShen(mgz[0],mZhi)}</span><span class="lhl-br"></span><span class="lhl-s">今日：${taiShen(dyGan,dyZhi)}</span></span></div>
    <div class="lhl-i"><span class="k">吉神方位</span><span class="v">喜神${lunar.getDayPositionXiDesc()}、福神${lunar.getDayPositionFuDesc()}、财神${lunar.getDayPositionCaiDesc()}<span class="lhl-br"></span>阳贵${lunar.getDayPositionYangGuiDesc()}、阴贵${lunar.getDayPositionYinGuiDesc()}<span class="lhl-br"></span>日禄：${lunar.getDayLu()}</span></div>
    <div class="lhl-i"><span class="k">二十八宿</span><span class="v">${lunar.getXiu()}${lunar.getZheng()}${lunar.getAnimal()}（${lunar.getXiuLuck()}）</span></div>
    <div class="lhl-i"><span class="k">彭祖百忌</span><span class="v">${lunar.getPengZuGan()}<span class="lhl-br"></span>${lunar.getPengZuZhi()}</span></div>
  </div>`;

  /* 双圆盘：时辰盘紧随“时辰吉凶”格阵，是同一份数据的图形化，看的是全天吉凶分布与当前所在；
     宿盘同排，看的是二十八宿的吉凶分布与当日之宿。两盘盘心默认显示当前项，点扇区改看别项。 */
  html+=`<div class="wheel-wheels">
    <div class="wheel-block"><h4>十二时辰吉凶盘</h4>${shichenWheel(lunar)}<div class="wheel-detail" id="lhlScDetail">${lhlScDetailHTML(LHL_SC[LHL_SC_CUR])}</div></div>
    <div class="wheel-block"><h4>二十八宿盘</h4>${xiuWheel(lunar)}<div class="wheel-detail" id="lhlXiuDetail">${lhlXiuDetailHTML(LHL_XIU_CUR,LHL_XIU[LHL_XIU_CUR],(LunarUtil.XIU_SONG&&LunarUtil.XIU_SONG[LHL_XIU[LHL_XIU_CUR].nm])||'')}</div></div>
  </div>`;
  /* 九宫飞星（置于双盘下方） */
  const dStar=dayStar(y,m,d), hStar=hourStar(y,m,d), shName=curShichen();
  html+=`<details class="fold-block"><summary class="rel-title">九宫飞星</summary><div class="fei-wrap">
    <div class="fei-block"><div class="fei-cap">年飞星（${y}年 ${FEI_NAME[yStar]}入中）</div>${feiGridHTML(yStar)}</div>
    <div class="fei-block"><div class="fei-cap">月飞星（${m}月 ${FEI_NAME[mStar]}入中）</div>${feiGridHTML(mStar)}</div>
    <div class="fei-block"><div class="fei-cap">日飞星（${m}月${d}日 ${FEI_NAME[dStar]}入中）</div>${feiGridHTML(dStar)}</div>
    <div class="fei-block"><div class="fei-cap">时飞星（当前${shName}时 ${FEI_NAME[hStar]}入中）</div>${feiGridHTML(hStar)}</div>
  </div></details>`;
  document.getElementById('out').innerHTML=html;
  lhApplyFold();
 }catch(e){
  document.getElementById('out').innerHTML='<p class="notice">排盘出错：'+((e&&e.message)?e.message:e)+'</p>';
 }
}
/* 九宫飞星折叠框随查询重建，重建后应用记忆态；键按页独立，localStorage 主存、sessionStorage 隐私兜底 */
function lhSaveFold(){
  const dv=document.querySelector('#out details.fold-block'); if(!dv) return;
  const v=JSON.stringify({fei:dv.open});
  try{ localStorage.setItem('lhlFoldState', v); }catch(e){}
  try{ sessionStorage.setItem('lhlFoldState', v); }catch(e){}
}
function lhApplyFold(){
  let s=null;
  try{ s=JSON.parse(localStorage.getItem('lhlFoldState')||sessionStorage.getItem('lhlFoldState')||'null'); }catch(e){}
  const dv=document.querySelector('#out details.fold-block');
  if(dv && s && typeof s.fei==='boolean') dv.open=s.fei;
}
document.addEventListener('toggle',function(e){
  if(e.target && e.target.matches && e.target.matches('#out details.fold-block')) lhSaveFold();
},true);

mountAI(function(){
  const v=document.getElementById('dInput').value; if(!v) return '';
  const [y,m,d]=v.split('-').map(Number);
  const solar=Solar.fromYmd(y,m,d), lunar=solar.getLunar();
  const LU={甲:'寅',乙:'卯',丙:'巳',丁:'午',戊:'巳',己:'午',庚:'申',辛:'酉',壬:'亥',癸:'子'};
  const OPP={子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};
  const CHONG=[['子','午'],['丑','未'],['寅','申'],['卯','酉'],['辰','戌'],['巳','亥']];
  const isChong=(a,b)=>CHONG.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
  const yGZ=lunar.getYearInGanZhi(), mGZ=lunar.getMonthInGanZhi(), dGZ=lunar.getDayInGanZhi();
  const hTimes=lunar.getTimes(), hrNow=new Date().getHours();
  const hTime=hTimes.find(t=>{const lo=+t.getMinHm().slice(0,2), hi=+t.getMaxHm().slice(0,2); return hrNow>=lo&&hrNow<=hi;})||hTimes[0];
  const yearZhi=lunar.getYearZhi(), monthZhi=mGZ[1], dayGan=dGZ[0], dayZhi=dGZ[1];
  const suiPo=Object.keys(ZHI_FANG).find(k=>pairChong(k,yearZhi))||'';
  const xing=(XING_TAI[yearZhi]||[]).map(x=>ZHI_SHENG[x]).join('')||'无';
  const hai=ZHI_SHENG[HAI_TAI[yearZhi]]||'无', po=ZHI_SHENG[PO_TAI[yearZhi]]||'无';
  const yx=lunar.getYueXiang();
  let chong3=''; const gzs=[yGZ,mGZ,dGZ];
  for(let i=0;i<3;i++)for(let j=i+1;j<3;j++){ if(isChong(gzs[i][1],gzs[j][1])) chong3+=(i===0?'年':i===1?'月':'日')+(j===0?'年':j===1?'月':'日')+'柱相冲('+gzs[i][1]+gzs[j][1]+')；'; }
  const shName=curShichen();
  const pj=lunar.getPrevJieQi(), nj=lunar.getNextJieQi();
  const jqText=(lunar.getJieQi()?('当前：'+lunar.getJieQi()+'  '):'')+'上：'+pj.getName()+' '+pj.getSolar().toYmd()+'  下：'+nj.getName()+' '+nj.getSolar().toYmd();
  function feiText(center){ const g=feiXingGrid(center); const out=[]; for(let r=1;r<=3;r++){ const row=[]; for(let c=1;c<=3;c++){ const n=g[r+','+c]; row.push(FEI_NAME[n]+'('+FEI_WX[n]+')'); } out.push('  '+row.join(' ')); } return out.join('\n'); }
  let hh='';
  try{
    const times=lunar.getTimes();
    const hmRange=t=>{const h=+t.getMaxHm().slice(0,2)+1; return t.getMinHm()+'-'+(h<24?String(h).padStart(2,'0')+':00':'24:00');};
    times.forEach((t,i)=>{ const luck=t.getTianShenLuck?t.getTianShenLuck():''; const gz=t.getGanZhi(); const yi=lhlYiText(t.getYi&&t.getYi().slice(0,3)); const zName=i===0?'子时':(i===times.length-1?'夜子时':gz.substring(1)+'时'); hh+=`${zName} ${hmRange(t)}：${luck==='吉'?'吉':'凶'}${t.getTianShen?('、'+t.getTianShen()):''} 宜：${yi}\n`; });
  }catch(e){ hh='（时辰数据暂不可用）'; }
  return `公历：${y}年${m}月${d}日 星期${'日一二三四五六'[solar.getWeek()]}
农历：${lunar.getYearInChinese()}年${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}
生肖、星座：${lunar.getYearShengXiao()}、${solar.getXingZuo()}座
月建：${monthZhi}　月相：${yx}
宜：${lunar.getDayYi().join('、')||'诸事不宜'}
忌：${lunar.getDayJi().join('、')||'无'}
岁煞冲煞：
太岁 ${yearZhi}（岁破${OPP[yearZhi]||'无'}）
冲${lunar.getDayChongDesc()} 煞${lunar.getDaySha()}
太岁：
太岁神君：${TAISUI_STAR[yGZ]||'未载'}大将军
犯太岁：值${ZHI_SHENG[yearZhi]}冲${ZHI_SHENG[suiPo]}刑${xing}害${hai}破${po}
三柱相冲：
三柱互冲：${chong3||'无'}
值神（黄道黑道）：
值神：${lunar.getDayTianShen()}（${lunar.getDayTianShenType()}）
建除（建除派黄黑）：
建除：${lunar.getZhiXing()}日（${jian12Tag(lunar.getZhiXing())}）
吉神宜趋：${lunar.getDayJiShen().join('、')||'无'}
凶煞宜忌：${lunar.getDayXiongSha().join('、')||'无'}
纳音干支五行生肖：
年 ${lunar.getYearNaYin()} ${yGZ} ${GAN_WX[yGZ[0]]} ${lunar.getYearShengXiao()}
月 ${lunar.getMonthNaYin()} ${mGZ} ${GAN_WX[mGZ[0]]} ${lunar.getMonthShengXiao()}
日 ${lunar.getDayNaYin()} ${dGZ} ${GAN_WX[dGZ[0]]} ${lunar.getDayShengXiao()}
时 ${hTime.getNaYin()} ${hTime.getGanZhi()} ${GAN_WX[hTime.getGanZhi()[0]]} ${hTime.getShengXiao()}
 节气：${jqText}

阳贵${lunar.getDayPositionYangGuiDesc()}、阴贵${lunar.getDayPositionYinGuiDesc()}

九宫飞星：
