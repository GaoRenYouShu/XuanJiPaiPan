<script>
renderChrome('daoli.html');
let cur = new Date();
let lastKey = '';
/* 本地计算辅助：DIZHI_CHONG/pairChong、太岁常量分别由 assets/xuanji-lib.js、assets/taisui-data.js 共享提供 */
const ZHI_FANG={子:'北',丑:'东北',寅:'东北',卯:'东',辰:'东南',巳:'东南',午:'南',未:'西南',申:'西南',酉:'西',戌:'西北',亥:'西北'};
function taiSuiText(ygz,yZhi,suiPo){
  const star=TAISUI_STAR[ygz]||'未载';
  const xing=(XING_TAI[yZhi]||[]).map(x=>ZHI_SHENG[x]).join('')||'无';
  const hai=ZHI_SHENG[HAI_TAI[yZhi]]||'无', po=ZHI_SHENG[PO_TAI[yZhi]]||'无';
  return `太岁神君：${star}大将军<span class="dao-br"></span>犯太岁：值${ZHI_SHENG[yZhi]}冲${ZHI_SHENG[suiPo]}刑${xing}害${hai}破${po}`;
}
const GAN_TAISHEN={甲:'门',己:'门',乙:'碓磨',庚:'碓磨',丙:'厨灶',辛:'厨灶',丁:'仓库',壬:'仓库',戊:'房',癸:'房'};
const ZHI_TAISHEN={子:'碓磨',丑:'厕',寅:'户',卯:'门',辰:'厨',巳:'灶',午:'厕',未:'井',申:'仓',酉:'户',戌:'房',亥:'床'};
function taiShen(gan,zhi){return '占'+GAN_TAISHEN[gan]+'、'+ZHI_TAISHEN[zhi];}
function curShichen(){const hr=new Date().getHours();return ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'][(Math.floor((hr+1)/2))%12];}
const JIAZI60=(function(){const G=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'],Z=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];const a=[];for(let i=0;i<60;i++)a.push(G[i%10]+Z[i%12]);return a;})();
function gzIndex(gz){return JIAZI60.indexOf(gz)+1;}
/* 当日卦象：京房纳甲重卦（上卦取日天干纳甲，下卦取日地支纳甲）；卦名取 assets/gua.js，卦辞取 assets/jingwen.js */
const GAN_NAJIA={甲:1,乙:8,丙:7,丁:2,戊:6,己:3,庚:4,辛:5,壬:1,癸:8};
const ZHI_NAJIA={子:6,丑:7,寅:7,卯:4,辰:5,巳:5,午:3,未:8,申:8,酉:2,戌:1,亥:1};
function dayGuaName(gan,zhi){ return guaName(XT2NAME[GAN_NAJIA[gan]], XT2NAME[ZHI_NAJIA[zhi]]); }
/* 先天值日卦：日干支六十甲子序对伏羲六十四卦圆图序（内卦八组，外卦依乾兑离震巽坎艮坤轮转），文化参考 */
const XIANTIAN_YUANTU=[
  '乾为天','泽天夬','火天大有','雷天大壮','风天小畜','水天需','山天大畜','地天泰',
  '天泽履','兑为泽','火泽睽','雷泽归妹','风泽中孚','水泽节','山泽损','地泽临',
  '天火同人','泽火革','离为火','雷火丰','风火家人','水火既济','山火贲','地火明夷',
  '天雷无妄','泽雷随','火雷噬嗑','震为雷','风雷益','水雷屯','山雷颐','地雷复',
  '天风姤','泽风大过','火风鼎','雷风恒','巽为风','水风井','山风蛊','地风升',
  '天水讼','泽水困','火水未济','雷水解','风水涣','坎为水','山水蒙','地水师',
  '天山遁','泽山咸','火山旅','雷山小过','风山渐','水山蹇','艮为山','地山谦',
  '天地否','泽地萃','火地晋','雷地豫','风地观','水地比','山地剥','坤为地'];
function dayGuaXiantian(gz){ const s=gzIndex(gz)-1; return XIANTIAN_YUANTU[((s%64)+64)%64]; }
function pickJQ(y,m,d,name,ref,greater){
  const cand=[]; for(const ly of [y-1,y,y+1]){ const s=Solar.fromYmd(ly,1,1).getLunar().getJieQiTable()[name]; if(s) cand.push(s.getYear()*10000+s.getMonth()*100+s.getDay()); }
  cand.sort((a,b)=>a-b);
  if(!greater){ let ch=null; for(const c of cand) if(c<=ref) ch=c; return ch===null?cand[0]:ch; }
  let ch=cand[cand.length-1]; for(const c of cand) if(c>ref){ ch=c; break; } return ch;
}
/* 日白三元：按查询日所在节气定阳遁三段（冬至→雨水一白、雨水→谷雨七赤、谷雨→夏至四白顺）与阴遁三段（夏至→处暑九紫、处暑→霜降三碧、霜降→冬至六白逆） */
function baiSegment(y,m,d){
  const q=y*10000+m*100+d;
  const DZ=pickJQ(y,m,d,'冬至',q,false);
  const YS=pickJQ(y,m,d,'雨水',DZ,true), GY=pickJQ(y,m,d,'谷雨',DZ,true), XZ=pickJQ(y,m,d,'夏至',DZ,true), CZ=pickJQ(y,m,d,'处暑',DZ,true), SJ=pickJQ(y,m,d,'霜降',DZ,true);
  if(q>=DZ&&q<YS) return {base:1,dir:1};
  if(q>=YS&&q<GY) return {base:7,dir:1};
  if(q>=GY&&q<XZ) return {base:4,dir:1};
  if(q>=XZ&&q<CZ) return {base:9,dir:-1};
  if(q>=CZ&&q<SJ) return {base:3,dir:-1};
  return {base:6,dir:-1};
}
/* 年飞星入中宫：三元九运 180 年一循环，年紫白入中诀上元甲子一白求、中元甲子四绿游、下元甲子七赤起，九星逆行顺年头；锚点：上元起 1864（甲子年一白入中） */
function yearStar(y){
  const C=180; const idx=(((y-1864)%C)+C)%C; const base=idx<60?1:(idx<120?4:7);
  const off=(((y-1864)%60)+60)%60; let s=(base-off)%9; if(s<=0)s+=9; return s;
}
/* 月飞星入中宫：月家紫白，正月起星按年支三组定（子午卯酉八白、辰戌丑未五黄、寅申巳亥二黑），按节气月序逐月逆减 */
function monthStar(y,zhi,monthZhi){
  const base={子:8,午:8,卯:8,酉:8,辰:5,戌:5,丑:5,未:5,寅:2,申:2,巳:2,亥:2}[zhi];
  const MZ=['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'];  /* 节气月序：寅=正月 … 丑=十二月 */
  const mi=MZ.indexOf(monthZhi); /* 0 基 */
  let s=(base-mi)%9; if(s<=0)s+=9; return s;
}
const FEI_WX={1:'水',2:'土',3:'木',4:'木',5:'土',6:'金',7:'金',8:'土',9:'火'};
const FEI_NAME={1:'一白',2:'二黑',3:'三碧',4:'四绿',5:'五黄',6:'六白',7:'七赤',8:'八白',9:'九紫'};
/* 九宫飞星：洛书顺飞，年家/月家/日家/时家紫白共用一图 */
function feiXingGrid(center){
  const order=[5,6,7,8,9,1,2,3,4];
  const pmap={1:[3,2],2:[1,3],3:[2,1],4:[1,1],5:[2,2],6:[3,3],7:[2,3],8:[3,1],9:[1,2]};
  const grid={};
  order.forEach((p,i)=>{ const star=((center-1+i)%9)+1; const pos=pmap[p]; grid[pos[0]+','+pos[1]]=star; });
  return grid;
}
/* 日飞星入中宫：值日星 = 本元甲子入中星 ± 距最近甲子日天数（阳顺加、阴逆减） */
function dayStar(y,m,d){
  const n=gzIndex(Solar.fromYmd(y,m,d).getLunar().getDayInGanZhi());
  const off=(n-1+60)%60;
  const seg=baiSegment(y,m,d);
  let s=((seg.base-1+seg.dir*off)%9+9)%9+1; return s;
}
/* 时飞星入中宫（时家紫白，《协纪辨方书》《选择纪要》通行例）：
   以日支分三组定子时起星：子午卯酉日为仲（冬至后一白、夏至后九紫）、辰戌丑未日为季（冬至后四绿、夏至后六白）、
   寅申巳亥日为孟（冬至后七赤、夏至后三碧）；冬至后顺行、夏至后逆行，一时一星。
   锚点：子日子时冬至后一白；辰日辰时（第四时辰）夏至后三碧。 */
function hourStar(y,m,d){
  const dz=Solar.fromYmd(y,m,d).getLunar().getDayInGanZhi()[1];
  const g={子:0,午:0,卯:0,酉:0,辰:1,戌:1,丑:1,未:1,寅:2,申:2,巳:2,亥:2}[dz]||0;
  const si=(Math.floor((new Date().getHours()+1)/2))%12;
  const asc=baiSegment(y,m,d).dir===1;
  const start=asc?[1,4,7][g]:[9,6,3][g];
  let s=asc?((start-1+si)%9)+1:((start-1-si)%9+9)%9+1; return s;
}
function feiGridHTML(center){
  const g=feiXingGrid(center); let h='<div class="fei-grid">';
  for(let r=1;r<=3;r++)for(let c=1;c<=3;c++){
    const n=g[r+','+c]||'';
    h+=`<div class="fei-cell fei-${n}"><span class="fei-n">${n}</span><span class="fei-t">${FEI_NAME[n]}</span><span class="fei-w">${FEI_WX[n]}</span></div>`;
  }
  h+='</div>'; return h;
}
/* ===== 双圆盘：十二时辰吉凶盘 + 圣诞圆盘 =====
   与老黄历、万年历、佛历同一套通用件（assets/wheel.js 的 WHEEL ＋ style.css 的 .wheel/.w-*），
   此处只给本页数据与令牌（--wheel-* 在 .page-daoli 段定义，主体色取玄青）。
   第二盘为本页专属的圣诞圆盘（道历当月神仙圣诞），不照搬别页的盘：照搬即与本页「二十八宿」条重复。
🔴 取字角全站一例：**最外圈**环名一律沿圆周环布（WHEEL.ring），字头朝盘外、随切线转向——
   正上横排、右半圈顺时针转向、正下倒排，整圈读作一条环带；单字两字同法，两字一前一后落于切线。
   内侧各圈照旧：单字走 WHEEL.dir（四正正立、其余沿半径散射），两字走 WHEEL.radial（全圈放射聚焦盘心）。
   🔴 热区外沿 198（＝弧带外沿 192 再外扩 6），命中区与悬停着色同取此值，与另三页同沿。
   🔴 一色两重：弧带＝主体色 .22 淡线（3px）、加粗弧＝主体色实色（4px）；--wheel-cur 恒等于本页主体色。
   **本页两盘都只有「选中那一段」是实色，其余一律淡线**，时辰盘与圣诞圆盘都不预标实色。
   🔴 盘内只有热区接事件（.wheel{pointer-events:none} ＋ .w-hit{pointer-events:all}），
   否则文字包围盒会吞掉落在字上的点击。 */
const DL_C=220, DL_ARC=192, DL_OUT=182, DL_IN=120, DL_CORE=78,
  DL_LAB_IN=148, DL_LAB_OUT=206, DL_TICK0=168, DL_TICK1=176, DL_P0=82, DL_P1=116,
  DL_HIT1=DL_ARC+6;
let DL_SC=null, DL_SC_CUR=0, DL_SC_SEL=0;
/* 库在无宜事时回传单元素数组 ['无']，非空故空值兜底不触发；此处归一为「诸事不宜」，与当日宜同口径 */
function dlYiText(a){const s=(a||[]).join('、');return(!s||s==='无')?'诸事不宜':s;}
/* 建除十二神自有一套黄黑，口诀：建满平收黑，除危定执黄，成开皆可用，破闭不可当；与值神的黄道黑道是两派，并列同存不合并 */
const JIAN12_HUANG=['除','危','定','执'], JIAN12_HEI=['建','满','平','收'], JIAN12_KAI=['成','开'];
function jian12Tag(zx){
  if(JIAN12_HUANG.indexOf(zx)>=0) return '建除派黄';
  if(JIAN12_HEI.indexOf(zx)>=0) return '建除派黑';
  return JIAN12_KAI.indexOf(zx)>=0?'成开皆可用':'破闭不可当';
}
function dlScData(t,i,last){
  const luck=(t.getTianShenLuck&&t.getTianShenLuck())||'';
  const h=+t.getMaxHm().slice(0,2)+1;
  return {name:i===0?'子时':(last?'夜子时':t.getGanZhi().substring(1)+'时'),
    gz:t.getGanZhi(), luck:luck, good:luck==='吉',
    shen:t.getTianShen?(''+t.getTianShen()):'',
    range:t.getMinHm()+'-'+(h<24?String(h).padStart(2,'0')+':00':'24:00'),
    yi:dlYiText(t.getYi&&t.getYi().slice(0,3))};
}
/* 第 i 段的起止钟点：0 号为早子时（1 小时）、12 号为夜子时（1 小时），其余 1 至 11 号各 2 小时。
   全盘按真实时长分角（1 小时 15 度），合计正好 360 度，与库 getTimes() 的十三项一一对应。 */
function dlScHour(i){const h0=(i===0)?0:((i===12)?23:2*i-1);return [h0,h0+((i===0||i===12)?1:2)];}
function dlScSpan(i){const h=dlScHour(i);return [h[0]*15,h[1]*15];}
function dlScMid(i){const sp=dlScSpan(i);return (sp[0]+sp[1])/2;}
/* 加粗弧、指针、圆点三件随选中走的公共改写，两盘共用 */
function dlWheelSpot(ids,dg,a0,a1){
  const arc=document.getElementById(ids.arc);
  if(arc) arc.setAttribute('d',WHEEL.arc(DL_ARC,a0,a1));
  const q0=WHEEL.px(DL_P0,dg), q1=WHEEL.px(DL_P1,dg);
  const ln=document.getElementById(ids.needle);
  if(ln){
    ln.setAttribute('x1',WHEEL.n(q0[0])); ln.setAttribute('y1',WHEEL.n(q0[1]));
    ln.setAttribute('x2',WHEEL.n(q1[0])); ln.setAttribute('y2',WHEEL.n(q1[1]));
  }
  const dt=document.getElementById(ids.dot);
  if(dt){ dt.setAttribute('cx',WHEEL.n(q1[0])); dt.setAttribute('cy',WHEEL.n(q1[1])); }
}
const DL_SC_IDS={arc:'daoScArc',needle:'daoScNeedle',dot:'daoScDot'};
function daoShichenWheel(lunar){
  const times=lunar.getTimes();
  DL_SC=times.map((t,i)=>dlScData(t,i,i===times.length-1));
  const hr=new Date();
  DL_SC_CUR=Math.max(0,times.findIndex(t=>hr.getHours()>=+t.getMinHm().slice(0,2)&&hr.getHours()<=+t.getMaxHm().slice(0,2)));
  DL_SC_SEL=DL_SC_CUR;
  const cur=DL_SC[DL_SC_SEL], curSp=dlScSpan(DL_SC_SEL), curDg=dlScMid(DL_SC_SEL);
  let s='';
  /* 十三段弧：段间不留缝，整圈是一条淡环；加粗那段另出一条，随选中走 */
  DL_SC.forEach(function(x,i){
    const sp=dlScSpan(i);
    s+=`<path d="${WHEEL.arc(DL_ARC,sp[0],sp[1])}" class="w-arc"/>`;
  });
  /* 刻度落在十二宫中点，与两侧文字同轴，连成辐条 */
  for(let i=0;i<12;i++){
    const dg=i*30, ta=WHEEL.px(DL_TICK0,dg), tb=WHEEL.px(DL_TICK1,dg);
    s+=`<line x1="${WHEEL.n(ta[0])}" y1="${WHEEL.n(ta[1])}" x2="${WHEEL.n(tb[0])}" y2="${WHEEL.n(tb[1])}" class="w-tick"/>`;
  }
  /* 热区只取环带（内界圈到弧带外沿），不盖盘心 */
  DL_SC.forEach(function(x,i){
    const sp=dlScSpan(i);
    s+=`<path d="${WHEEL.band(DL_IN,DL_HIT1,sp[0],sp[1])}" class="w-hit${i===DL_SC_SEL?' is-on':''}" data-i="${i}" onclick="daoPickShichen(${i})"/>`;
    s+=`<path d="${WHEEL.band(DL_IN,DL_HIT1,sp[0],sp[1])}" class="w-sel"/>`;
  });
  s+=`<path id="daoScArc" d="${WHEEL.arc(DL_ARC,curSp[0],curSp[1])}" class="w-arc w-arc-cur"/>`;
  /* 外圈：十二时辰名，单字、按吉凶着色；沿圆周环布（WHEEL.ring） */
  '子丑寅卯辰巳午未申酉戌亥'.split('').forEach(function(nm,i){
    const dg=i*30, tp=WHEEL.px(DL_LAB_OUT,dg);
    const seg=DL_SC.filter(function(x,k){const sp=dlScSpan(k);return dg>=sp[0]&&dg<sp[1];})[0];
    const col=(seg&&seg.good)?'var(--wheel-good)':'var(--wheel-bad)';
    s+=`<text x="${WHEEL.n(tp[0])}" y="${WHEEL.n(tp[1])}" class="w-lab w-lab-xl${i===DL_SC_SEL?' w-lab-cur':''}"`
      +` data-i="${i}" style="fill:${col}"`
      +` transform="rotate(${WHEEL.ring(dg)} ${WHEEL.n(tp[0])} ${WHEEL.n(tp[1])})">${nm}</text>`;
  });
  /* 内圈：该宫干支，两字、**一律径向散射**（聚焦向盘心）。四正只约束外圈的方位标记，
     内圈全圈同一种放射排法才整齐；给内圈也套四正，正上与正下的字会突然转成横排。 */
  for(let i=0;i<12;i++){
    const dg=i*30, tp=WHEEL.px(DL_LAB_IN,dg), gz=DL_SC[i]?DL_SC[i].gz:'';
    s+=`<text x="${WHEEL.n(tp[0])}" y="${WHEEL.n(tp[1])}" class="w-lab w-lab-lg"`
      +` transform="rotate(${WHEEL.radial(dg)} ${WHEEL.n(tp[0])} ${WHEEL.n(tp[1])})">${gz}</text>`;
  }
  s+=`<circle cx="${DL_C}" cy="${DL_C}" r="${DL_OUT}" class="w-ring"/>`;
  s+=`<circle cx="${DL_C}" cy="${DL_C}" r="${DL_IN}" class="w-ring"/>`;
  s+=`<circle cx="${DL_C}" cy="${DL_C}" r="${DL_CORE}" class="w-core"/>`;
  /* 指针只走盘心与内界圈之间，不穿过盘心文字 */
  const q0=WHEEL.px(DL_P0,curDg), q1=WHEEL.px(DL_P1,curDg);
  s+=`<line id="daoScNeedle" x1="${WHEEL.n(q0[0])}" y1="${WHEEL.n(q0[1])}" x2="${WHEEL.n(q1[0])}" y2="${WHEEL.n(q1[1])}" class="w-needle"/>`;
  s+=`<circle id="daoScDot" cx="${WHEEL.n(q1[0])}" cy="${WHEEL.n(q1[1])}" r="3.5" class="w-dot"/>`;
  s+=`<text x="${DL_C}" y="${DL_C-16}" class="w-c1" id="daoScC1">${cur.name}</text>`;
  s+=`<text x="${DL_C}" y="${DL_C+14}" class="w-c2" id="daoScC2" style="font-weight:700;fill:${cur.good?'var(--wheel-good)':'var(--wheel-bad)'}">${cur.luck}</text>`;
  s+=`<text x="${DL_C}" y="${DL_C+34}" class="w-c3" id="daoScC3">${cur.gz} ${cur.range}</text>`;
  return `<svg class="wheel" id="daoScWheel" viewBox="0 0 440 440" role="img" aria-label="十二时辰吉凶盘">${s}</svg>`;
}
/* 盘下详情条：该时辰的干支、吉凶、值神与宜事。一律不加粗，强调走色（.wd-g/.wd-x）。 */
function daoScDetailHTML(x){
  return `${x.gz}时，<span class="${x.good?'wd-g':'wd-x'}">${x.luck}</span>，值神 ${x.shen||'未载'}`
    +`<span class="wd-br"></span>宜 ${x.yi}`;
}
function daoPickShichen(i){
  if(!DL_SC||!DL_SC[i]) return;
  DL_SC_SEL=i;
  const x=DL_SC[i], sp=dlScSpan(i);
  WHEEL.pick('daoScWheel',i);
  /* 早子时与夜子时共用一个「子」字，夜子（序号 12）要落到 0 号字上，否则无字可高亮 */
  WHEEL.lab('daoScWheel',i===12?0:i);
  dlWheelSpot(DL_SC_IDS,dlScMid(i),sp[0],sp[1]);
  WHEEL.text('daoScC1',x.name);
  WHEEL.text('daoScC2',x.luck,x.good?'var(--wheel-good)':'var(--wheel-bad)');
  WHEEL.text('daoScC3',x.gz+' '+x.range);
  const d=document.getElementById('daoScDetail'); if(d) d.innerHTML=daoScDetailHTML(x);
}
/* ===== 圣诞圆盘（道历当月神仙圣诞） =====
   照佛历斋日盘移植：格＝所选日所在**农历月**的逐日，初一在正上（0 度）、顺时针排，
   格宽 360/当月天数（29 或 30）。用农历月而非公历月，与佛历斋日盘同法，公历月会横跨两个农历月，
   盘心与内圈日名就落不到同一个历法上；空槽在整圈弧上就是一段缺口，看去像画坏了。
   🔴 外圈只放单字（多字沿半径排开会顶出画布），故一日兼逢圣诞与道教吉日时只标优先级最高的一个：
   有圣诞给「诞」，否则有道教吉日给「吉」；全部名目在盘下详情条里列全。
   🔴 「诞」的判据＝**节日名含「诞」**（照佛历 .mk-d），不是「节日表非空」：本库 getFestivals() 是
   道教节日总表，除真圣诞外还有三会日的会名（天会、地会、人会）、神仙下降与成道日、巡天祭灶等，
   一律标「诞」是假语义。非圣诞而属道教节日的日子另存 isFest，不带「诞」字。
   内圈农历日名两字，**一律径向散射**（与斋日盘、经络盘内圈同制式）；最外圈环名沿圆周环布（WHEEL.ring）。
   弧带：全圈一律淡色（.w-arc），**不预标实色**，主体色只给选中的那一段（.w-arc-cur），
   未点之前不冒主体色，选中才高亮。
   盘心三行：农历月日（大）、圣诞、吉日或道教节日（中，属圣诞取主体色）、该日公历（小）。
   盘心只给「圣诞、吉日、道教节日」这类**类目**、不给神仙名：本库最长的一条是「西方太妙至极天尊同白帝七炁天君下降」
   十六字，盘心圆只有 156 宽，全名会撑出圆外；全名一律留给盘下详情条（与佛历斋日盘盘心只给
   「朔望、六斋」同一取舍）。 */
const DL_DAN_C=220, DL_DAN_ARC=192, DL_DAN_OUT=182, DL_DAN_IN=120, DL_DAN_CORE=78,
  DL_DAN_LAB_IN=148, DL_DAN_LAB_OUT=206, DL_DAN_TICK0=168, DL_DAN_TICK1=176,
  DL_DAN_P0=82, DL_DAN_P1=116, DL_DAN_HIT1=DL_DAN_ARC+6;
const DL_DAN_IDS={arc:'daoDanArc',needle:'daoDanNeedle',dot:'daoDanDot'};
let DL_DAN=null, DL_DAN_N=30, DL_DAN_W=12, DL_DAN_LABEL='', DL_DAN_SEL=0;
/* 第 i 格的角度区间：自 a0 顺时针到 a1（a0 小于 a1）；初一在正上（0 度）、顺时针排 */
function dlDanSpan(i){return [i*DL_DAN_W-DL_DAN_W/2, i*DL_DAN_W+DL_DAN_W/2];}
function dlDanMid(i){return i*DL_DAN_W;}
/* 取该农历月逐日的道教节日与道教吉日，逐日数据落在 DL_DAN。
   names 为节日全名（含备注）、isFest 为「有节日」、isDan 为「名含诞即真圣诞」、sp 为道教吉日。 */
function dlDanBuild(lunar){
  const ly=lunar.getYear(), lm=lunar.getMonth();
  const mObj=LunarMonth.fromYm(ly,lm);
  DL_DAN_N=mObj?mObj.getDayCount():30;
  DL_DAN_W=360/DL_DAN_N;
  DL_DAN_LABEL=lunar.getMonthInChinese();
  DL_DAN=[];
  for(let d=1;d<=DL_DAN_N;d++){
    const x=Lunar.fromYmd(ly,lm,d), t=x.getTao();
    const fests=t.getFestivals();
    const names=fests.map(function(f){const rk=f.getRemark&&f.getRemark();return f.getName()+(rk?'（'+rk+'）':'');});
    DL_DAN.push({d:d, name:x.getDayInChinese(), solar:x.getSolar().toYmd(),
      names:names, sp:collectSpecial(t),
      isFest:fests.length>0,
      isDan:fests.some(function(f){return f.getName().indexOf('诞')>=0;})});
  }
  DL_DAN_SEL=Math.min(DL_DAN_N,Math.max(1,lunar.getDay()))-1;
  return DL_DAN_LABEL;
}
/* 外圈单字标记：有圣诞给「诞」，否则有道教吉日给「吉」；两者皆无留空（非圣诞的道教节日不带字） */
function dlDanMark(x){ return x.isDan?'诞':(x.sp.length?'吉':''); }
/* 盘心类目：只写「圣诞、吉日、道教节日」这一档，不写神仙名（见盘首注） */
function dlDanCore(x){
  if(x.isDan) return x.sp.length?'圣诞、吉日':'圣诞';
  if(x.sp.length) return '吉日';
  return x.isFest?'道教节日':'非节庆';
}
function daoDanWheel(lunar){
  dlDanBuild(lunar);
  const curSp=dlDanSpan(DL_DAN_SEL), curX=DL_DAN[DL_DAN_SEL];
  let s='';
  /* 逐格弧：全圈一律淡色（.w-arc），不预标实色，主体色只留给选中的那一段（.w-arc-cur，随选中走）。
     淡环本身已是完整的盘：哪几天有内容由外圈「诞」与「吉」字、内圈日名点出，
     盘心与加粗弧才代表当前项；预标实色会让盘在未点之前就冒出多处主体色，与选中态争焦点。 */
  DL_DAN.forEach(function(x,i){
    const sp=dlDanSpan(i);
    s+=`<path d="${WHEEL.arc(DL_DAN_ARC,sp[0],sp[1])}" class="w-arc"/>`;
  });
  /* 刻度落在每格中点，与两侧文字同轴 */
  for(let i=0;i<DL_DAN_N;i++){
    const dg=dlDanMid(i), ta=WHEEL.px(DL_DAN_TICK0,dg), tb=WHEEL.px(DL_DAN_TICK1,dg);
    s+=`<line x1="${WHEEL.n(ta[0])}" y1="${WHEEL.n(ta[1])}" x2="${WHEEL.n(tb[0])}" y2="${WHEEL.n(tb[1])}" class="w-tick"/>`;
  }
  /* 热区只取环带（内界圈到弧带外沿），不盖盘心 */
  DL_DAN.forEach(function(x,i){
    const sp=dlDanSpan(i);
    s+=`<path d="${WHEEL.band(DL_DAN_IN,DL_DAN_HIT1,sp[0],sp[1])}" class="w-hit${i===DL_DAN_SEL?' is-on':''}" data-i="${i}" onclick="daoPickDan(${i})"/>`;
    s+=`<path d="${WHEEL.band(DL_DAN_IN,DL_DAN_HIT1,sp[0],sp[1])}" class="w-sel"/>`;
  });
  s+=`<path id="daoDanArc" d="${WHEEL.arc(DL_DAN_ARC,curSp[0],curSp[1])}" class="w-arc w-arc-cur"/>`;
  /* 外圈：圣诞、吉日单字，沿圆周环布（WHEEL.ring）；无内容的日子留空 */
  DL_DAN.forEach(function(x,i){
    const mk=dlDanMark(x); if(!mk) return;
    const dg=dlDanMid(i), tp=WHEEL.px(DL_DAN_LAB_OUT,dg);
    s+=`<text x="${WHEEL.n(tp[0])}" y="${WHEEL.n(tp[1])}" class="w-lab w-lab-xl${i===DL_DAN_SEL?' w-lab-cur':''}"`
      +` data-i="${i}" transform="rotate(${WHEEL.ring(dg)} ${WHEEL.n(tp[0])} ${WHEEL.n(tp[1])})">${mk}</text>`;
  });
  /* 内圈：农历日名两字，**一律径向散射**（与斋日盘、经络盘内圈同制式）；
     一圈两字若也套四正，会在初一、十六两处冒出横排，破整圈放射 */
  DL_DAN.forEach(function(x,i){
    const dg=dlDanMid(i), tp=WHEEL.px(DL_DAN_LAB_IN,dg);
    s+=`<text x="${WHEEL.n(tp[0])}" y="${WHEEL.n(tp[1])}" class="w-lab${i===DL_DAN_SEL?' w-lab-cur':''}"`
      +` data-i="${i}" transform="rotate(${WHEEL.radial(dg)} ${WHEEL.n(tp[0])} ${WHEEL.n(tp[1])})">${x.name}</text>`;
  });
  s+=`<circle cx="${DL_DAN_C}" cy="${DL_DAN_C}" r="${DL_DAN_OUT}" class="w-ring"/>`;
  s+=`<circle cx="${DL_DAN_C}" cy="${DL_DAN_C}" r="${DL_DAN_IN}" class="w-ring"/>`;
  s+=`<circle cx="${DL_DAN_C}" cy="${DL_DAN_C}" r="${DL_DAN_CORE}" class="w-core"/>`;
  const dg=dlDanMid(DL_DAN_SEL), q0=WHEEL.px(DL_DAN_P0,dg), q1=WHEEL.px(DL_DAN_P1,dg);
  s+=`<line id="daoDanNeedle" x1="${WHEEL.n(q0[0])}" y1="${WHEEL.n(q0[1])}" x2="${WHEEL.n(q1[0])}" y2="${WHEEL.n(q1[1])}" class="w-needle"/>`;
  s+=`<circle id="daoDanDot" cx="${WHEEL.n(q1[0])}" cy="${WHEEL.n(q1[1])}" r="3.5" class="w-dot"/>`;
  /* 盘心三行：农历月日（大）、圣诞或吉日（中，属圣诞取主体色）、该日公历（小） */
  s+=`<text x="${DL_DAN_C}" y="${DL_DAN_C-16}" class="w-c1" id="daoDanC1">${DL_DAN_LABEL}月${curX.name}</text>`;
  s+=`<text x="${DL_DAN_C}" y="${DL_DAN_C+14}" class="w-c2" id="daoDanC2"${curX.isDan?' style="fill:var(--wheel-cur)"':''}>${dlDanCore(curX)}</text>`;
  s+=`<text x="${DL_DAN_C}" y="${DL_DAN_C+34}" class="w-c3" id="daoDanC3">${curX.solar}</text>`;
  return `<svg class="wheel" id="daoDanWheel" viewBox="0 0 440 440" role="img" aria-label="圣诞圆盘">${s}</svg>`;
}
/* 盘下详情条：该日圣诞与道教吉日全列（不与盘心重复，盘心只给类目）；非圣诞日给下一个圣诞，
   好顺着盘找下去（与佛历斋日盘给「下一个斋日」同法）。非圣诞而属道教节日者照样列名，只是冠以
   「道教节日」而非直接冠在「逢」后，免得把下降、成道日读成圣诞。 */
function dlDanDetailHTML(i){
  const x=DL_DAN&&DL_DAN[i]; if(!x) return '';
  const head=`农历${DL_DAN_LABEL}月${x.name}，`;
  const parts=[];
  if(x.isDan) parts.push(x.names.join('、'));
  else if(x.isFest) parts.push('道教节日：'+x.names.join('、'));
  if(x.sp.length) parts.push('道教吉日：'+x.sp.join('、'));
  if(parts.length) return head+'逢'+parts.join('；');
  const nx=DL_DAN.slice(i+1).filter(function(y){return y.isDan;})[0];
  return head+'非圣诞'+(nx?'<span class="wd-br"></span>下一个圣诞：农历'+nx.name:'');
}
function daoPickDan(i){
  if(!DL_DAN||!DL_DAN[i]) return;
  DL_DAN_SEL=i;
  const x=DL_DAN[i], sp=dlDanSpan(i);
  WHEEL.pick('daoDanWheel',i);
  WHEEL.lab('daoDanWheel',i);
  dlWheelSpot(DL_DAN_IDS,dlDanMid(i),sp[0],sp[1]);
  WHEEL.text('daoDanC1',DL_DAN_LABEL+'月'+x.name);
  WHEEL.text('daoDanC2',dlDanCore(x),x.isDan?'var(--wheel-cur)':'var(--wheel-ink2)');
  WHEEL.text('daoDanC3',x.solar);
  const d=document.getElementById('daoDanDetail'); if(d) d.innerHTML=dlDanDetailHTML(i);
}
function render(){
  const y=cur.getFullYear(), m=cur.getMonth();
  const ct=document.getElementById('calTitle'); if(ct) ct.textContent = y+'年'+(m+1)+'月';
  const first=safeDate(y,m+1,1);
  const daysInMonth=safeDate(y,m+2,0).getDate();
  const todayStr=new Date().toDateString();
  let cells=['一','二','三','四','五','六','日'].map(w=>`<div class="wd">${w}</div>`);
  const startWd=(first.getDay()+6)%7;   /* 周一起始：周一=0 … 周日=6 */
  for(let i=0;i<startWd;i++){ cells.push(cell(safeDate(y,m+1,1-(startWd-i)),true,todayStr)); }
  for(let d=1;d<=daysInMonth;d++){ cells.push(cell(safeDate(y,m+1,d),false,todayStr)); }
  const total=startWd+daysInMonth, tail=(7-total%7)%7;
  for(let i=1;i<=tail;i++) cells.push(cell(safeDate(y,m+2,i),true,todayStr));
  document.getElementById('calGrid').innerHTML=cells.join('');
}
/* 日期格：角标与色块照佛历（foli.html）同一套设计。
   🔴 两个单字角标，落左上与右上，与圣诞圆盘外圈同一套「诞」与「吉」两字：
   左上「吉」＝道教吉日（三会、三元、八节、八会、五腊、天赦），右上「诞」＝神仙圣诞。
   🔴 「诞」的判据照佛历 .mk-d：**节日名含「诞」者**，不是「节日表非空」。
   本库 getFestivals() 是「道教节日」总表，里面既有真圣诞（太上老君圣诞、九天司命灶君诞…），
   也有三会日的会名（天会、地会、人会）、神仙下降与成道日（…下降、…成道）、巡天祭灶等，
   凡名不含「诞」者标「诞」即是假语义。会名那一类同日还属吉日，本来就有左角标「吉」，不必再补右角标。
   与佛历的「斋」与「诞」同构：佛历左标持戒之日，本页左标宜行之日。
   🔴 格不铺底色（.cal-cell.zhai 归零，见 style.css 道历段）：节庆日不靠面积抢眼，
   改由角标逐日点出，与「去框改线」的线、字优先一致。
   底色只留给三种态：今日（主体色实色）、选中（主体色淡染 + 细描）、悬停。 */
function cell(d,other,todayStr){
  const solar=Solar.fromDate(d), lunar=solar.getLunar(), tao=lunar.getTao();
  const fest=tao.getFestivals();
  let tag='';
  if(fest.length) tag=fest[0].toString();
  else if(tao.isDaySanHui()) tag='三会日';
  else if(tao.isDaySanYuan()) tag='三元日';
  else if(tao.isDayBaJie()) tag='八节日';
  else if(tao.isDayTianShe()) tag='天赦日';
  const special=(fest.length||tao.isDaySanHui()||tao.isDaySanYuan()||tao.isDayBaJie()||tao.isDayTianShe()||tao.isDayBaHui());
  const danDay=fest.some(f=>f.getName().indexOf('诞')>=0);
  const jiDay=collectSpecial(tao).length>0;
  const isToday=d.toDateString()===todayStr;
  const wd=d.getDay();
  const key=`${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
  const wk=(wd===0||wd===6)?'weekend':'';
  return `<div class="cal-cell ${other?'other':''} ${isToday?'today':''} ${special?'zhai':''} ${wk}" data-date="${key}"
    onclick="showDay('${key}', this)">
    <div class="sd"><span class="sd-num">${d.getDate()}</span></div>
    ${jiDay?'<span class="mk mk-j">吉</span>':''}
    ${danDay?'<span class="mk mk-d">诞</span>':''}
    ${tag?`<div class="festival">${tag}</div>`:''}
    <div class="ld">道${tao.getDayInChinese()}</div></div>`;
}
function collectFests(tao){
  return tao.getFestivals().map(f=>{const rk=f.getRemark&&f.getRemark(); return f.getName()+(rk?`（${rk}）`:'');});
}
function collectSpecial(tao){
  const sp=[];
  if(tao.isDaySanHui()) sp.push('三会日');
  if(tao.isDaySanYuan()) sp.push('三元日');
  if(tao.isDayBaJie()) sp.push('八节日');
  if(tao.isDayBaHui()) sp.push('八会日');
  if(tao.isDayWuLa()) sp.push('五腊日');
  if(tao.isDayTianShe()) sp.push('天赦日');
  return sp;
}
function daoFullText(tao,lunar){
  const sh=curShichen();
  return `道历${tao.getYearInChinese()}年，天运${lunar.getYearInGanZhi()}年，${lunar.getMonthInGanZhi()}月，${lunar.getDayInGanZhi()}日。${tao.getMonthInChinese()}月${tao.getDayInChinese()}日，${sh}时。`;
}
function lmKey(lm){ return Math.abs(lm)*2 + (lm<0?1:0); }
function monthTaoList(y,m){
  const dim=new Date(y,m,0).getDate();
  const groups={};
  for(let d=1;d<=dim;d++){
    const lunar=Solar.fromYmd(y,m,d).getLunar(), tao=lunar.getTao();
    const lm=lunar.getMonth();
    if(!(lm in groups)) groups[lm]={label:lunar.getMonthInChinese(),items:[]};
    const names=[];
