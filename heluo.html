<main class="page">
  <h1>河洛理数</h1>
  <p class="lead">传为陈图南、邵康节一脉：八字化数起先天命卦，变元堂得后天卦，推大运流年。</p>
  <div class="hl-form">
    <div class="form-row">
      <div class="field"><label for="hlDate">公历生日</label><input type="text" class="dt-input" id="hlDate" aria-label="公历生日" placeholder="2026-09-08"></div>
      <div class="field"><label for="hlTime">出生时间</label><input type="time" id="hlTime" aria-label="出生时间" value="12:00" required></div>
      <div class="field"><label for="hlSex">性别</label><select id="hlSex" aria-label="性别"><option value="1">男</option><option value="2">女</option></select></div>
      <button id="hlBtn" class="btn gold" type="button">排命卦</button>
    </div>
    <div class="birth-group compact">
      <div class="group-label">出生地（用于经度校正，内置行政区划经度）</div>
      <div class="field"><label for="hlProv">省份</label><select id="hlProv" aria-label="出生地省份"></select></div>
      <div class="field"><label for="hlCity">城市</label><select id="hlCity" aria-label="出生地城市"></select></div>
      <div class="field"><label for="hlDist">区县</label><select id="hlDist" aria-label="出生地区县"></select></div>
      <div class="field hh-lng"><label for="hlLng">经度（可选）</label><input type="number" id="hlLng" step="0.01" placeholder="出生地" aria-label="手动经度"></div>
    </div>
    <div class="opts-row">
      <div class="group-label">时间折算与流派</div>
      <div class="field" id="hlDstField"><label for="hlDst">夏令时</label><select id="hlDst" aria-label="选择夏令时折算口径"><option value="auto">自动折算（1986至1991）</option><option value="on">按夏令时（钟面减1小时）</option><option value="off">不折算（钟面即标准时）</option></select></div>
      <div class="field"><label for="hlZi">子时算法</label><select id="hlZi" aria-label="子时算法"><option value="late">晚子时（23点归次日）</option><option value="early">早子时（23点归当日）</option></select></div>
      <div class="field"><label for="hlSun">太阳时</label><select id="hlSun" aria-label="选择太阳时口径"><option value="off">不校正</option><option value="true">真太阳时（均时差加经度）</option><option value="mean">平太阳时（仅经度差）</option></select></div>
      <div class="field" id="hlTzOffField" hidden><label for="hlTzOff">时区偏移</label><select id="hlTzOff" aria-label="选择境外出生地标准时区偏移" onchange="hlOverseasChange()"></select></div>
      <div class="field chk" id="hlLocalDstField" hidden><input type="checkbox" id="hlLocalDst" onchange="hlOverseasChange()"><label for="hlLocalDst">当地夏令时（钟面减1小时）</label></div>
    </div>
    <p class="sub-note" id="hlOverseasNote" hidden></p>
    <div class="form-row">
      <div class="field"><label for="hlQDate">查询日期（公历）</label><input type="text" class="dt-input" id="hlQDate" aria-label="查询日期" placeholder="2026-09-08"></div>
      <div class="field"><label for="hlRiHour">流时（时辰）</label><select id="hlRiHour" aria-label="流时时辰"><option value="">全日十二时</option><option value="00:00">子(23-01)</option><option value="02:00">丑(01-03)</option><option value="04:00">寅(03-05)</option><option value="06:00">卯(05-07)</option><option value="08:00">辰(07-09)</option><option value="10:00">巳(09-11)</option><option value="12:00">午(11-13)</option><option value="14:00">未(13-15)</option><option value="16:00">申(15-17)</option><option value="18:00">酉(17-19)</option><option value="20:00">戌(19-21)</option><option value="22:00">亥(21-23)</option></select></div>
      <button id="hlNianBtn" class="btn gold" type="button">查运程</button>
    </div>

    <div id="hlRiOut"></div>
    </div>
  </section>
  <section class="mod collapsed" id="hlmod-hecan">
    <div class="mod-head" onclick="toggleMod('hlmod-hecan')"><span class="mod-caret">▾</span><span class="mod-title">合参结论</span><span class="mod-sub">大运流年流月三层叠加、宜忌与着力点</span></div>
    <div class="mod-body">
    <div id="hlHeOut"></div>
    </div>
  </section>

    <summary>六十四卦经文检索</summary>
    <div id="hlJwBody"></div>
  </details>
  <p class="sub-note">河洛理数所排，是一生禀赋与某段岁月的气数偏向，可循大运、流年、流月、流日、流时逐层变爻，看气的节律与着力处；具体事件的成败与应期不在其列，不是事件的判决。</p>
