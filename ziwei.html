<script>let __zw=null;
/* 十四主星五行，全页单一真源 */
const WX_STAR={'紫微':'土','天机':'木','太阳':'火','武曲':'金','天同':'水','廉贞':'火','天府':'土','太阴':'水','贪狼':'木','巨门':'水','天相':'水','天梁':'土','七杀':'金','破军':'水'};
/* 双人合盘资料块：显隐由勾选态派生，样式表里只有默认态与 is-on 两条 */
function zwRelToggle(){
  const box=document.getElementById('zwRel2'), chk=document.getElementById('zwRel');

/* ============ 三大折叠模块 ============ */
const ZW_MOD_KEY='zwModState';
function zwReadModState(){
  try{
    let raw=localStorage.getItem(ZW_MOD_KEY);
    if(!raw) raw=sessionStorage.getItem(ZW_MOD_KEY);
    const s=JSON.parse(raw||'{}');
    return (s&&typeof s==='object')?s:{};
  }catch(e){ return {}; }
}
function zwSaveModState(){
  if(!window.__zwInitDone) return;   /* 初始化完成前不写，避免覆盖已存偏好 */
  try{
    /* 以已存为底、只覆盖此刻在场的件：复位本身会触发 toggle 回调本函数，
       整份重写会把此刻未渲染的件的键一并抹掉，下次刷新读不回来 */
    const o=zwReadModState();
    document.querySelectorAll('#out section.mod[id]').forEach(m=>{ o[m.id]=!m.classList.contains('collapsed'); });
    document.querySelectorAll('#out details[id]').forEach(d=>{ o[d.id]=d.open; });
    try{ localStorage.setItem(ZW_MOD_KEY, JSON.stringify(o)); }catch(e){}
    try{ sessionStorage.setItem(ZW_MOD_KEY, JSON.stringify(o)); }catch(e){}
  }catch(e){}
}
function zwToggleMod(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.toggle('collapsed'); zwSaveModState();
}
function zwApplyModState(){
  const s=zwReadModState();
  document.querySelectorAll('#out section.mod[id]').forEach(m=>{ if(m.id in s) m.classList.toggle('collapsed', !s[m.id]); });
  document.querySelectorAll('#out details[id]').forEach(d=>{ if(d.id in s) d.open=!!s[d.id]; });
}
const POS={巳:[1,1],午:[2,1],未:[3,1],申:[4,1],辰:[1,2],酉:[4,2],卯:[1,3],戌:[4,3],寅:[1,4],丑:[2,4],子:[3,4],亥:[4,4]};
const SANHE=['命宫','财帛','官禄','迁移']; /* 三方四正（命宫一组） */
/* 宫位关联：四正=本宫+对宫；三方=再+两个三合宫。按地支三合/对冲动态算，供中宫连线与关联高亮。
   三合：申子辰/寅午戌/巳酉丑/亥卯未；对冲：子午丑未寅申卯酉辰戌巳亥。 */
const ZW_SANHE={子:['申','子','辰'],午:['寅','午','戌'],辰:['申','子','辰'],戌:['寅','午','戌'],
  申:['申','子','辰'],寅:['寅','午','戌'],巳:['巳','酉','丑'],酉:['巳','酉','丑'],
  丑:['巳','酉','丑'],卯:['亥','卯','未'],亥:['亥','卯','未'],未:['亥','卯','未']};
const ZW_CHONG={'子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳'};
/* 某地支宫的三方四正（不含本宫，返回其余3宫地支）：对宫 + 两个三合宫。
   以引擎 surroundedPalaces 为真源，按宫名取回对宫、财帛位、官禄位三宫；
   引擎取不到该宫时退本地三合表，两者实测逐宫一致（十二宫全同）。 */
function zwSanfangBrOf(astro, br){
  const p=astro&&astro.palaces.find(x=>x.earthlyBranch===br);
  if(p){
    try{
      const s=astro.surroundedPalaces(p.name);
      const brs=[s.opposite,s.wealth,s.career].filter(Boolean).map(x=>x.earthlyBranch);
      if(brs.length===3) return brs;
    }catch(e){}
  }
  const opp=ZW_CHONG[br];
  const san=ZW_SANHE[br]||[];
  return [...new Set([opp, ...san])].filter(b=>b&&b!==br);
}
// 紫微综合判断：命宫主星+亮度、性质、身宫、四化落宫人事、三方四正、大限落位，串成该盘具体指向
function ziweiRead(astro, school, trans, sex){
  const soulP=astro.palaces.find(p=>p.name==='命宫');
  const bodyP=astro.palaces.find(p=>p.isBodyPalace);
  const soulMj=(soulP&&soulP.majorStars||[]).map(s=>s.name+(s.brightness?('（'+s.brightness+'）'):'')).join('、')||'无主星';
  const bodyName=bodyP?bodyP.name:'未标身宫';
  const palOf=o=>{const p=astro.palaces.find(x=>(x.majorStars||[]).concat(x.minorStars||[]).some(s=>s.mutagen===o));return p?p.name:'';};
  const luPal=palOf('禄'), jiPal=palOf('忌');
  const meanOf=rn=>{const r=ZIWEI_PAL_MEAN.find(x=>x[0]===rn);return r?r[1]:'';};
  // 命宫主星本性/事业（具体：太阳、天梁）。事业方向只取[1]字段首段（逗号前方向词），剔除描述短语并去重
  // 命宫主星本性/事业。事业方向=命宫各主星[1]（纯职业清单）合并去重，仅句首一个"宜"总领（宜A、B、C）
  const dualKey=(()=>{ const arr=(soulP&&soulP.majorStars||[]); return arr.map(s=>s.name).sort().join('+'); })();
  const natOf=(()=>{ const arr=(soulP&&soulP.majorStars||[]); const dual=ZW_DUAL_MEAN[dualKey]||''; const nm=dual?dual.split('，')[0]:arr.map(s=>ZW_STAR_MEAN[s.name]?ZW_STAR_MEAN[s.name][0].split('，')[0]:s.name).filter(Boolean).join('、'); const toks=arr.map(s=>ZW_STAR_MEAN[s.name]?(ZW_STAR_MEAN[s.name][1]||'').split(/[，,、]/).map(t=>t.trim()).filter(Boolean):[]).flat(); const uniq=toks.filter((v,i)=>toks.indexOf(v)===i); const dir=uniq.length?('宜'+uniq.join('、')):''; return {nm,dir,list:arr,dual}; })();
  // 命宫主星亮度 + 星性组合判断（具体到星，非"格局易成"泛话）
  const soulStars=(soulP&&soulP.majorStars||[]);
  let briTxt='';
  if(soulStars.length){
    const starTxt=soulStars.map(s=>{ const m=ZW_STAR_MEAN[s.name]; const nat=m?m[0].split('，')[0]:s.name; const b=(s.brightness==='庙'||s.brightness==='旺'||s.brightness==='得')?'得地':((s.brightness==='陷'||s.brightness==='不')?'落陷':'平常'); return `${s.name}${s.brightness?'（'+s.brightness+'）':''}${nat}${b}`; }).join('、');

/* 取命宫三方四正（本宫＋对宫＋两个三合宫）内的星名与四化，供格局判据取用。
   另备 ctx：命宫主星、星名到宫名的映射、宫名到地支的映射，供须辨落宫之格局取用。
   判据一律限定在三方四正之内取星，不落全盘搜星（全盘搜则十四主星必现，判据恒真、格局尽成，是为误判）。 */
function zwGejuScope(astro){
  const m=astro.palaces.find(p=>p.name==='命宫')||astro.palaces[0];
  const brs=[m.earthlyBranch, ZW_CHONG[m.earthlyBranch]].concat(ZW_SANHE[m.earthlyBranch]||[]);
  const pal=astro.palaces.filter(p=>brs.indexOf(p.earthlyBranch)>=0);
  const stars=pal.reduce((a,p)=>a.concat(p.majorStars||[], p.minorStars||[]),[]);
  const palOf={}; astro.palaces.forEach(p=>{(p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>{ if(!palOf[s.name]) palOf[s.name]=p.name; });});
  const at=n=>palOf[n]||'';
  const san=ZW_SANHE[m.earthlyBranch]||[];
  const atBr=n=>{ const pl=astro.palaces.find(x=>x.name===at(n)); return pl?pl.earthlyBranch:''; };
  const inSanhe=names=>names.every(n=>{ const b=atBr(n); return b&&san.indexOf(b)>=0; });
  return {names:stars.map(s=>s.name), mut:stars.filter(s=>s.mutagen).map(s=>s.mutagen),
    ctx:{soul:(m.majorStars||[]).map(s=>s.name), palOf:at, mingBr:m.earthlyBranch,
      together:(a,b)=>!!at(a)&&at(a)===at(b), sanhe:(a,b)=>inSanhe([a,b])}};
}
function zwGejuList(astro){
  const sc=zwGejuScope(astro);
  return ZW_GEJU.filter(g=>{ try{ return !!g.f(sc.names, sc.mut, sc.ctx); }catch(e){ return false; } });
}
/* 本命定盘：以亮度+三方四正+四化做量化格局判定，给小白一眼看懂的重点结论 */
function zwDingPan(astro, school){
  const BR={庙:3,旺:2,利:1.5,'得':1,得:1,平:1,不:0.5,陷:0.5,'不得地':0.5};
  const briScore=function(s){ const b=BR[s.brightness]; return (b==null)?1:b; };
  const soulP=astro.palaces.find(p=>p.name==='命宫')||astro.palaces[0];
  const bodyP=astro.palaces.find(p=>p.isBodyPalace);
  const soulStars=soulP.majorStars||[];
  const soulScore=soulStars.length?soulStars.reduce((a,s)=>a+briScore(s),0)/soulStars.length:0;
  let label='', level=2;
  if(soulStars.length===0){ label='空宫'; level=2; }
  else if(soulScore>=2){label='偏旺强势';level=0;}
  else if(soulScore>=1.2){label='中和稳健';level=1;}
  else if(soulScore>=0.8){label='平和相应';level=2;}
  else {label='偏弱落陷';level=3;}
  // 三方四正（命财官迁）主星数与吉凶
  const SZ=['命宫','财帛','官禄','迁移'];
  let szMajors=0, szJi=0, szXiong=0;
  const XIONG=new Set(['擎羊','陀罗','火星','铃星','地空','地劫','破碎','劫煞','天刑','天哭','天虚']);
  SZ.forEach(nm=>{const p=astro.palaces.find(x=>x.name===nm);if(!p)return;
    (p.majorStars||[]).forEach(()=>{szMajors++;});
    (p.minorStars||[]).concat(p.adjectiveStars||[]).forEach(s=>{if(XIONG.has(s.name))szXiong++;});
    (p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>{if(['禄','权','科'].includes(s.mutagen))szJi++;});
  });
  const mutaPal={};
  astro.palaces.forEach(p=>{(p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>{ if(s.mutagen&&!mutaPal[s.mutagen]) mutaPal[s.mutagen]=p.name; });});
  const lu=mutaPal.禄?mutaPal.禄:'（无）', quan=mutaPal.权?mutaPal.权:'（无）', ke=mutaPal.科?mutaPal.科:'（无）', ji=mutaPal.忌?mutaPal.忌:'（无）';
  const jiPalComma=mutaPal.忌||'';
  const majorNames=(soulStars.map(s=>s.name)).join('、');
  const geList=zwGejuList(astro);
  const geJu=geList.length
    ? geList.map(g=>g.n+'（'+g.kind+'）').join('、')
    : (soulStars.length?'主星独坐为基（'+majorNames+'），凭亮度与四化定其用，未成显格':'空宫，借对宫及三方四正之星参断');
  const jiC=jiPalComma?'化忌直落'+jiPalComma+'，是该宫力弱之处，宜静守防反复。':'无大忌直冲，四化相对平衡。';
  let sanStr;
  if(szXiong>szJi) sanStr='三方四正凶曜偏多（凶'+szXiong+'处、吉化'+szJi+'处），格局开合有阻，宜以德化争、后天补益';
  else if(szJi>0) sanStr='三方四正吉化汇聚（吉化'+szJi+'处、凶曜'+szXiong+'处），会照得力、格局清扬易成';
  else sanStr='三方四正吉凶相当，主星聚'+szMajors+'星，凭大限流年引动进退';
  const adv={
    0:'先天禀赋偏旺，宜早立事业方向、居强势领域，然旺极防专横，宜配谦和之德。',
    1:'格局中和，权衡得宜，宜稳扎稳打、以专业精进立身，忌好高骛远。',
    2:'禀赋平和，宜量力而行、取务实稳健之路，辅以后天经营补足偏弱之宫。',
    3:'偏弱落陷，宜避锋芒、养精蓄锐，借三方四正吉星与大限翻转之时再图进取。'
  };
  const tip=(jiPalComma?('又'+jiC):jiC)+'　'+adv[level];
  return {label,level,zuhe:geJu,geju:geList,trans:['禄'+lu,'权'+quan,'科'+ke,'忌'+ji].join('　'),san:sanStr,tip};
}

    const fu=(p.minorStars||[]).filter(s=>ZW_FU[s.name]).map(s=>s.name);

    const shengJi=huaSheng.some(x=>x.indexOf('忌')>=0), shengLu=huaSheng.some(x=>x.indexOf('禄')>=0);

/* 运限流曜：引擎在每层另给一套流曜落宫（长度十二的数组，下标同宫序），与生年星盘无关。

const ZW_LIU_YAO={

/* 取某曜之于名（去掉冠首字）以归 ZW_LIU_YAO；冠首字按层而变，故只认尾字之一套干名。 */
function zwLiuYaoOf(name){
  const bare=name.replace(/^[运流月日时]/,'');

/* 运限流曜落宫断：逐层列流曜入何宫、主何事，并收一句该层重点。

   该层重点收在表尾一行，不另起段落，免在格栅里多占一格而错开与层表的配对。 */
function zwLiuYaoRead(as, layer, layerName){
  const arr=layer&&layer.stars;

  return `<table class="zp-yun-tbl zw-yao-tbl">${cap}<thead><tr><th>宫位</th><th>本命宫</th><th>流曜与所主</th><th>吉煞</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="lbl">${r.role}</td><td class="lbl">本命${r.natal}</td><td>${r.txt}</td><td>${r.judge==='吉'?'<span class="yi">吉</span>':(r.judge==='煞'?'<span class="ji">煞</span>':'吉煞并见')}</td></tr>`).join('')}

}

   星名取 zwGanHua；引擎取不到时退星名反查，两法实测逐宫一致。 */
function zwFeiXing(astro){
  const starPal={}; astro.palaces.forEach(p=>{(p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>{ if(!starPal[s.name]) starPal[s.name]=p.name; });});
  const meanMap={禄:'该宫得助、有生发将成之机',权:'该宫掌权立事、责任加重',科:'该宫声名清雅、和顺得名',忌:'该宫缠扰耗力、宜静守防反复'};
  const ganOrder=['禄','权','科','忌'];
  // 取命宫、财帛、官禄、迁移、夫妻、福德 六宫宫干四化（重点宫飞星）
  const focus=['命宫','财帛','官禄','迁移','夫妻','福德'];
  const rows=focus.map(rn=>{
    const p=astro.palaces.find(x=>x.name===rn); if(!p) return null;
    const gan=zwGanHua(p.heavenlyStem); if(!gan) return null;
    /* 引擎落宫：经盘级 palace() 取该宫（直接取自 palaces 的宫对象其 mutagedPlaces 恒空）。 */
    let engPal=null;
    try{ const q=astro.palace(rn); engPal=q&&q.mutagedPlaces?q.mutagedPlaces():null; }catch(e){ engPal=null; }
    const fly=ganOrder.map((m,i)=>{
      const to=(engPal&&engPal[i])?engPal[i].name:(starPal[gan[i]]||'飞失');
      return {m, star:gan[i], to};
    });
    return {from:rn+' '+p.heavenlyStem+p.earthlyBranch, fly};
  }).filter(Boolean);
  // 找化忌落宫最重的（忌冲提示）
  const jiArr=[]; rows.forEach(r=>r.fly.forEach(f=>{ if(f.m==='忌'&&f.to!=='飞失') jiArr.push(`${r.from.replace(/\s.*/,'')}化忌${f.star}入${f.to}`); }));
  const tblRows=rows.map(r=>`<tr><td class="lbl">${r.from}</td><td class="lqk">${r.fly.map(f=>f.m==='忌'?'':`化${f.m}${f.star}入${f.to==='飞失'?'外宫':f.to}`).filter(Boolean).join('、')||'—'}</td><td>${(r.fly.find(f=>f.m==='忌')&&r.fly.find(f=>f.m==='忌').to!=='飞失')?('化忌'+( r.fly.find(f=>f.m==='忌').star)+'入'+(r.fly.find(f=>f.m==='忌').to)):'飞失'}${meanMap.忌?('，'+meanMap.忌):''}</td></tr>`).join('');
  const tbl=`<div class="zp-yunout"><table class="zp-yun-tbl"><thead><tr><th>宫干</th><th>禄权科</th><th>化忌</th></tr></thead><tbody>${tblRows}</tbody></table></div>`;
  const jiNote=jiArr.length?`<p class="sub-note">忌冲提示：${jiArr.join('、')}，逢忌入之宫该宫人事宜守、防反复波动。</p>`:'<p class="sub-note">本局宫干四化忌未直入重宫，飞星流转相对平稳。</p>';
  return `<h3 class="rel-title">宫干四化（飞星 四化派）</h3>${tbl}${jiNote}`;
}
/* 大限四化（北派飞星）：当前大限宫干化出的禄权科忌，落于本命何宫（北派以十年宫干四化看一大限气运） */
function zwDaYunSihua(astro){
  let h=null; try{ h=astro.horoscope({}); }catch(e){ try{ h=astro.horoscope(); }catch(e2){ h=null; } }
  if(!h||!h.decadal) return '';
  const dec=h.decadal;
  const starPal={}; astro.palaces.forEach(p=>{(p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>{ if(!starPal[s.name]) starPal[s.name]=p.name; });});
  const meanMap={禄:'为该宫得助、有生发将成之机',权:'为该宫掌权立事、责任加重',科:'为该宫声名清雅、和顺得名',忌:'为该宫缠扰耗力、宜静守防反复'};
  const order=['禄','权','科','忌'];
  const arr=order.map((o,i)=>{
    const star=(dec.mutagen||[])[i]; if(!star) return '';
    const pal=starPal[star]||'飞失';
    return {o, star, pal};
  }).filter(Boolean);
  const rows=arr.map(x=>`<tr><td class="lbl">化${x.o}</td><td>${x.star}</td><td>${x.pal==='飞失'?'外宫':x.pal}${meanMap[x.o]}</td></tr>`).join('');
  const tbl=`<div class="zp-yunout"><table class="zp-yun-tbl"><thead><tr><th>化气</th><th>星曜</th><th>落宫吉凶</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  return `<h3 class="rel-title">大限四化（北派飞星）</h3><p class="ly-zh-p sub-note">当前大限 ${dec.name}（${dec.heavenlyStem}${dec.earthlyBranch}）宫干四化，主此十年气运之所在：${arr.map(x=>'化'+x.o+x.star+(x.pal==='飞失'?'飞失外宫':'入'+x.pal)).join('，')}。</p>${tbl}`;
}
/* 来因宫（北派飞星）：用 iztro 原生 isOriginalPalace（与 zwds 口径一致），辅以生年干所在宫双验证；来因宫为能量最活跃之宫，决定一生重点与因果 */
function zwLaiYin(astro){
  const shengGan=((astro.chineseDate||'').trim().charAt(0))||'';
  let origin=astro.palaces.find(p=>p.isOriginalPalace);
  if(!origin) origin=astro.palaces.find(p=>p.heavenlyStem===shengGan); // 兜底：生年干所在宫
  if(!origin) return '';
  const meanMap={命宫:'自我发展，命运自主',兄弟:'手足朋友，合作发展',夫妻:'婚姻感情，配偶影响',子女:'子女缘分，创意投资',财帛:'财富追求，一生为财',疾厄:'健康关注，医疗养生',迁移:'外出发展，变动机遇',交友:'人脉社交，朋友助力',仆役:'人脉社交，朋友助力',官禄:'事业成就，工作核心',田宅:'家庭房产，不动产缘',福德:'精神追求，晚年福泽',父母:'家庭背景，长辈荫庇'};
  const m=ZIWEI_PAL_MEAN.find(x=>x[0]===origin.name);
  const gm=meanMap[origin.name];
  const stars=(origin.majorStars||[]).map(s=>s.name+(s.brightness?('（'+s.brightness+'）'):'')).join('、')||'空宫';
  /* 来因宫能量分级色：dp-0红=己身强宫（命/福/疾）dp-1金=事用宫（财/官/迁/田）dp-3蓝灰=亲缘宫（夫/子/兄/友/仆/父） */
  const laiYinLv=name=>name==='命宫'||name==='福德'||name==='疾厄'?'dp-0':(name==='财帛'||name==='官禄'||name==='迁移'||name==='田宅'?'dp-1':'dp-3');
  return `<h3 class="rel-title">来因宫（北派飞星）</h3>
    <div class="info-box zp-ding">
      <div class="zp-yunout"><table class="zp-yun-tbl"><tbody>
        <tr><th>来因宫</th><td><span class="dp-badge ${laiYinLv(origin.name)}">${origin.name}</span>　${origin.heavenlyStem}${origin.earthlyBranch}　生年干 ${shengGan} 入此</td></tr>
        <tr><th>宫主之象</th><td>${gm||(m?m[1]:'')}</td></tr>
        <tr><th>宫位主星</th><td>${stars}</td></tr>
        <tr><th>重点</th><td>来因宫能量最活，此宫所主之人生面向贯穿一生，以北派生年四化与大小限联动参断其发力与应期。</td></tr>
      </tbody></table></div>
    </div>`;
}
/* 自化（北派飞星）：本宫宫干所化之星恰在本宫，即自化；结合生年四化分向心（同象，先有后无而收敛）
   与离心（异象，先无后有而发散）。依 ziwei-dou-shu 北派理论。
   星名与命中判定取引擎 selfMutaged（引擎按宫干四化与本宫星曜比对），本页只补释义与向心离心之分；
   引擎缺席时退 zwGanHua 与本宫星曜自比，两法实测逐宫一致。 */
function zwZiHua(astro){
  const mean={禄:'得助生发、将成之机',权:'掌权立事、责任加重',科:'声名清雅、和顺得名',忌:'缠扰耗力、宜静守防反复'};
  const rows=[];
  astro.palaces.forEach(p=>{
    const stars4=zwGanHua(p.heavenlyStem); if(!stars4) return;
    const at=[]; // 本宫星曜集合（含主星辅星）
    (p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>at.push(s));
    ['禄','权','科','忌'].forEach((k,i)=>{
      const nm=stars4[i]; if(!nm) return;
      const star=at.find(s=>s.name===nm); if(!star) return;
      /* 引擎同判复核：引擎判本宫该化不自化而此处命中，即引擎缺席或口径有差，宁信引擎、不列此行。 */
      let eng=false; try{ eng=p.selfMutaged(k); }catch(e){ eng=true; }
      if(!eng) return;
      /* 向心离心看"象是否同类"：宫干所化之象与该星生年四化同象＝向心（同类，由有转无而收敛）；
         异象＝离心（由无转有而发散）。只看该星有无生年四化不问同异，会把"生年禄而宫干化忌"误判向心。 */
      const sameXiang=star.mutagen===k;
      const dir=sameXiang?'向心':'离心';
      rows.push({pal:p.name, star:nm, k, dir, sheng:star.mutagen||'', mean:mean[k]});
    });
  });
  if(!rows.length) return '';
  rows.sort((a,b)=>{ const o={禄:0,权:1,科:2,忌:3}; return o[a.k]-o[b.k]; });
  const tblRows=rows.map(r=>`<tr><td class="lbl">${r.pal}</td><td>${r.star} 化${r.k}</td><td>${r.dir}${r.sheng?`（生年化${r.sheng}，${r.dir==='向心'?'同象':'异象'}）`:'（无生年四化）'}</td><td>${r.mean}</td></tr>`).join('');
  const lint=rows.filter(r=>r.k==='忌').map(r=>`${r.pal}宫${r.star}化忌${r.dir}，逢忌之宫人事宜守防反复`).join('、');
  const note=lint?`<p class="sub-note">${lint}。</p>`:`<p class="sub-note">本局自化无化忌直冲重宫，飞星流转相对平稳。</p>`;
  return `<h3 class="rel-title">自化（北派飞星）</h3>
    <div class="info-box zp-ding"><div class="zp-yunout"><table class="zp-yun-tbl"><thead><tr><th>宫位</th><th>自化</th><th>向心 离心</th><th>吉凶</th></tr></thead><tbody>${tblRows}</tbody></table></div>${note}</div>`;
}
/* 流年叠大限（北派飞星）：大限四化为十年气运之体，流年四化逐年引动；当流年所化星与大限所化星为同星，则该题材之年为应期强引动。 */
function zwLiuYunDie(astro){
  let h=null; try{ h=astro.horoscope({}); }catch(e){ try{ h=astro.horoscope(); }catch(e2){ h=null; } }
  if(!h||!h.decadal) return '';
  const order=['禄','权','科','忌'];
  const starPal={}; astro.palaces.forEach(p=>{(p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>{ if(!starPal[s.name]) starPal[s.name]=p.name; });});
  const dec=h.decadal, yr=h.yearly;
  const decSihua=order.map((k,i)=>{const st=(dec.mutagen||[])[i]; return st?{k,star:st,pal:starPal[st]||'飞失'}:null;}).filter(Boolean);
  const yrSihua=order.map((k,i)=>{const st=(yr.mutagen||[])[i]; return st?{k,star:st,pal:starPal[st]||'飞失'}:null;}).filter(Boolean);
  if(!decSihua.length) return '';
  const yrStars=new Set(yrSihua.map(x=>x.star));
  const mean={禄:'得助生发、将成之机',权:'掌权立事',科:'和顺得名',忌:'防反复耗力'};
  const rows=decSihua.map(x=>{
    const hit=yrStars.has(x.star);
    const hitTxt=hit?('<b class="yi">流年同星引动</b>：'+x.k+x.star+'为流年'+yr.heavenlyStem+yr.earthlyBranch+'所化，当年应期强'):'流年未引动同星，当年此题材偏静';
    return '<tr><td class="lbl">大限化'+x.k+x.star+'</td><td>落'+(x.pal==='飞失'?'外宫':x.pal)+'</td><td>'+hitTxt+'</td><td>'+mean[x.k]+'</td></tr>';
  }).join('');
  const hitCount=decSihua.filter(x=>yrStars.has(x.star)).length;
  const concl=hitCount?`<p class="sub-note">${yr.heavenlyStem}${yr.earthlyBranch}年流年四化与大限四化有 ${hitCount} 星同向，${hitCount>=2?'多重引动、':'此题材'}应为今年运势最强之应期线索。</p>`:'<p class="sub-note">今年流年四化未与大限四化同星，大限气运以流年宫位引动、应期偏缓。</p>';
  return `<h3 class="rel-title">流年叠大限（北派飞星）</h3>
    <div class="info-box zp-ding"><div class="zp-yunout"><table class="zp-yun-tbl"><thead><tr><th>大限四化</th><th>落宫</th><th>今年流年引动</th><th>含义</th></tr></thead><tbody>${rows}</tbody></table></div>${concl}</div>`;
}
/* 长生、博士十二神：命宫等关键宫落位 + 健康因果与福泽提示（本命体质维度） */
/* 地支到引擎脏腑表之键名（引擎表键为罗马化名，序同十二地支）。 */
const ZW_BR_KEY=['ziEarthly','chouEarthly','yinEarthly','maoEarthly','chenEarthly','siEarthly','wuEarthly','weiEarthly','shenEarthly','youEarthly','xuEarthly','haiEarthly'];
/* 疾厄宫脏腑细化：宫位地支定脏腑与体表部位，引擎 data.earthlyBranches 为真源，本页不另抄一份。
   四正（本宫、对宫、两个三合宫）同参，故所涉脏腑一并列出。 */
function zwZangFu(astro){
  const zh='子丑寅卯辰巳午未申酉戌亥';
  const eb=iztro.data&&iztro.data.earthlyBranches;
  if(!eb) return '';
  const jie=astro.palaces.find(p=>p.name==='疾厄');
  if(!jie) return '';
  const brs=[jie.earthlyBranch].concat(zwSanfangBrOf(astro, jie.earthlyBranch)).filter(Boolean);
  const rows=brs.map(br=>{
    const key=ZW_BR_KEY[zh.indexOf(br)];
    const d=key?eb[key]:null;
    if(!d) return '';
    const p=astro.palaces.find(x=>x.earthlyBranch===br);
    const stars=(p&&p.majorStars||[]).map(s=>s.name+(s.brightness?('（'+s.brightness+'）'):'')).join('、')||'空宫';
    return `<tr><td class="lbl">${p?p.name:''}（${br}）</td><td>${d.inside}</td><td>${d.outside}</td><td>${stars}</td><td>${d.healthTip}</td></tr>`;
  }).filter(Boolean).join('');
  const jieKey=ZW_BR_KEY[zh.indexOf(jie.earthlyBranch)];
  const jd=jieKey?eb[jieKey]:null;
  const jieStars=(jie.majorStars||[]).map(s=>s.name+(s.brightness?('（'+s.brightness+'）'):'')).join('、')||'空宫';
  const strong=(jie.majorStars||[]).filter(s=>['庙','旺','得'].indexOf(s.brightness)>=0).length;
  const weak=(jie.majorStars||[]).filter(s=>['陷','不'].indexOf(s.brightness)>=0).length;
  let judge='';
  if(!(jie.majorStars||[]).length) judge='疾厄空宫，体质底子借对宫与三方之星参断，宜以作息调养为本。';
  else if(strong&&!weak) judge='疾厄主星庙旺，体质底子厚、抗病力可恃，然旺极防积劳成疾，宜动中求养。';
  else if(weak&&!strong) judge='疾厄主星落陷，体质偏弱、易受外邪，宜早睡节劳、定期检视所涉脏腑。';
  else judge='疾厄主星旺弱参半，体质时强时弱，宜顺时调养、勿使偏劳。';
  const tbl=`<div class="zp-yunout"><table class="zp-yun-tbl"><thead><tr><th>宫位（地支）</th><th>脏腑</th><th>体表部位</th><th>主星</th><th>所主病症</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  return `<h3 class="rel-title">疾厄脏腑细化</h3>${tbl}
    <p class="ly-zh-p">疾厄宫在${jie.earthlyBranch}，主脏腑${jd?jd.inside:''}、体表${jd?jd.outside:''}，主星${jieStars}。${judge}四正所涉脏腑一并列出，取象以本宫为主、三方为辅；此为星曜与宫位之象，非诊断，身体不适仍须就医。</p>`;
}
/* 四套十二神：长生（气机生旺衰败）、博士（人事助力）、岁前（岁君所临）、将前（将星所辖）。
   皆由引擎按宫给出，本页只释义与分色，不自推。 */
function zwSheng(astro){
  const key=['命宫','兄弟','夫妻','子女','财帛','疾厄','迁移','仆役','官禄','田宅','福德','父母'];
  const mean={长生:'生机初长、根基有养',沐浴:'如沐春风、宜防桃花虚耗',冠带:'渐成熟、有承担之象',临官:'当旺得势、主事有成',帝旺:'气运最盛、然物极防反',衰:'旺后转缓、宜守成勿伐',病:'气力转弱、宜保养',死:'生机暂敛、宜蛰伏积蓄',墓:'收藏收敛、宜守不宜动',绝:'生机将尽、宜静养蓄锐',胎:'孕育在即、含藏待发',养:'养育渐成、蓄势向上'};
  // 吉凶色（对齐八字 .yi绿/.ji红）：长生吉位绿、病死亡墓绝凶位红
  const csGood=['长生','临官','帝旺'], csBad=['病','死','墓','绝'];
  const bsGood=['博士','青龙','将军','左辅','力士','奏书','官府','喜神','飞廉'], bsBad=['伏兵','大耗','小耗'];
  /* 岁前十二神：岁建主一岁之君，龙德天德为吉，丧门白虎吊客病符为凶，余者中平。
     将前十二神：将星攀鞍为吉，华盖主孤高才艺，劫煞灾煞天煞亡神指背为凶。 */
  const sqGood=['岁建','龙德','天德'], sqBad=['丧门','白虎','吊客','病符','大耗','小耗','官符','贯索','晦气'];
  const jqGood=['将星','攀鞍','岁驿'], jqBad=['劫煞','灾煞','天煞','亡神','指背','月煞','咸池'];
  const rows=key.map(rn=>{
    const p=astro.palaces.find(x=>x.name===rn); if(!p) return '';
    const cs=p.changsheng12||'', bs=p.boshi12||'', sq=p.suiqian12||'', jq=p.jiangqian12||'';
    const csMean=mean[cs]||'';
    const mk=(v,good,bad)=>(good.indexOf(v)>=0?'<span class="yi">'+v+'</span>':(bad.indexOf(v)>=0?'<span class="ji">'+v+'</span>':v));
    return `<tr><td class="lbl">${rn}</td><td>${mk(cs,csGood,csBad)}${csMean?'（'+csMean+'）':''}</td><td>${mk(bs,bsGood,bsBad)}</td><td>${mk(sq,sqGood,sqBad)}</td><td>${mk(jq,jqGood,jqBad)}</td></tr>`;
  }).join('');

  /* 七、三方四正格局互参（原分 20，三合派专用）：两盘命宫三方四正（命财官迁）主星五行互会生克，

  {

      if(nm==='命宫') return; /* 命宫支之合归专项三合，此处不再计 */

      if(brel==='六合'||brel==='三合'){ raw+=5; det.push(nm+'宫支'+brel); }

    });

  const specScore=specItems.reduce((s,it)=>s+it[1],0);

  const advRows=[`<tr><th>总体判断</th><td><b class="hh-adv-lv" style="color:${lv.color}">${lv.lv}</b>。${lv.sum}</td></tr>`];

  if(loIts.length){ advRows.push('<tr class="hh-adv-sec"><td colspan="2">短板</td></tr>'); loIts.forEach(it=>advRows.push(`<tr><th><span class="hh-adv-pill hh-adv-pill-d">${it[0]}</span></th><td>${it[3]}</td></tr>`)); }
  if(!hiIts.length&&!loIts.length) advRows.push('<tr><th>亮点与短板</th><td>各维均处中段，无大合亦无大冲，感情温度全靠后天经营。</td></tr>');
  advRows.push('<tr class="hh-adv-sec"><td colspan="2">相处之道</td></tr>');

  /* 四化互涉明细表：一方生年禄忌飞入对方何宫、主何人事 */

        interRows+=`<tr><th>${who}化${h}</th><td>${x.star}</td><td>${h==='忌'?'忌化':'吉化'}</td><td>${other}${x.pal}${x.pal.slice(-1)==='宫'?'':'宫'}${(x.pal==='命宫'||x.pal==='夫妻')?'（要宫）':''}</td><td class="zw-hp-det">${pm?pm.split('、')[0]:'此宫所主之事'}${eff}</td></tr>`;

  /* 速览对照行 */

  /* 六维得分表行（得分展示用"分制"形式，不用斜杠）：主评分维度随流派，非本派纲维度列为参考 */
  const scCell=(v,max)=>`<b>${v}</b><span class="zw-hp-max">满分${max}</span>`;
  const MAIN_SX=['命宫主星五行','夫妻宫互参','三方四正互参','身宫着力','五行局互参'];
  const MAIN_SH=['四化交驰','命宫主星五行','夫妻宫互参','命主身主','身宫着力','五行局互参'];

    return `<tr><th>${it[0]}</th><td>${scCell(it[1],it[2])}</td><td class="zw-hp-det">${it[3]}</td></tr>`; }).join('');
  const refItems=items.filter(it=>mainNames.indexOf(it[0])<0);

  const refSection=refRows?`<h3 class="rel-title">参考维度（${isSx?'四化派纲':'三合派纲'}，不入评分）</h3>
  <table class="zp-yun-tbl zw-hp-tbl"><tbody>${refRows}</tbody></table>`:'';
  const specRows=specItems.map(it=>`<tr><th>${it[0]}</th><td>${scCell(it[1],it[2])}</td><td class="zw-hp-det">${it[3]}</td></tr>`).join('');
  const html=`<h3 class="rel-title">紫微双人合盘（${isSx?'三合派':'四化派'}）</h3>

/* 时间折算与流派：钟面时刻 → 定盘用时刻与时辰。
   夏令时折算、真（平）太阳时、子时归属三件一律调共享库：applyDstCorrection、trueSolarTime 在
   xuanji-lib.js，adjustZiShi 在 bazi-data.js，与八字页同一真源，页内不另立算法。
   返回定盘用的年月日与 iztro 时辰 index（0 早子、1 丑、11 亥、12 晚子）及折算说明。 */
function zwClockToPalace(y,m,d,h,mi,lng,dstMode,sunMode,ziMode){
  let cur={y,m,d,h,mi}, notes=[];
  const dst=applyDstCorrection(cur.y,cur.m,cur.d,cur.h,cur.mi,dstMode);
  if(dst.applied){ cur=dst; notes.push(dst.note); }
  if(sunMode!=='off'){
    const ts=trueSolarTime(cur.y,cur.m,cur.d,cur.h,cur.mi,lng,sunMode==='mean'?'mean':'true');
    if(Math.round((Date.UTC(ts.y,ts.m-1,ts.d)-Date.UTC(cur.y,cur.m-1,cur.d))/86400000)!==0)
      notes.push('太阳时校正后跨日，日柱归'+(ts.y>cur.y||ts.m>cur.m||ts.d>cur.d?'次':'前')+'日');
    cur={y:ts.y,m:ts.m,d:ts.d,h:ts.h,mi:ts.mi};
    notes.push('太阳时校正 '+(ts.totalAdj>=0?'+':'')+ts.totalAdj+' 分（均时差 '+ts.E+'、经度差 '+ts.lngAdj+'）');
  }
  /* 子时归属只在 23 点一侧分歧：晚子时取 iztro 时辰 index 12，日柱按时干遁（与次日子时同柱），
     农历日与时辰标签仍是 23 点生人的本相；早子时取 index 0，日柱归当日。
     adjustZiShi 是八字域写法（八字无晚子 index，只能推进日期来改日柱），此处只取它的流派判定与说明口径，
     不采用其日期推进：两路四柱实测一致，而推进日期会把 23 点生人误标成次日早子时。 */
  const zi=adjustZiShi(cur.y,cur.m,cur.d,cur.h,cur.mi,ziMode);
  if(zi.note) notes.push(zi.note);
  const ti=(cur.h>=23)?(ziMode==='late'?12:0):(cur.h<1?0:Math.floor((cur.h+1)/2));
  return {y:cur.y,m:cur.m,d:cur.d,ti,note:notes.join('；')};
}
/* ==================== 输入方式（公历、农历、四柱、已存） ====================
   四种方式最终都归到同一个公历日期加钟面时刻，再交给 paipan() 走同一条折算链，
   故四路所得之盘与手动填公历完全一致，不是各算一遍。
   农历转公历走 Lunar.fromYmd（闰月取负月），四柱转公历走 lunar.js 逐日反查。
   干支校验走 isValidGZ，五虎遁走 monthGanOf，五鼠遁走 hourGanOf，皆调 bazi-core.js，与八字页同一真源。
   已存独立键 ZW_SAVED，不复用八字的 BZI_SAVED：两页条目结构不同，混用会把对方的字段写进自己的条目。 */
const ZW_MODE_KEY='ZW_PAGE_MODE', ZW_SAVED_KEY='ZW_SAVED', ZW_SAVED_SESS_KEY='ZW_SAVED_SESS', ZW_SAVED_MAX=9;
const ZW_LUNAR_M=['正月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const ZW_LUNAR_D=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
/* 时支还原钟面整点：bazi-core.js 的 TZ_HOUR 是顶层 const，跨 script 取不到，此处按同一约定列明 */
const ZW_TZ_HOUR={'子':0,'丑':2,'寅':4,'卯':6,'辰':8,'巳':10,'午':12,'未':14,'申':16,'酉':18,'戌':20,'亥':22};
/* 字段显隐：本页 .form-row 为 flex 容器，会压过浏览器对 hidden 属性的默认样式，故显式兑现一次 */
function zwShow(id,on){ const el=document.getElementById(id); if(el) el.hidden=!on; }
function zwMode(){
  const m=(document.getElementById('zMode')||{}).value||'date';
  return {mode:m, isLunar:m==='lunar', isPillar:m==='pillar', isSaved:m==='saved'};
}
function zwModeToggle(){
  const {mode,isLunar,isPillar,isSaved}=zwMode();
  const dateable=!isSaved;
  zwShow('zNameField',dateable);
  zwShow('zDateField',!isLunar&&!isPillar&&dateable);
  ['zLunarYField','zLunarMField','zLunarLeapField','zLunarDField'].forEach(id=>zwShow(id,isLunar));
  zwShow('zPillar',isPillar);
  zwShow('zTimeField',!isPillar&&dateable);
  /* 时辰不确定依附于出生时刻：四柱与已存两模式无可改的时刻，勾了也无处生效，故随出生时间一并隐藏 */
  zwShow('zUnsureField',!isPillar&&dateable);
  zwShow('zSexField',dateable);
  zwShow('zSchoolField',dateable);
  zwShow('zwSavedList',isSaved);
  /* 双人合盘以主盘为对照前提，已存模式只列已存条目、不出盘，勾选行与第二人资料块整块撤下。
     四柱模式有主盘可对照，仍在（该模式的第二人资料按所填公历单独成盘）。 */
  const dualWrap=document.querySelector('.page-zw .dual-wrap');
  if(dualWrap) dualWrap.classList.toggle('is-off',isSaved);
  /* 时间折算与流派四项与出生地组皆为出生时刻的折算前提：四柱与已存两模式无待折算的原始时刻，
     留着只会让人以为改了有效，故一并隐藏。 */
  zwShow('zwOptsRow',!isPillar&&dateable);
  const birth=document.querySelector('.page-zw .birth-group');
  if(birth) birth.hidden=isPillar||isSaved;
  const pai=document.querySelector('.page-zw button[onclick="paipan()"]');
  if(pai) pai.hidden=!dateable;
  const save=document.querySelector('.page-zw button[onclick="zwSaveEntry()"]');
  if(save) save.hidden=!dateable;
  try{ localStorage.setItem(ZW_MODE_KEY,mode); }catch(e){}
  const out=document.getElementById('out');
  if(out&&(isPillar||isSaved)) out.innerHTML='';
  if(isPillar){ zwPillarLookup(); return; }
  if(isSaved){ zwRenderSaved(); return; }
  if(isLunar) zwLunarToDate();
  try{ paipan(); }catch(e){}
}
/* 时辰不确定：紫微换时辰并非只换一柱，命宫、身宫、十二宫星曜整盘移位，故不能像八字那样"按午时凑一柱"。
   勾选后盘照排（时刻仍取所填值），另出一张十三时辰对照表，逐时辰列当盘的命宫地支与主星，
   供以已验之事反查所属时辰；钩选与否只增此表，不动盘面。 */
function zwUnsureToggle(){
  const on=!!(document.getElementById('zUnsure')||{}).checked;
  const box=document.getElementById('zwTimingBox');
  if(box){ box.hidden=!on; if(!on){ box.innerHTML='<h3 class="rel-title">十三时辰对照（定时用）</h3>'; delete box.dataset.filled; } }
  if(on&&box&&!box.dataset.filled){ try{ paipan(); }catch(e){} }
}
/* 十三时辰对照表：同一出生日期与性别，逐时辰各排一盘，取命宫地支、命宫主星、身宫三项。
   早子与晚子并列十三档，与排盘口径一致（早子 index 0、晚子 index 12）。
   星曜亮度随宫位而异，一并列出，便于比对哪一档与已知性情相合。 */
const ZW_TIMING_HOURS=[['早子',0],['丑',1],['寅',2],['卯',3],['辰',4],['巳',5],['午',6],['未',7],['申',8],['酉',9],['戌',10],['亥',11],['晚子',12]];
function zwTimingTable(astro){
  const dateStr=astro.solarDate;
  const sex=astro.gender==='女'?'女':'男';
  const rows=ZW_TIMING_HOURS.map(([label,ti])=>{
    let a;
    try{ a=iztro.astro.bySolar(dateStr,ti,sex,true,'zh-CN'); }catch(e){ return null; }
    const ming=a.palaces.find(p=>p.name==='命宫')||a.palaces[0];
    const body=a.palaces.find(p=>p.isBodyPalace);
    const stars=(ming.majorStars||[]).map(s=>s.name+(s.brightness?'（'+s.brightness+'）':''));
    return {label,ti,branch:ming.earthlyBranch,stars:stars.join('、')||'空宫',
      body:body?body.name:'未标',range:a.timeRange||'',cur:a.time===astro.time};
  }).filter(Boolean);
  if(!rows.length) return '';
  return `<div class="zw-scroll"><table class="zw-pal-mean zw-timing"><thead><tr>
    <th>时辰</th><th>时刻</th><th>命宫</th><th>命宫主星</th><th>身宫</th></tr></thead><tbody>
    ${rows.map(r=>`<tr${r.cur?' class="cur"':''}><td>${r.label}${r.cur?'（本次）':''}</td><td>${r.range.replace('~','至')}</td><td>${r.branch}</td><td>${r.stars}</td><td>${r.body}</td></tr>`).join('')}
  </tbody></table></div>
  <p class="ly-zh-p">比对之法：取一件确凿已知的旧事（如某年迁居、入职、成婚，或自幼性情之定评），
  看哪一档命宫主星与之相合，即以该档为定时之据。命宫主星同档内不变者，可再参身宫落位分辨。</p>`;
}
/* 对照表只在勾"时辰不确定"时填装：未勾时匣内留空并保持隐藏，不白排十三盘。 */
function zwRenderTiming(astro){
  const box=document.getElementById('zwTimingBox');
  if(!box) return;
  const on=!!(document.getElementById('zUnsure')||{}).checked;
  box.hidden=!on;
  if(!on){ box.innerHTML='<h3 class="rel-title">十三时辰对照（定时用）</h3>'; delete box.dataset.filled; return; }
  box.innerHTML='<h3 class="rel-title">十三时辰对照（定时用）</h3>'+zwTimingTable(astro);
  box.dataset.filled='1';
}
/* 农历转公历：闰月以负月传入（lunar.js 的约定），年超界或该月无此日时提示并中止。
   结果写回公历框，排盘链路不必知道来的是农历还是公历。 */
function zwLunarToDate(){
  const yEl=document.getElementById('zLunarY'), mEl=document.getElementById('zLunarM'), dEl=document.getElementById('zLunarD');
  const leapEl=document.getElementById('zLunarLeap');
  const ly=parseInt(yEl.value,10), lm=parseInt(mEl.value,10), ld=parseInt(dEl.value,10), leap=leapEl&&leapEl.checked;
  if(!ly||!lm||!ld) return;
  if(ly<1900||ly>2100){ alert('农历年范围 1900 至 2100'); return; }
  if(leap){
    let lm0=0;
    try{ lm0=LunarYear.fromYear(ly).getLeapMonth(); }catch(e){ lm0=0; }
    if(lm0!==lm){ alert(ZW_LUNAR_M[lm-1]+'不是该农历年的闰月'+(lm0?('，本年闰月为闰'+ZW_LUNAR_M[lm0-1]):'')); return; }
  }
  let solar;
  try{ solar=Lunar.fromYmd(ly, leap?-lm:lm, ld).getSolar(); }
  catch(e){ alert('农历日期无效，该月可能不足 '+ZW_LUNAR_D[ld-1]+' 天'); return; }
  document.getElementById('zDate').value=String(solar.getYear()).padStart(4,'0')+'-'+String(solar.getMonth()).padStart(2,'0')+'-'+String(solar.getDay()).padStart(2,'0');
}
/* 恢复上次输入方式：刷新后仍停在四柱或已存，不必每次重选。
   四柱模式此时尚未选定候选日，是否排盘由 zwPillarLookup 自行决定，此处不代排。 */
function zwRestoreMode(){
  let m='';
  try{ m=localStorage.getItem(ZW_MODE_KEY)||''; }catch(e){}
  const modeEl=document.getElementById('zMode');
  if(modeEl&&m) modeEl.value=m;
  zwModeToggle();
}
/* 干支下拉填值：十干十二支全列，六十甲子之外的组合留到选完时用 isValidGZ 判，不靠下拉预筛。
   预筛会随先选干还是先选支而变，反而把可用的另一半挡在门外。 */
function zwFillGZSelects(){
  [['zpyG','zpyZ'],['zpmG','zpmZ'],['zpdG','zpdZ'],['zptG','zptZ']].forEach(([gId,zId])=>{
    const g=document.getElementById(gId), z=document.getElementById(zId);
    if(!g||!z||g.dataset.filled) return;
    g.innerHTML=GAN.map(x=>`<option value="${x}">${x}</option>`).join('');
    z.innerHTML=ZHI_ORDER.map(x=>`<option value="${x}">${x}</option>`).join('');
    g.dataset.filled='1'; z.dataset.filled='1';
  });
}
/* 四柱反查：年月日三柱定候选公历日，时支还原成钟面整点回填时间框。
   月柱由年干遁出、时柱由日干遁出，故组合不自洽时直接指明错在哪一柱，用户改的就是自己填错的那一位。 */
function zwPillarLookup(){
  zwFillGZSelects();
  const pickField=document.getElementById('zPillarPickField'), pick=document.getElementById('zPillarPick');
  if(!pick) return;
  const v=id=>(document.getElementById(id)||{}).value||'';
  const yg=v('zpyG'), yz=v('zpyZ'), mg=v('zpmG'), mz=v('zpmZ'), dg=v('zpdG'), dz=v('zpdZ'), tg=v('zptG'), tz=v('zptZ');
  if(!yg||!yz||!mg||!mz||!dg||!dz||!tg||!tz) return;
  if(!isValidGZ(yg,yz)){ zwPillarMsg('年柱 '+yg+yz+' 不在六十甲子之内'); return; }
  if(!isValidGZ(mg,mz)){ zwPillarMsg('月柱 '+mg+mz+' 不在六十甲子之内'); return; }
  if(!isValidGZ(dg,dz)){ zwPillarMsg('日柱 '+dg+dz+' 不在六十甲子之内'); return; }
  if(!isValidGZ(tg,tz)){ zwPillarMsg('时柱 '+tg+tz+' 不在六十甲子之内'); return; }
  if(monthGanOf(yg,mz)!==mg){ zwPillarMsg('月柱不合五虎遁，'+yg+'年'+mz+'月应作 '+monthGanOf(yg,mz)+mz); return; }
  if(hourGanOf(dg,tz)!==tg){ zwPillarMsg('时柱不合五鼠遁，'+dg+'日'+tz+'时应作 '+hourGanOf(dg,tz)+tz); return; }
  const cands=zwPillarCandidates(yg+yz,mg+mz,dg+dz);
  if(!cands.length){ zwPillarMsg('该组四柱在 1900 至 2100 年内查不到对应的公历日期'); return; }
  pick.innerHTML=cands.map(c=>`<option value="${c}">${c}</option>`).join('');
  pickField.hidden=false;
  zwPillarMsg(cands.length>1?('查到 '+cands.length+' 个候选公历日，请选定出生日'):'');
  zwPillarPick();
}
/* 年柱取法随所选年界：春节换年取正月初一之后的农历年干支，立春换年取节气交节之后的年柱。
   两档皆由 lunar.js 的同一套历算出，与 paipan() 交给 iztro 的 yearDivide 两档一一对应，
   反查与排盘才不会一处按春节一处按立春而对不上。 */
function zwYearGZOf(solarDate,isExact){
  const lunar=solarDate.getLunar();
  return isExact?lunar.getEightChar().getYear():lunar.getYearInGanZhi();
}
/* 候选公历日：先在 1900 至 2100 内按年柱筛年份（以年中为取样点，避开两种年界的交界月），
   再在命中年份的腊月至次年三月间逐日核月柱与日柱。时柱只参与校验不参与检索：
   同时辰的日期常有，并入检索会把候选收窄，甚至收窄到零。 */
function zwPillarCandidates(yearGZ,monthGZ,dayGZ){
  const isExact=((document.getElementById('zYear')||{}).value||'normal')==='exact';
  const res=[];
  for(let y=1900;y<=2100;y++){
    const probe=Solar.fromYmd(y,6,1);
    if(zwYearGZOf(probe,isExact)!==yearGZ) continue;
    const t0=Date.UTC(y-1,11,1), span=135;
    for(let k=0;k<span;k++){
      const dt=new Date(t0+k*86400000), sy=dt.getUTCFullYear(), sm=dt.getUTCMonth()+1, sd=dt.getUTCDate();
      if(sy<1900||sy>2100) continue;
      const solar=Solar.fromYmd(sy,sm,sd);
      if(zwYearGZOf(solar,isExact)!==yearGZ) continue;
      const ec=solar.getLunar().getEightChar();
      if(ec.getMonth()===monthGZ&&ec.getDay()===dayGZ) res.push(sy+'-'+String(sm).padStart(2,'0')+'-'+String(sd).padStart(2,'0'));
    }
  }
  return res;
}
function zwPillarMsg(msg){
  let host=document.getElementById('zPillarMsg');
  if(!host){
    const row=document.getElementById('zPillar'); if(!row) return;
    host=document.createElement('div');
    host.className='zw-pillar-msg'; host.id='zPillarMsg'; host.setAttribute('role','status');
    row.appendChild(host);
  }
  host.textContent=msg; host.hidden=!msg;
}
/* 选定候选日：写入公历框与钟面时刻后走常规排盘。时支先取为代表整点，
   再交页面自身的夏令时、太阳时、子时三项折算，与手动填同一时刻所得一致。 */
function zwPillarPick(){
  const pick=document.getElementById('zPillarPick');
  const dv=pick&&pick.value;
  if(!dv) return;
  document.getElementById('zDate').value=dv;
  const tz=(document.getElementById('zptZ')||{}).value||'子';
  document.getElementById('zTime').value=String(ZW_TZ_HOUR[tz]).padStart(2,'0')+':00';
  try{ paipan(); }catch(e){}
}
/* 已存取用：localStorage 为主、sessionStorage 为备，与八字页同式，
   一处写不进（隐私模式、配额）时另一处仍能取回。 */
function zwGetSaved(){
  const rd=(store,k)=>{ try{ const raw=store.getItem(k); if(!raw) return null; const a=JSON.parse(raw); return Array.isArray(a)?a:null; }catch(e){ return null; } };
  return rd(localStorage,ZW_SAVED_KEY)||rd(sessionStorage,ZW_SAVED_SESS_KEY)||[];
}
function zwSetSaved(arr){
  const list=arr.slice(0,ZW_SAVED_MAX);
  try{ localStorage.setItem(ZW_SAVED_KEY,JSON.stringify(list)); }catch(e){}
  try{ sessionStorage.setItem(ZW_SAVED_SESS_KEY,JSON.stringify(list)); }catch(e){}
}
function zwSavedInfoText(e){
  if(e.mode==='lunar') return '农历 '+e.lunarY+'年'+(e.lunarLeap?'闰':'')+(ZW_LUNAR_M[Number(e.lunarM)-1]||'')+(ZW_LUNAR_D[Number(e.lunarD)-1]||'')+' '+e.time;
  if(e.mode==='pillar') return (e.yg+e.yz)+' '+(e.mg+e.mz)+' '+(e.dg+e.dz)+' '+(e.tg+e.tz);
  return (e.date||'')+' '+(e.time||'');
}
function zwRenderSaved(){
  const host=document.getElementById('zwSavedList'); if(!host) return;
  const list=zwGetSaved();
  const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  if(!list.length){
    host.innerHTML='<div class="sr"><div class="sc sc-info" style="border-bottom:none">暂无已存命盘。在公历、农历或四柱模式下填写后点保存，即可在此取用。</div></div>';
    return;
  }
  let html='<div class="sr sr-head"><div class="sc sc-name">姓名</div><div class="sc sc-sex">性别</div><div class="sc sc-info">出生资料</div><div class="sc sc-act">取用</div></div>';
  list.forEach((e,i)=>{
    html+='<div class="sr">'
      +'<div class="sc sc-name">'+esc(e.name)+'</div>'
      +'<div class="sc sc-sex">'+esc(e.sex)+'</div>'
      +'<div class="sc sc-info">'+esc(zwSavedInfoText(e))+'</div>'
      +'<div class="sc sc-act"><button type="button" class="btn-pai" onclick="zwLoadSaved('+i+')">排盘</button>'
      +'<button type="button" class="btn-del" onclick="zwDeleteSaved('+i+')" aria-label="删除">×</button></div>'
      +'</div>';
  });
  host.innerHTML=html;
}
function zwSaveEntry(){
  const {mode,isSaved}=zwMode();
  if(isSaved){ alert('请先切到公历、农历或四柱模式填好资料再保存'); return; }
  const name=(document.getElementById('zName').value||'').trim()||'未命名';
  const entry={name,mode,sex:document.getElementById('zSex').value,school:document.getElementById('zSchool').value};
  if(mode==='date'){
    const d=document.getElementById('zDate').value;
    if(!d){ alert('请填写公历出生日期后再保存'); return; }
    entry.date=d; entry.time=document.getElementById('zTime').value||'12:00';
  } else if(mode==='lunar'){
    const y=document.getElementById('zLunarY').value, m=document.getElementById('zLunarM').value, d=document.getElementById('zLunarD').value;
    if(!y||!m||!d){ alert('请完整填写农历年、月、日后再保存'); return; }
    entry.lunarY=y; entry.lunarM=m; entry.lunarD=d; entry.lunarLeap=!!(document.getElementById('zLunarLeap')||{}).checked;
    entry.time=document.getElementById('zTime').value||'12:00';
  } else {
    const v=id=>(document.getElementById(id)||{}).value||'';
    const p={yg:v('zpyG'),yz:v('zpyZ'),mg:v('zpmG'),mz:v('zpmZ'),dg:v('zpdG'),dz:v('zpdZ'),tg:v('zptG'),tz:v('zptZ')};
    if(Object.keys(p).some(k=>!p[k])){ alert('请把四柱干支填全后再保存'); return; }
    Object.assign(entry,p);
  }
  const list=zwGetSaved(), info=zwSavedInfoText(entry);
  const same=list.findIndex(x=>x.mode===mode&&x.sex===entry.sex&&zwSavedInfoText(x)===info);
  if(same>=0) list[same]=entry; else list.push(entry);
  while(list.length>ZW_SAVED_MAX) list.shift();
  zwSetSaved(list);
  const btn=document.querySelector('button[onclick="zwSaveEntry()"]');
  if(btn){ const old=btn.textContent; btn.textContent='已保存'; setTimeout(()=>{ if(btn.textContent==='已保存') btn.textContent=old; },1200); }
}
function zwDeleteSaved(i){
  const list=zwGetSaved(); if(i<0||i>=list.length) return;
  list.splice(i,1); zwSetSaved(list); zwRenderSaved();
}
function zwLoadSaved(i){
  const e=zwGetSaved()[i]; if(!e) return;
  const modeEl=document.getElementById('zMode');
  if(modeEl){ modeEl.value=e.mode; zwModeToggle(); }
  const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.value=v; };
  set('zName',e.name==='未命名'?'':e.name);
  set('zSex',e.sex||'男');
  set('zSchool',e.school||'sanhe');
  if(e.mode==='lunar'){
    set('zLunarY',e.lunarY); set('zLunarM',e.lunarM); set('zLunarD',e.lunarD);
    const lp=document.getElementById('zLunarLeap'); if(lp) lp.checked=!!e.lunarLeap;
    set('zTime',e.time||'12:00');
    zwLunarToDate();
  } else if(e.mode==='pillar'){
    set('zpyG',e.yg); set('zpyZ',e.yz); set('zpmG',e.mg); set('zpmZ',e.mz);
    set('zpdG',e.dg); set('zpdZ',e.dz); set('zptG',e.tg); set('zptZ',e.tz);
    zwPillarLookup();
    return;
  } else {
    set('zDate',e.date); set('zTime',e.time||'12:00');
  }
  try{ paipan(); }catch(err){}
}
/* 出生地未定而太阳时又开时，不给经度：按别人的经度折出来的时辰不著来历，与未校正是两回事。
   提示语落 #out 与排盘失败同一处，用户不必另找一处报错框。 */
const ZW_NO_PLACE_MSG='太阳时校正已开，但未定出生地：请在出生地组选择省份与城市，或手动填写经度；若出生地无考，把太阳时改为不校正，按钟面标准时出盘。';
/* 出生地经度：手动经度优先，否则按省市区查行政区划经度（findLng 已回退省级中心经度）；
   省市两级仍停在未知地时返回空，不回退任一城市经度。 */
function zwLngOf(prefix){
  const ml=document.getElementById(prefix+'Lng').value;
  if(ml!=='') return parseFloat(ml);
  const p=document.getElementById(prefix+'Prov'), c=document.getElementById(prefix+'City'), s=document.getElementById(prefix+'Dist');
  if(!p) return null;

}

    const v=input.value;
    if(!v){ out.innerHTML='<p class="ly-zh-p">请先选择日期</p>'; return; }

  };
  btn.onclick=recalc;
  input.onchange=recalc;
  input.oninput=recalc; // 输入即算，规避部分浏览器 date 控件 change 不触发的场景
  if(hour) hour.onchange=recalc;
  out.__zwRecalc=recalc;
}
/* 当前时辰转 iztro 时辰 index：0 早子、1 丑、11 亥、12 晚子。 */
function zwTimeIndexFromHours(h){ return Math.floor(((h+1)%24)/2); }
function zwNowTimeIndex(){ try{ return zwTimeIndexFromHours(xjNowDate().getHours()); }catch(e){ return 0; } }
/* ===== 紫微盘交互：悬停/点击宫 → 本宫加深 + 三方四正关联宫变色；中宫画布以 12 个边界点折线连接 4 宫（参照 iztro Line 4 段折线穿过中宫） ===== */
function zwDrawLinks(focusName){
  const board=document.querySelector('.zw-board'); if(!board) return;
  const canvas=board.querySelector('.zw-links'); if(!canvas) return;
  const focus=focusName||'命宫';
  const palEl=board.querySelector(`.zw-pal[data-name="${focus}"]`);
  // 兜底 rect.width=0（jsdom 或 display:none 时）：用 board 尺寸做参考
  let rect=canvas.getBoundingClientRect();
  if(!rect.width || !rect.height){
    const br=board.getBoundingClientRect();
    rect={width:br.width||780, height:br.height||780};
  }
  const W=Math.max(rect.width,1), H=Math.max(rect.height,1);
  // 1 像素 = 1 设备像素，避免 HiDPI 上 stroke 模糊
  const dpr=window.devicePixelRatio||1;
  if(canvas.width!==W*dpr || canvas.height!==H*dpr){
    canvas.width=W*dpr; canvas.height=H*dpr;
  }
  const ctx=canvas.getContext('2d'); if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(!palEl) return;
  // 中宫 DOM 实际矩形（含 padding/gap 后才是真实中宫边界），换算成画布像素
  const cen=board.querySelector('.zw-center');
  const cenRect=cen?cen.getBoundingClientRect():null;
  const brRect=board.getBoundingClientRect();
  let x0,x1,y0,y1;
  if(cenRect&&cenRect.width&&brRect.width){
    // center 相对 board 的位移比例 → 乘 W/H 得画布像素
    x0=((cenRect.left-brRect.left)/brRect.width)*W;
    x1=((cenRect.right-brRect.left)/brRect.width)*W;
    y0=((cenRect.top-brRect.top)/brRect.height)*H;
    y1=((cenRect.bottom-brRect.top)/brRect.height)*H;
  }else{ // 兜底：中宫约占整盘 0.25~0.75，内缩到 0.27~0.73 保证线不出宫
    x0=W*0.27; x1=W*0.73; y0=H*0.27; y1=H*0.73;
  }
  // 12 宫锚点由各宫 grid 列行（POS）直接推导：row1→上边(y0)、row4→下边(y1)、col1→左边(x0)、col4→右边(x1)。
  const INSET=0;   // 锚点从中宫边框内移，留出与边框的间隙（不压边框线）
    /* 锚点 = 中宫中心与相关宫中心连线、同中宫边框的交点（方向准确指向宫位，且必在边框上） */
  const cenPt=[(x0+x1)/2, (y0+y1)/2];
  const anchorOf=(palName)=>{
    const el=board.querySelector('.zw-pal[data-name="'+palName+'"]');
    if(!el) return null;
    const r=el.getBoundingClientRect();
    const px=((r.left+r.width/2-brRect.left)/brRect.width)*W;
    const py=((r.top+r.height/2-brRect.top)/brRect.height)*H;
    /* 射线 cenPt→(px,py) 与中宫矩形求交 */
    let t=Infinity;
    if(px>cenPt[0]+0.01) t=Math.min(t,(x1-cenPt[0])/(px-cenPt[0]));
    if(px<cenPt[0]-0.01) t=Math.min(t,(x0-cenPt[0])/(px-cenPt[0]));
    if(py>cenPt[1]+0.01) t=Math.min(t,(y1-cenPt[1])/(py-cenPt[1]));
    if(py<cenPt[1]-0.01) t=Math.min(t,(y0-cenPt[1])/(py-cenPt[1]));
    if(!isFinite(t)) return null;
    const tt=Math.max(0, t-2/Math.max(Math.abs(px-cenPt[0]),Math.abs(py-cenPt[1]),1));  /* 内收 2px，抵消线宽溢出 */
    return [cenPt[0]+(px-cenPt[0])*tt, cenPt[1]+(py-cenPt[1])*tt];
  };
  const oppOf={'子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳'};
  const triOf={'子':['辰','申'],'丑':['巳','酉'],'寅':['午','戌'],'卯':['未','亥'],'辰':['申','子'],'巳':['酉','丑'],'午':['戌','寅'],'未':['亥','卯'],'申':['子','辰'],'酉':['丑','巳'],'戌':['寅','午'],'亥':['卯','未']};
  const focusBr=palEl.dataset.br;
  const oppName=(()=>{ const el=board.querySelector('.zw-pal[data-br="'+oppOf[focusBr]+'"]'); return el?el.dataset.name:null; })();
  const triNames=triOf[focusBr].map(bb=>{ const el=board.querySelector('.zw-pal[data-br="'+bb+'"]'); return el?el.dataset.name:null; }).filter(Boolean);
  const focusA=anchorOf(focus);
  const oppA=oppName?anchorOf(oppName):null;
  const triA=triNames.map(nm=>anchorOf(nm)).filter(Boolean);
  ctx.strokeStyle=getComputedStyle(board).getPropertyValue('--zw').trim()||'#5a3a7e';
  ctx.globalAlpha=.55;
  ctx.lineWidth=1;
  ctx.lineJoin='round';
  ctx.lineCap='round';
  ctx.beginPath();
  if(focusA) ctx.moveTo(focusA[0], focusA[1]);
  if(triA[0]) ctx.lineTo(triA[0][0], triA[0][1]);
  if(triA[1]) ctx.lineTo(triA[1][0], triA[1][1]);
  if(focusA) ctx.closePath();
  ctx.stroke();
  if(oppA && focusA){
    ctx.beginPath();
    ctx.moveTo(focusA[0], focusA[1]);
    ctx.lineTo(oppA[0], oppA[1]);
    ctx.stroke();
  }
  const sanNames=palEl?(palEl.dataset.san||focus).split(','):[focus];
  const sanSet=new Set(sanNames);
  board.querySelectorAll('.zw-pal').forEach(el=>{
    const nm=el.dataset.name;
    el.classList.toggle('zw-focused', nm===focus);
    el.classList.toggle('zw-rel', sanSet.has(nm)&&nm!==focus);
  });
}
