<script>
renderChrome('ziwei.html');let __zw=null;
/* 十四主星五行，全页单一真源 */
const WX_STAR={'紫微':'土','天机':'木','太阳':'火','武曲':'金','天同':'水','廉贞':'火','天府':'土','太阴':'水','贪狼':'木','巨门':'水','天相':'水','天梁':'土','七杀':'金','破军':'水'};
/* 双人合盘资料块：显隐由勾选态派生，样式表里只有默认态与 is-on 两条 */
function zwRelToggle(){
  const box=document.getElementById('zwRel2'), chk=document.getElementById('zwRel');
  if(box&&chk) box.classList.toggle('is-on', chk.checked);
}
/* ============ 三大折叠模块 ============ */
const ZW_MOD_KEY='zwModState';
function zwReadModState(){
  try{
    let raw=localStorage.getItem(ZW_MOD_KEY);
    if(!raw) raw=sessionStorage.getItem(ZW_MOD_KEY);
    const s=JSON.parse(raw||'{}');
    return (s&&typeof s==='object')?s:{};
  }catch(e){ return {}; }
}
function zwSaveModState(){
  if(!window.__zwInitDone) return;   /* 初始化完成前不写，避免覆盖已存偏好 */
  try{
    /* 以已存为底、只覆盖此刻在场的件：复位本身会触发 toggle 回调本函数，
       整份重写会把此刻未渲染的件的键一并抹掉，下次刷新读不回来 */
    const o=zwReadModState();
    document.querySelectorAll('#out section.mod[id]').forEach(m=>{ o[m.id]=!m.classList.contains('collapsed'); });
    document.querySelectorAll('#out details[id]').forEach(d=>{ o[d.id]=d.open; });
    try{ localStorage.setItem(ZW_MOD_KEY, JSON.stringify(o)); }catch(e){}
    try{ sessionStorage.setItem(ZW_MOD_KEY, JSON.stringify(o)); }catch(e){}
  }catch(e){}
}
function zwToggleMod(id){
  const el=document.getElementById(id); if(!el) return;
  el.classList.toggle('collapsed'); zwSaveModState();
}
function zwApplyModState(){
  const s=zwReadModState();
  document.querySelectorAll('#out section.mod[id]').forEach(m=>{ if(m.id in s) m.classList.toggle('collapsed', !s[m.id]); });
  document.querySelectorAll('#out details[id]').forEach(d=>{ if(d.id in s) d.open=!!s[d.id]; });
}
document.addEventListener('toggle',function(e){
  const t=e.target;
  if(t && t.tagName==='DETAILS' && t.id && t.closest('#out')) zwSaveModState();
},true);
const POS={巳:[1,1],午:[2,1],未:[3,1],申:[4,1],辰:[1,2],酉:[4,2],卯:[1,3],戌:[4,3],寅:[1,4],丑:[2,4],子:[3,4],亥:[4,4]};
const SANHE=['命宫','财帛','官禄','迁移']; /* 三方四正（命宫一组） */
/* 宫位关联：四正=本宫+对宫；三方=再+两个三合宫。按地支三合/对冲动态算，供中宫连线与关联高亮。
   三合：申子辰/寅午戌/巳酉丑/亥卯未；对冲：子午丑未寅申卯酉辰戌巳亥。 */
const ZW_SANHE={子:['申','子','辰'],午:['寅','午','戌'],辰:['申','子','辰'],戌:['寅','午','戌'],
  申:['申','子','辰'],寅:['寅','午','戌'],巳:['巳','酉','丑'],酉:['巳','酉','丑'],
  丑:['巳','酉','丑'],卯:['亥','卯','未'],亥:['亥','卯','未'],未:['亥','卯','未']};
const ZW_CHONG={'子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳'};
/* 某地支宫的三方四正（不含本宫，返回其余3宫地支）：对宫 + 两个三合宫 */
function zwSanfangBrOf(br){
  const opp=ZW_CHONG[br];
  const san=ZW_SANHE[br]||[];
  return [...new Set([opp, ...san])].filter(b=>b&&b!==br);
}
// 紫微综合判断：命宫主星+亮度、性质、身宫、四化落宫人事、三方四正、大限落位，串成该盘具体指向
function ziweiRead(astro, school, trans, sex){
  const soulP=astro.palaces.find(p=>p.name==='命宫');
  const bodyP=astro.palaces.find(p=>p.isBodyPalace);
  const soulMj=(soulP&&soulP.majorStars||[]).map(s=>s.name+(s.brightness?('（'+s.brightness+'）'):'')).join('、')||'无主星';
  const bodyName=bodyP?bodyP.name:'未标身宫';
  const palOf=o=>{const p=astro.palaces.find(x=>(x.majorStars||[]).concat(x.minorStars||[]).some(s=>s.mutagen===o));return p?p.name:'';};
  const luPal=palOf('禄'), jiPal=palOf('忌');
  const meanOf=rn=>{const r=ZIWEI_PAL_MEAN.find(x=>x[0]===rn);return r?r[1]:'';};
  // 命宫主星本性/事业（具体：太阳、天梁）。事业方向只取[1]字段首段（逗号前方向词），剔除描述短语并去重
  // 命宫主星本性/事业。事业方向=命宫各主星[1]（纯职业清单）合并去重，仅句首一个"宜"总领（宜A、B、C）
  const natOf=(()=>{ const arr=(soulP&&soulP.majorStars||[]); const nm=arr.map(s=>ZW_STAR_MEAN[s.name]?ZW_STAR_MEAN[s.name][0].split('，')[0]:s.name).filter(Boolean).join('、'); const toks=arr.map(s=>ZW_STAR_MEAN[s.name]?(ZW_STAR_MEAN[s.name][1]||'').split(/[，,、]/).map(t=>t.trim()).filter(Boolean):[]).flat(); const uniq=toks.filter((v,i)=>toks.indexOf(v)===i); const dir=uniq.length?('宜'+uniq.join('、')):''; return {nm,dir,list:arr}; })();
  // 命宫主星亮度 + 星性组合判断（具体到星，非"格局易成"泛话）
  const soulStars=(soulP&&soulP.majorStars||[]);
  let briTxt='';
  if(soulStars.length){
    const starTxt=soulStars.map(s=>{ const m=ZW_STAR_MEAN[s.name]; const nat=m?m[0].split('，')[0]:s.name; const b=(s.brightness==='庙'||s.brightness==='旺'||s.brightness==='得')?'得地':((s.brightness==='陷'||s.brightness==='不')?'落陷':'平常'); return `${s.name}${s.brightness?'（'+s.brightness+'）':''}${nat}${b}`; }).join('、');
    if(soulStars.every(s=>s.brightness==='庙'||s.brightness==='旺'||s.brightness==='得')) briTxt='命宫主星尽数得地，先天之势足';
    else if(soulStars.every(s=>s.brightness==='陷'||s.brightness==='不')) briTxt='命宫主星尽皆落陷，先天之势弱';
    else briTxt='命宫主星有得有失，先天之势中和';
  } else { briTxt='命宫无主星，先天之势依借星参断'; }
  // 身宫落位人事
  const bodyMean=bodyP?meanOf(bodyP.name):'';
  // 四化落宫人事
  const luMean=luPal?meanOf(luPal):'', jiMean=jiPal?meanOf(jiPal):'';
  // 三方四正（命财官迁）星曜具体
  // 当前大限落位（当下人事）：按大限算法（局数起岁+年干阴阳顺逆）定位当前年份所在宫
  let curMean='';
  try{
    const yg=(astro.chineseDate||'').trim().slice(0,1);
    const yang='甲丙戊庚壬'.indexOf(yg)>=0;
    const fwd=(yang&&sex==='男')||(!yang&&sex==='女');
    const cnNum={'一':1,'二':2,'三':3,'四':4,'五':5,'六':6};
    const ju=(String(astro.fiveElementsClass||'').match(/[一二三四五六]/)||[])[0];
    const st=(ju&&cnNum[ju])?cnNum[ju]:2;
    const seq=['命宫','兄弟','夫妻','子女','财帛','疾厄','迁移','仆役','官禄','田宅','福德','父母'];
    const bn={}; astro.palaces.forEach(p=>bn[p.name]=p); let ord=seq.map(n=>bn[n]).filter(Boolean); if(fwd){ ord=ord.slice().reverse(); const mi=ord.findIndex(x=>x.name==='命宫'); if(mi>0) ord=ord.slice(mi).concat(ord.slice(0,mi)); }
    const yr=new Date().getFullYear(); const idx=Math.floor((yr-st)/10);
    const cur=ord[idx];
    if(cur){ const m=meanOf(cur.name); curMean=`当前大限落${cur.name}宫位，主${m||cur.name}`; }
  }catch(e){ curMean=''; }
  // 身宫落位针对性分析：一生着力方向与命途侧重（非罗列，给具体判断）
  const BODY_ADV={ '命宫':'重心落本身，主自主自立，一生大事多靠自己决断、少借外力，宜早立目标自任其事'
    ,'兄弟':'重心落手足同辈，一生贵在合作结伴，兄弟朋友为助力亦为牵绊，宜善经营人脉、借群体成事'
    ,'夫妻':'重心落婚姻家庭，一生着落在配偶相助与家室经营，宜先立家业、以婚配为人生拐点，忌独行'
    ,'子女':'重心落子女晚辈，一生着落在后继传承与教导培养，宜以子女为念、善育儿孙，老年得依'
    ,'财帛':'重心落财帛经营，一生着落在理财聚财、以财养身，宜务实理财、稳中积累，防财来亦防财去'
    ,'疾厄':'重心落身体健康，一生着落在体魄为本、调养为先，宜养生防病、保重身子，体质定运程'
    ,'迁移':'重心落外出远行，一生宜离乡发展、动中得机，外地机遇多于故土，宜向外开辟事业'
    ,'仆役':'重心落部属人际，一生贵在下属同事相助，善用人脉则事半功倍，宜驭众得助、防小人'
    ,'官禄':'重心落事业功名，一生着落在仕途职阶与声名成就，宜立业建功、求名求位，事业为命之轴'
    ,'田宅':'重心落房产家业，一生着落在置产安家、积累不动产，宜置业守业、以家产为根基，晚年安稳'
    ,'福德':'重心落精神福泽，一生着落在心性修养与福泽享受，宜修心养性、求内心安稳，福泽自随'
    ,'父母':'重心落长辈荫蔽，一生着落在父母师长庇荫与家学传承，宜敬上承恩、借长辈之助起步' };
  const bodyAdv=(BODY_ADV[bodyName]?('身宫落'+bodyName+'，'+BODY_ADV[bodyName]):'');
  // 四化落宫分析：化禄/化忌之星实义 + 落宫人事（具体到星，非"主得助"泛话）
  const huaStar=o=>{const a=(trans&&trans[o])||[];return a[0]?a[0]:'';};
  const huaWord=star=>{ // 该星化禄/化忌的具体含义（本性+化曜）
    const m=ZW_STAR_MEAN[star]; if(!m) return '';
    const nat=m[0].split('，')[0]||star; return nat;
  };
  const fenTxt=(o,star)=>{
    const nat=huaWord(star);
    const core=(o==='疾厄')?'主健康体质与精力，落此宫则'+nat+'之象得彰、体能精力为命之所系'
      :(o==='命宫')?'落命宫则先天根基、自身运势即为此曜所主，'+nat+'之气贯穿一生'
      :(o==='夫妻')?'落夫妻则婚姻配偶即受此曜之感，'+nat+'之情配进夫妻之道'
      :(o==='财帛')?'落财帛则理财聚财之途受此曜之气，'+nat+'主财之得失'
      :(o==='官禄')?'落官禄则事业功名之途受此曜之气，'+nat+'主事业之顺逆'
      :(o==='田宅')?'落田宅则家业房产之象受此曜之气，'+nat+'主家产之聚散'
      :(o==='迁移')?'落迁移则外出远行之机受此曜之气，'+nat+'主远方之遇'
      :(o==='父母')?'落父母则长辈荫蔽之途受此曜之气，'+nat+'主祖上助力'
      :(o==='福德')?'落福德则心性福泽之象受此曜之气，'+nat+'主精神安否'
      :(o==='兄弟')?'落兄弟则手足同辈之缘受此曜之气，'+nat+'主同侪助力'
      :(o==='子女')?'落子女则晚辈传承之途受此曜之气，'+nat+'主子息之聚'
      :(o==='仆役')?'落仆役则部属人脉之途受此曜之气，'+nat+'主用人得失'
      :`落${o}则此曜之气转进该宫人事`; return core;
  };
  const luStar=huaStar('禄'), jiStar=huaStar('忌');
  const luFen=luPal?(`化禄${luStar?luStar+'（'+huaWord(luStar)+'）':''}入${luPal}，${fenTxt(luPal,luStar)}`):'';
  const jiFen=jiPal?(`化忌${jiStar?jiStar+'（'+huaWord(jiStar)+'）':''}入${jiPal}，${fenTxt(jiPal,jiStar)}`):'';
  // 三方四正分析：命财官迁星曜旺陷→事业财运格局判断（非罗列）
  const sanPts={}; SANHE.forEach(nm=>{const p=astro.palaces.find(x=>x.name===nm);sanPts[nm]=(p&&p.majorStars||[]).map(s=>s.name+(s.brightness?'（'+s.brightness+'）':'')).join('、')||'空宫';});
  const allSan=SANHE.reduce((acc,nm)=>{const p=astro.palaces.find(x=>x.name===nm);(p&&p.majorStars||[]).forEach(s=>acc.push(s));return acc;},[]);
  const str=allSan.filter(s=>s.brightness==='庙'||s.brightness==='旺'||s.brightness==='得').length;
  const wk=allSan.filter(s=>s.brightness==='陷'||s.brightness==='不').length;
  const nmLst=allSan.map(s=>s.name);
  const sanName=SANHE.map(n=>n+'：'+sanPts[n]).join('；');
  let sanAdv='';
  if(sanPts.官禄==='空宫'&&sanPts.迁移==='空宫') sanAdv='命财官迁之中官禄、迁移二宫空，事业与外出之象偏伏，宜以命宫与财帛所主自持经营、稳中求进，不宜冒进远图';

  const lu=mutaPal.禄?mutaPal.禄:'（无）', quan=mutaPal.权?mutaPal.权:'（无）', ke=mutaPal.科?mutaPal.科:'（无）', ji=mutaPal.忌?mutaPal.忌:'（无）';
  const jiPalComma=mutaPal.忌||'';
  const majorNames=(soulStars.map(s=>s.name)).join('、');
  let geJu='';
  const hasAll=arr=>arr.every(n=>majorNames.includes(n));
  if(soulStars.length===0) geJu='空宫，借对宫及三方四正之星参断';
  else if(hasAll(['紫微','天府'])) geJu='紫府同宫，帝星坐镇、贵显气度';
  else if(hasAll(['七杀','破军','贪狼'])||(['七杀','破军'].some(n=>majorNames.includes(n)))) geJu='杀破狼格局，主变动开创、成败分明';
  else if(hasAll(['天机','太阴','天同','天梁'])) geJu='机月同梁，宜公职后勤、安稳受用';
  else if(hasAll(['太阳','太阴'])) geJu='日月并明，明暗调和、贵气相并';
  else if(hasAll(['廉贞','七杀'])) geJu='廉贞七杀，性烈主变、化忌则显辛劳';
  else if(hasAll(['武曲','贪狼'])) geJu='武贪同行，掌权竞争、发在晚运';
  else geJu='主星独坐为基（'+majorNames+'），凭亮度与四化定其用';
  const jiC=jiPalComma?'化忌直落'+jiPalComma+'，是该宫力弱之处，宜静守防反复。':'无大忌直冲，四化相对平衡。';
  let sanStr;
  if(szXiong>szJi) sanStr='三方四正凶曜偏多（凶'+szXiong+'处、吉化'+szJi+'处），格局开合有阻，宜以德化争、后天补益';
  else if(szJi>0) sanStr='三方四正吉化汇聚（吉化'+szJi+'处、凶曜'+szXiong+'处），会照得力、格局清扬易成';
  else sanStr='三方四正吉凶相当，主星聚'+szMajors+'星，凭大限流年引动进退';
  const adv={
    0:'先天禀赋偏旺，宜早立事业方向、居强势领域，然旺极防专横，宜配谦和之德。',
    1:'格局中和，权衡得宜，宜稳扎稳打、以专业精进立身，忌好高骛远。',
    2:'禀赋平和，宜量力而行、取务实稳健之路，辅以后天经营补足偏弱之宫。',
    3:'偏弱落陷，宜避锋芒、养精蓄锐，借三方四正吉星与大限翻转之时再图进取。'
  };
  const tip=(jiPalComma?('又'+jiC):jiC)+'　'+adv[level];
  return {label,level,zuhe:geJu,trans:['禄'+lu,'权'+quan,'科'+ke,'忌'+ji].join('　'),san:sanStr,tip};
}
/* 流年断语：取当年(今年)流年盘，给"今年运势"白话重点。含流年干支/命宫/四化落宫 */

    const sanAll=SAN3.reduce((acc,role)=>{const p=roleOf(role);(p&&p.majorStars||[]).forEach(s=>acc.push(s));return acc;},[]);
    const strong=sanAll.filter(s=>s.brightness==='庙'||s.brightness==='旺'||s.brightness==='得').length;
    const weak=sanAll.filter(s=>s.brightness==='陷'||s.brightness==='不').length;
    let ge='';
    if(strong>=4&&weak===0) ge='流年三方多主星庙旺，气势清扬，诸事顺手、宜把握进取。';
    else if(weak>=3) ge='流年三方多落陷，宜守成稳进、避锋芒，待吉运引动再图。';

    const quans=order.map((o,i)=>{
      const star=(y.mutagen||[])[i]; if(!star) return '化'+o+'未见';
      const p=as.palaces.find(x=>(x.majorStars||[]).concat(x.minorStars||[]).some(s=>s.name===star));
      return p?`<b class="ln-${o}">化${o}${star}入${p.name}</b>（${meanMap[o]}）`:'化'+o+'未见';
    });
    body=`<table class="zp-yun-tbl"><tbody>
        <tr><th>流年命宫</th><td>${mgName}：${mgStars}${(mg&&mg.name&&mg.name!=='命宫')?('，落本命'+mg.name+'宫位，主'+((()=>{const r=ZIWEI_PAL_MEAN.find(x=>x[0]===mg.name);return r?r[1]:mg.name;})())):''}${mgZhong}</td></tr>

  }
  return {ok:true, gz, body};
}
/* 选定日期 → 推算该日期所在大运 + 流年/流月/流日（按派别：三合看三方四正、四化看四化） */
function zwDateCalc(astro, dateStr, school){
  let h=null;
  try{ h=astro.horoscope(dateStr); }catch(e){ try{ h=astro.horoscope({solarDate:dateStr}); }catch(e2){ h=null; } }
  if(!h) return '<p class="ly-zh-p">该日期暂不可推算</p>';
  const as=h.astrolabe;
  const gzOf=lvl=>{ const o=lvl; return o?o.heavenlyStem+o.earthlyBranch:'--'; };
  const dec=h.decadal;
  const decTxt=dec?`${dec.name}（${dec.heavenlyStem}${dec.earthlyBranch}）`:'--';
  // 本命盘地支→宫名映射（命宫落位人事方向）
  const brToName={}; astro.palaces.forEach(p=>brToName[p.earthlyBranch]=p.name);
  // 各层分析 → 结构化数据（供表格）
  const palMeanOf=role=>{ const r=ZIWEI_PAL_MEAN.find(x=>x[0]===role); return r?r[1]:''; };
  const starCar=name=>{ const r=ZW_STAR_MEAN[name]; return r?r[1]:''; };
  const starNature=name=>{ const r=ZW_STAR_MEAN[name]; return r?r[0]:''; };
  const levelData=(name,o)=>{
    if(!o||!o.palaceNames) return null;
    const roleOf=role=>as.palaces[o.palaceNames.indexOf(role)];
    const mg=roleOf('命宫');
    const mgS=(mg&&mg.majorStars||[]);
    const mgStars=mgS.map(s=>s.name+(s.brightness?('（'+s.brightness+'）'):'')).join('、')||'空宫';
    const mgHz=(mg?(mg.heavenlyStem+mg.earthlyBranch):'');
    // 命宫落本命哪个宫位 + 人事方向
    let mgLuo='';
    if(mg&&mg.name&&mg.name!=='命宫'){ const pm2=palMeanOf(mg.name); mgLuo=`，落本命${mg.name}宫位，主${pm2||mg.name}`; }
    let nat='', care='';
    // 命宫或对宫（迁移）主星自然属性；命宫空宫时借对宫主星断本性/事业（与本站空宫借星惯例一致，避免空宫白板）
    if(mgS.length){ nat=mgS.map(s=>starNature(s.name)).filter(Boolean).join('、'); care=mgS.map(s=>starCar(s.name)).filter(Boolean).join('、'); }
    else {
      const opp=ZW_CHONG[mg?mg.earthlyBranch:''];
      const oppP=opp?as.palaces.find(x=>x.earthlyBranch===opp):null;
      const oppS=oppP?(oppP.majorStars||[]):[];
      if(oppS.length){
        const n2=oppS.map(s=>starNature(s.name)).filter(Boolean).join('、'), c2=oppS.map(s=>starCar(s.name)).filter(Boolean).join('、');
        if(n2) nat='借对宫：'+n2; if(c2) care='借对宫：'+c2;
      }
    }
    let rows=[]; // 表格行：{k,v}
    if(school==='sanhe'){
      const SAN3=['命宫','财帛','官禄','迁移'];
      // 三方四正逐宫针对性解读（每宫一行，去缩进）
      const sanLine=SAN3.map(role=>{const p=roleOf(role);return zwSanRead(role, p&&p.majorStars||[], school);}).join('<br>');
      const sanStars=SAN3.reduce((acc,role)=>{const p=roleOf(role);(p&&p.majorStars||[]).forEach(s=>acc.push(s));return acc;},[]);
      const strong=sanStars.filter(s=>s.brightness==='庙'||s.brightness==='旺'||s.brightness==='得');
      const weak=sanStars.filter(s=>s.brightness==='陷'||s.brightness==='不');
      const nm=sanStars.map(s=>s.name);
      let ge='';
      if(nm.includes('紫微')&&nm.includes('天府')) ge='紫府同垣，贵显格局，此层利于掌权守成';
      else if(nm.includes('杀')&&nm.includes('破')&&nm.includes('贪')) ge='杀破狼动格，此层宜变求新、动中得机';
      else if(strong.length>=3) ge='三会吉星庙旺，此层气势顺遂';
      else if(weak.length>=2) ge='三方多陷弱，此层宜守不宜进';
      rows=[['命宫',''+mgHz+' '+mgStars+mgLuo],['本性',nat||'—'],['事业',care||'—'],['三方四正',''+sanLine],['格局',ge||'凭该宫星曜旺陷断此层吉凶']];
    } else {
      const meanMap={禄:'得助生发之机',权:'掌权立事、责任加重',科:'声名清雅、和顺得名',忌:'缠扰耗力、宜静守防反复'};
      const order=['禄','权','科','忌'];
      const quans=order.map((m,i)=>{
        const star=(o.mutagen||[])[i]; if(!star) return '';
        const p=as.palaces.find(x=>(x.majorStars||[]).concat(x.minorStars||[]).some(s=>s.name===star));
        if(!p) return '';
        const dir=palMeanOf(p.name);
        return `化${m}${star}入${p.name}${dir?'（'+dir+'）':''}：${meanMap[m]}`;
      }).filter(Boolean);
      const jiArr=[];
      const jstar=(o.mutagen||[])[3];
      let chongNote='';
      if(jstar){
        const jp=as.palaces.find(x=>(x.majorStars||[]).concat(x.minorStars||[]).some(s=>s.name===jstar));
        if(jp){
          const d=palMeanOf(jp.name);
          jiArr.push(`化忌${jstar}入${jp.name}${d?'（'+d+'）':''}，该宫人事宜守勿冒进`);
          // 化忌冲对宫（应期提示）：化忌星落宫的对宫地支
          const oppBr=ZW_CHONG[jp.earthlyBranch];
          if(oppBr){ const oppP=as.palaces.find(x=>x.earthlyBranch===oppBr); if(oppP) chongNote=`，化忌${jstar}冲对宫${oppP.name}`; }
        }
      }
      // 三方四正（四化派也参考，综合断该层吉凶）：与三合分支同款分段、无缩进
      const SAN3=['命宫','财帛','官禄','迁移'];
      const sanLine=SAN3.map(role=>{const p=roleOf(role);return zwSanRead(role, p&&p.majorStars||[], school);}).join('<br>');
      rows=[['命宫',''+mgHz+' '+mgStars+mgLuo],['本性',nat||'—'],['事业',care||'—'],['三方四正',''+sanLine],['四化',quans.join('<br>')||'无大忌直冲'],['重点',jiArr.length?(jiArr.join('<br>')+chongNote):'该层四化无大忌直冲，相对平稳']];
    }
    return {name, gz:gzOf(o), rows};
  };
  // 组表：每层一格表格（流年/流月/流日 3 表）
  const tblFor=d=>{
    if(!d) return `<table class="zp-yun-tbl"><caption>${d?d.name:'—'}</caption><tbody><tr><td>—</td><td>暂不可用</td></tr></tbody></table>`;
    return `<table class="zp-yun-tbl"><caption>${d.name}（${d.gz}）</caption><tbody>
      ${d.rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}
    </tbody></table>`;
  };
  const dayunT=tblFor(levelData('大运',h.decadal));
  const yearT=tblFor(levelData('流年',h.yearly));
  const monthT=tblFor(levelData('流月',h.monthly));
  const dayT=tblFor(levelData('流日',h.daily));
  return `<div class="zp-yun-grid y2">${dayunT}${yearT}${monthT}${dayT}</div>`;
}
/* 大运/流年/流月/流日 日期选择器：选日期 → 输出该日四层运势（默认当前日期），按派别区分 */
function yunFilter(astro, sex, dayunHtml, school){
  const today=(function(){ try{ return new Date().toISOString().slice(0,10); }catch(e){ return ''; } })();
  const dateVal=today;
  const init=zwDateCalc(astro, dateVal, school);
  return `<h3 class="rel-title">运程推演</h3>
    <div class="yf-picker">
      <label>查询日期</label>
      <input type="date" id="zwYunDate" value="${dateVal||today}">
      <button type="button" id="zwYunBtn" class="btn gold">推算</button>
      <span class="yf-hint">按所选日期推算该日所在大运及流年、流月、流日。</span>
    </div>
    <div class="info-box zp-yunout" id="zwYunOut">${init}</div>`;
}

/* 宫干四化（飞星）：以本命宫干化出的禄权科忌，看各飞落何宫，断人事往来（四化派深化断语） */
function zwFeiXing(astro){
  const brIdx={}; astro.palaces.forEach(p=>brIdx[p.earthlyBranch]=p);
  const starPal={}; astro.palaces.forEach(p=>{(p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>{ if(!starPal[s.name]) starPal[s.name]=p.name; });});
  const meanMap={禄:'该宫得助、有生发将成之机',权:'该宫掌权立事、责任加重',科:'该宫声名清雅、和顺得名',忌:'该宫缠扰耗力、宜静守防反复'};
  const ganOrder=['禄','权','科','忌'];
  // 取命宫、财帛、官禄、迁移、夫妻、福德 六宫宫干四化（重点宫飞星）
  const focus=['命宫','财帛','官禄','迁移','夫妻','福德'];
  const rows=focus.map(rn=>{
    const p=astro.palaces.find(x=>x.name===rn); if(!p) return null;
    const gan=ZW_GAN_HUA[p.heavenlyStem]; if(!gan) return null;
    const hua=ganOrder.map((m,i)=>({m, star:gan[i]}));
    const fly=hua.map(h=>{ const fp=starPal[h.star]; return {m:h.m, star:h.star, to:fp||'飞失'}; });
    return {from:rn+' '+p.heavenlyStem+p.earthlyBranch, fly};
  }).filter(Boolean);
  // 找化忌落宫最重的（忌冲提示）
  const jiArr=[]; rows.forEach(r=>r.fly.forEach(f=>{ if(f.m==='忌'&&f.to!=='飞失') jiArr.push(`${r.from.replace(/\s.*/,'')}化忌${f.star}入${f.to}`); }));
  const tblRows=rows.map(r=>`<tr><td class="lbl">${r.from}</td><td class="lqk">${r.fly.map(f=>f.m==='忌'?'':`化${f.m}${f.star}入${f.to==='飞失'?'外宫':f.to}`).filter(Boolean).join('、')||'—'}</td><td>${(r.fly.find(f=>f.m==='忌')&&r.fly.find(f=>f.m==='忌').to!=='飞失')?('化忌'+( r.fly.find(f=>f.m==='忌').star)+'入'+(r.fly.find(f=>f.m==='忌').to)):'飞失'}${meanMap.忌?('，'+meanMap.忌):''}</td></tr>`).join('');
  const tbl=`<div class="zp-yunout"><table class="zp-yun-tbl"><thead><tr><th>宫干</th><th>禄权科</th><th>化忌</th></tr></thead><tbody>${tblRows}</tbody></table></div>`;

  return `<h3 class="rel-title">宫干四化（飞星 四化派）</h3>${tbl}${jiNote}`;
}

/* 来因宫（北派飞星）：用 iztro 原生 isOriginalPalace（与 zwds 口径一致），辅以生年干所在宫双验证；来因宫为能量最活跃之宫，决定一生重点与因果 */

/* 自化（北派飞星）：用宫干对该宫星曜做四化，命中者即"自化"；结合生年四化分向心/离心（向心=先有后无收敛、离心=先无后有发散）。依 ziwei-dou-shu 北派理论 */
function zwZiHua(astro){
  const GAN_4={甲:['廉贞','破军','武曲','太阳'],乙:['天机','天梁','紫微','太阴'],丙:['天同','天机','文昌','廉贞'],丁:['太阴','天同','天机','巨门'],戊:['贪狼','太阴','左辅','天机'],己:['武曲','贪狼','天梁','文曲'],庚:['太阳','武曲','太阴','天同'],辛:['巨门','太阳','文昌','天同'],壬:['天梁','紫微','左辅','武曲'],癸:['破军','巨门','太阴','贪狼']};
  const mean={禄:'得助生发、将成之机',权:'掌权立事、责任加重',科:'声名清雅、和顺得名',忌:'缠扰耗力、宜静守防反复'};
  const rows=[];
  astro.palaces.forEach(p=>{
    const stars4=GAN_4[p.heavenlyStem]; if(!stars4) return;
    const at=[]; // 本宫星曜集合（含主星辅星）
    (p.majorStars||[]).concat(p.minorStars||[]).forEach(s=>at.push(s));
    ['禄','权','科','忌'].forEach((k,i)=>{
      const nm=stars4[i]; if(!nm) return;
      const star=at.find(s=>s.name===nm); if(!star) return;
      const isShengNian=!!star.mutagen; // 生年四化星则自化为向心（先有后无），否则为离心（先无后有）
      const dir=isShengNian?'向心':'离心';
      rows.push({pal:p.name, star:nm, k, dir, sheng:isShengNian, mean:mean[k]});
    });
  });
  if(!rows.length) return '';
  rows.sort((a,b)=>{ const o={禄:0,权:1,科:2,忌:3}; return o[a.k]-o[b.k]; });
  const tblRows=rows.map(r=>`<tr><td class="lbl">${r.pal}</td><td>${r.star} 化${r.k}</td><td>${r.dir}${r.sheng?' 生年四化星':''}</td><td>${r.mean}</td></tr>`).join('');
  const lint=rows.filter(r=>r.k==='忌').map(r=>`${r.pal}宫${r.star}化忌${r.dir}，逢忌之宫人事宜守防反复`).join('、');
  const note=lint?`<p class="sub-note">${lint}。</p>`:`<p class="sub-note">本局自化无化忌直冲重宫，飞星流转相对平稳。</p>`;
  return `<h3 class="rel-title">自化（北派飞星）</h3>
    <div class="info-box zp-ding"><div class="zp-yunout"><table class="zp-yun-tbl"><thead><tr><th>宫位</th><th>自化</th><th>向心 离心</th><th>吉凶</th></tr></thead><tbody>${tblRows}</tbody></table></div>${note}</div>`;
}
/* 流年叠大限（北派飞星）：大限四化为十年气运之体，流年四化逐年引动；当流年所化星与大限所化星为同星，则该题材之年为应期强引动。 */
function zwLiuYunDie(astro){

  const dec=h.decadal, yr=h.yearly;
  const decSihua=order.map((k,i)=>{const st=(dec.mutagen||[])[i]; return st?{k,star:st,pal:starPal[st]||'飞失'}:null;}).filter(Boolean);
  const yrSihua=order.map((k,i)=>{const st=(yr.mutagen||[])[i]; return st?{k,star:st,pal:starPal[st]||'飞失'}:null;}).filter(Boolean);
  if(!decSihua.length) return '';

  const rows=decSihua.map(x=>{

  }).join('');
  const hitCount=decSihua.filter(x=>yrStars.has(x.star)).length;
  const concl=hitCount?`<p class="sub-note">${yr.heavenlyStem}${yr.earthlyBranch}年流年四化与大限四化有 ${hitCount} 星同向，${hitCount>=2?'多重引动、':'此题材'}应为今年运势最强之应期线索。</p>`:'<p class="sub-note">今年流年四化未与大限四化同星，大限气运以流年宫位引动、应期偏缓。</p>';

}

/* 宫位×主星针对性解读：把"某宫 + 星曜 + 亮度"转成语义明确的吉凶白话（供三方四正/详断/流年表格复用） */
function zwSanRead(role, stars, school){
  if(!stars||!stars.length) return (role==='命宫'?'其宫无主星，凭三方及对宫借星参断，力量借位而显':'空宫无主星，借对宫与命宫冲照之力断此宫人事');
  const parts=stars.map(s=>{
    const bri=s.brightness||'平';
    const m=ZW_STAR_MEAN[s.name]||[];
    const nature=m[0]?m[0].split('，')[0]:s.name;
    // 亮度吉凶：庙旺得 = 得力；利平 = 平顺；陷不 = 力弱
    let briTxt='';
    if(bri==='庙'||bri==='旺') briTxt='得地得力，气势旺盛';
    else if(bri==='得'||bri==='利') briTxt='得其位，力量平顺可恃';
    else if(bri==='陷') briTxt='落陷失势，力弱需防';
    else if(bri==='不') briTxt='不得地，力道平常';
    else briTxt='亮度平常，吉凶参半';
    // 事业/本性方向（第二义为纯职业清单，"宜"在句首统一）
    const dir=m[1]?('，宜'+m[1].split('，')[0]):'';
    return `${s.name}${briTxt}${dir}`;
  });
  const palMean=(ZIWEI_PAL_MEAN.find(r=>r[0]===role)||[])[1]||'';
  // 吉凶倾向
  const strong=stars.filter(s=>s.brightness==='庙'||s.brightness==='旺'||s.brightness==='得');
  const weak=stars.filter(s=>s.brightness==='陷'||s.brightness==='不');
  let judge='';
  if(strong.length&&!weak.length) judge='该宫主星庙旺有力，';
  else if(weak.length&&!strong.length) judge='该宫主星落陷，';
  else judge='该宫主星旺弱参半，';
  const palHead=role+'（'+palMean+'）';
  return `${palHead}${judge}${parts.join('；')}。`;
}

  {

/* 真太阳时校正（精简版，与八字页 bazi-data.trueSolarTime 同算法；无 lunar 依赖，跨日用 Date 处理） */
function zwTrueSolar(y,m,d,h,mi,lng){
  const leapDay=yy=>(yy%4===0&&yy%100!==0)||yy%400===0;
  const dpm=[0,31,leapDay(y)?29:28,31,30,31,30,31,31,30,31,30,31];
  let doy=d; for(let mo=1;mo<m;mo++) doy+=dpm[mo];
  const g=2*Math.PI/365.24*(doy-1);
  const E=229.18*(0.000075+0.001868*Math.cos(g)-0.032077*Math.sin(g)-0.014615*Math.cos(2*g)-0.040849*Math.sin(2*g));
  const lngAdj=(lng-120)*4, total=E+lngAdj;
  let mins=h*60+mi+total, dayOff=0;
  while(mins>=1440){ mins-=1440; dayOff++; } while(mins<0){ mins+=1440; dayOff--; }
  let hh=Math.floor(mins/60), mm=Math.round(mins-hh*60);
  if(mm>=60){ mm-=60; hh++; } if(hh>=24){ hh-=24; dayOff++; }
  let dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+dayOff);
  return {y:dt.getFullYear(), m:dt.getMonth()+1, d:dt.getDate(), h:hh, mi:mm, E:Math.round(E*100)/100, lngAdj:Math.round(lngAdj*100)/100, totalAdj:Math.round(total*100)/100};
}

/* ===== 紫微盘交互：悬停/点击宫 → 本宫加深 + 三方四正关联宫变色；中宫画布以 12 个边界点折线连接 4 宫（参照 iztro Line 4 段折线穿过中宫） ===== */
function zwDrawLinks(focusName){
  const board=document.querySelector('.zw-board'); if(!board) return;
  const canvas=board.querySelector('.zw-links'); if(!canvas) return;
  const focus=focusName||'命宫';
  const palEl=board.querySelector(`.zw-pal[data-name="${focus}"]`);
  // 兜底 rect.width=0（jsdom 或 display:none 时）：用 board 尺寸做参考
  let rect=canvas.getBoundingClientRect();
  if(!rect.width || !rect.height){
    const br=board.getBoundingClientRect();
    rect={width:br.width||780, height:br.height||780};
  }
  const W=Math.max(rect.width,1), H=Math.max(rect.height,1);
  // 1 像素 = 1 设备像素，避免 HiDPI 上 stroke 模糊
  const dpr=window.devicePixelRatio||1;
  if(canvas.width!==W*dpr || canvas.height!==H*dpr){
    canvas.width=W*dpr; canvas.height=H*dpr;
  }
  const ctx=canvas.getContext('2d'); if(!ctx) return;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  if(!palEl) return;
  // 中宫 DOM 实际矩形（含 padding/gap 后才是真实中宫边界），换算成画布像素
  const cen=board.querySelector('.zw-center');
  const cenRect=cen?cen.getBoundingClientRect():null;
  const brRect=board.getBoundingClientRect();
  let x0,x1,y0,y1;
  if(cenRect&&cenRect.width&&brRect.width){
    // center 相对 board 的位移比例 → 乘 W/H 得画布像素
    x0=((cenRect.left-brRect.left)/brRect.width)*W;
    x1=((cenRect.right-brRect.left)/brRect.width)*W;
    y0=((cenRect.top-brRect.top)/brRect.height)*H;
    y1=((cenRect.bottom-brRect.top)/brRect.height)*H;
  }else{ // 兜底：中宫约占整盘 0.25~0.75，内缩到 0.27~0.73 保证线不出宫
    x0=W*0.27; x1=W*0.73; y0=H*0.27; y1=H*0.73;
  }
  // 12 宫锚点由各宫 grid 列行（POS）直接推导：row1→上边(y0)、row4→下边(y1)、col1→左边(x0)、col4→右边(x1)。
  const INSET=0;   // 锚点从中宫边框内移，留出与边框的间隙（不压边框线）
    /* 锚点 = 中宫中心与相关宫中心连线、同中宫边框的交点（方向准确指向宫位，且必在边框上） */
  const cenPt=[(x0+x1)/2, (y0+y1)/2];
  const anchorOf=(palName)=>{
    const el=board.querySelector('.zw-pal[data-name="'+palName+'"]');
    if(!el) return null;
    const r=el.getBoundingClientRect();
    const px=((r.left+r.width/2-brRect.left)/brRect.width)*W;
    const py=((r.top+r.height/2-brRect.top)/brRect.height)*H;
    /* 射线 cenPt→(px,py) 与中宫矩形求交 */
    let t=Infinity;
    if(px>cenPt[0]+0.01) t=Math.min(t,(x1-cenPt[0])/(px-cenPt[0]));
    if(px<cenPt[0]-0.01) t=Math.min(t,(x0-cenPt[0])/(px-cenPt[0]));
    if(py>cenPt[1]+0.01) t=Math.min(t,(y1-cenPt[1])/(py-cenPt[1]));
    if(py<cenPt[1]-0.01) t=Math.min(t,(y0-cenPt[1])/(py-cenPt[1]));
    if(!isFinite(t)) return null;
    const tt=Math.max(0, t-2/Math.max(Math.abs(px-cenPt[0]),Math.abs(py-cenPt[1]),1));  /* 内收 2px，抵消线宽溢出 */
    return [cenPt[0]+(px-cenPt[0])*tt, cenPt[1]+(py-cenPt[1])*tt];
  };
  const oppOf={'子':'午','午':'子','丑':'未','未':'丑','寅':'申','申':'寅','卯':'酉','酉':'卯','辰':'戌','戌':'辰','巳':'亥','亥':'巳'};
  const triOf={'子':['辰','申'],'丑':['巳','酉'],'寅':['午','戌'],'卯':['未','亥'],'辰':['申','子'],'巳':['酉','丑'],'午':['戌','寅'],'未':['亥','卯'],'申':['子','辰'],'酉':['丑','巳'],'戌':['寅','午'],'亥':['卯','未']};
  const focusBr=palEl.dataset.br;
  const oppName=(()=>{ const el=board.querySelector('.zw-pal[data-br="'+oppOf[focusBr]+'"]'); return el?el.dataset.name:null; })();
  const triNames=triOf[focusBr].map(bb=>{ const el=board.querySelector('.zw-pal[data-br="'+bb+'"]'); return el?el.dataset.name:null; }).filter(Boolean);
  const focusA=anchorOf(focus);
  const oppA=oppName?anchorOf(oppName):null;
  const triA=triNames.map(nm=>anchorOf(nm)).filter(Boolean);
  ctx.strokeStyle=getComputedStyle(board).getPropertyValue('--zw').trim()||'#5a3a7e';
  ctx.globalAlpha=.55;
  ctx.lineWidth=1;
  ctx.lineJoin='round';
  ctx.lineCap='round';
  ctx.beginPath();
  if(focusA) ctx.moveTo(focusA[0], focusA[1]);
  if(triA[0]) ctx.lineTo(triA[0][0], triA[0][1]);
  if(triA[1]) ctx.lineTo(triA[1][0], triA[1][1]);
  if(focusA) ctx.closePath();
  ctx.stroke();
  if(oppA && focusA){
    ctx.beginPath();
    ctx.moveTo(focusA[0], focusA[1]);
    ctx.lineTo(oppA[0], oppA[1]);
    ctx.stroke();
  }
  const sanNames=palEl?(palEl.dataset.san||focus).split(','):[focus];
  const sanSet=new Set(sanNames);
  board.querySelectorAll('.zw-pal').forEach(el=>{
    const nm=el.dataset.name;
    el.classList.toggle('zw-focused', nm===focus);
    el.classList.toggle('zw-rel', sanSet.has(nm)&&nm!==focus);
  });
}
