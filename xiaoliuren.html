/* 六宫颜色与谋事主数（传统小六壬属性） */
const GONG_COLOR={'大安':'青','留连':'黑','速喜':'红','赤口':'白','小吉':'绿','空亡':'灰'};

/* 五行生克（小六壬页局部表，供合参合断的三宫五行关系分析） */
const WX_SH={'木':'火','火':'土','土':'金','金':'水','水':'木'};
const WX_KE={'木':'土','火':'金','土':'水','金':'木','水':'火'};
function wxShengKe(a,b){ /* 五行关系：比和/相生/被生/相克/被克 */
  if(a===b) return '比和';
  if(WX_SH[a]===b) return '相生';
  if(WX_SH[b]===a) return '被生';
  if(WX_KE[a]===b) return '相克';
  if(WX_KE[b]===a) return '被克';
  return '';
}
function wxRelDesc(a,b,role){
  const r=wxShengKe(a,b);
  const as=wxColorSpan(a), bs=wxColorSpan(b);
  if(r==='比和') return `${role}：${as}与${bs}比和，事体平稳`;
  if(r==='相生') return `${role}：${as}生${bs}，事机顺延`;
  if(r==='被生') return `${role}：${bs}生${as}，气得滋养`;
  if(r==='相克') return `${role}：${as}克${bs}，事有阻滞`;
  if(r==='被克') return `${role}：${bs}克${as}，事受制约`;
  return '';
}

// 起卦方式切换：时间 / 数字 / 随机 / 汉字笔画
function switchQiMode(){
  const mode=document.getElementById('qiMode').value;
  const showTime = mode==='time';
  const showNum = mode==='num';
  const showRand = mode==='rand';
  const showChar = mode==='char';
  ['fDate','fShi'].forEach(id=>document.getElementById(id).style.display = showTime?'':'none');
  ['fNum1','fNum2','fNum3'].forEach(id=>document.getElementById(id).style.display = showNum?'':'none');
  document.getElementById('fChar').style.display = showChar?'':'none';
  // 汉字模式：清空预填值并确保可编辑（防被日期选择器预填/只读）
  if(showChar){
    const qc=document.getElementById('qChar');
    qc.value='';
    qc.readOnly=false;
    qc.classList.remove('dt-input');
  }
  // 随机数：自动填入随机数
  if(showRand){
    document.getElementById('qNum1').value = Math.floor(Math.random()*6)+1;
    document.getElementById('qNum2').value = Math.floor(Math.random()*6)+1;
    document.getElementById('qNum3').value = Math.floor(Math.random()*6)+1;
    ['fNum1','fNum2','fNum3'].forEach(id=>document.getElementById(id).style.display='');
  }
}
switchQiMode();
function setNow(){
  const n=new Date();
  document.getElementById('dInput').value=`${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())}`;
  let h=n.getHours(); let idx=Math.floor(((h+1)%24)/2);
  document.getElementById('shichen').value=idx;
  query();
}
let LAST=null;
/* 折叠态属交互态：页体折叠块的开合由本页记忆，键按页独立，localStorage 主存、sessionStorage 隐私兜底 */
function xlrReadFold(){
  try{
    let raw=localStorage.getItem('xlrFoldState');
    if(!raw) raw=sessionStorage.getItem('xlrFoldState');
    const o=JSON.parse(raw||'{}');
    return (o&&typeof o==='object')?o:{};
  }catch(e){ return {}; }
}
function xlrSaveFold(){
  try{
    /* 以已存为底、只覆盖此刻在场的件：复位本身会触发 toggle 回调本函数，
       整份重写会把此刻未渲染的件的键一并抹掉，下次刷新读不回来 */
    const o=xlrReadFold();
    document.querySelectorAll('details[id]').forEach(d=>{ o[d.id]=d.open; });
    const v=JSON.stringify(o);
    try{ localStorage.setItem('xlrFoldState', v); }catch(e){}
    try{ sessionStorage.setItem('xlrFoldState', v); }catch(e){}
  }catch(e){}
}
function xlrApplyFold(){
  const o=xlrReadFold();
  document.querySelectorAll('details[id]').forEach(d=>{ if(d.id in o) d.open=!!o[d.id]; });
}
document.addEventListener('toggle',function(e){
  const t=e.target;
  if(t && t.tagName==='DETAILS' && t.id) xlrSaveFold();
},true);
function renderRef(){
  // 掌诀指图：三指（食/中/无名）六节，指尖排上、指根排下；每节一张白卡，复用大六壬四课/三传同款样式（lr-ke）
  const COLS=[
    {finger:'食指', cells:[{g:1,seg:'指尖'},{g:0,seg:'指根'}]},
    {finger:'中指', cells:[{g:2,seg:'指尖'},{g:5,seg:'指根'}]},
    {finger:'无名指', cells:[{g:3,seg:'指尖'},{g:4,seg:'指根'}]}
  ];
  let palm='<div class="xlr-palm" role="img" aria-label="小六壬掌诀图"><div class="xlr-palm-fingers">';
  COLS.forEach(col=>{
    palm+='<div class="xlr-palm-col"><div class="xlr-palm-finger">'+col.finger+'</div>';
      col.cells.forEach(c=>{ const g=GONG[c.g]; const luckCls='luck-'+g.luck;
        palm+='<div class="xlr-palm-cell"><div class="xlr-palm-num">'+(c.g+1)+'</div>'
          +'<div class="xlr-palm-nm '+luckCls+'">'+g.n+'</div>'
          +'<div class="xlr-palm-seg">'+c.seg+'</div></div>';
      });
    palm+='</div>';
  });
  palm+='</div><div class="xlr-palm-cap">大安起 1，顺数至 6 循环</div></div>';
  const rows=GONG.map((g,i)=>{
    const wxNote=g.n==='留连'?'<br><small class="xlr-alt-note">水土两说</small>':(g.n==='小吉'?'<br><small class="xlr-alt-note">木水两说</small>':'');
    const sxNote=g.n==='留连'?'<br><small class="xlr-alt-note">亦作腾蛇</small>':'';
    const numNote=g.n==='空亡'?'<br><small class="xlr-alt-note">亦作1、5、7</small>':'';
    return '<tr><td class="luck-'+g.luck+'">'+g.n+'</td><td>'+(i+1)+'</td><td>'+wxColorSpan(g.wx)+wxNote+'</td><td>'+g.sx+sxNote+'</td><td>'+g.fx+'</td><td>'+GONG_COLOR[g.n]+'</td><td>'+GONG_NUM[g.n]+numNote+'</td><td>'+g.ying+'</td><td>'+g.xiang+'</td></tr>';
  }).join('');
  document.getElementById('xlrRef').innerHTML=
    '<details class="mh-ref" id="xlrFold" open><summary>掌诀指图 六宫总览</summary>'+
    '<div class="xlr-ref-grid"><div class="xlr-palm-wrap">'+palm+'</div>'+
    '<div class="xlr-table-wrap"><table class="xlr-table xlr-hecan-tbl"><thead><tr><th>宫</th><th>序</th><th>五行</th><th>六神</th><th>方位</th><th>颜色</th><th>主数</th><th>应期</th><th>意象</th></tr></thead><tbody>'+rows+'</tbody></table>'+
    '</div></details>';
}
function query(){
 try{
  const mode=document.getElementById('qiMode').value;
  let lm, ld, shi, lunarStr, lunar=null, shiIdx=0, srcNote, rawM, rawD, rawS;
  if(mode==='time'){
    const v=document.getElementById('dInput').value; if(!v)return;
    shiIdx=parseInt(document.getElementById('shichen').value,10);
    const [y,m,d]=v.split('-').map(Number);
    const solar=Solar.fromYmd(y,m,d); lunar=solar.getLunar();
    rawM=Math.abs(lunar.getMonth()); rawD=lunar.getDay(); rawS=shiIdx+1;
    lm=rawM; ld=rawD; shi=rawS;
    lunarStr=`农历 ${lunar.getYearInChinese()}年${lunar.getMonthInChinese()}月${lunar.getDayInChinese()}　${ZHI[shiIdx]}时`;
    srcNote=`（月${lm}日${ld}时${shi}）`;
  } else {
    // 变通取数：数字/随机/汉字笔画 → 三数代月/日/时
    let n1,n2,n3;
    if(mode==='num'||mode==='rand'){
      n1=parseInt(document.getElementById('qNum1').value,10)||1;
      n2=parseInt(document.getElementById('qNum2').value,10)||1;
      n3=parseInt(document.getElementById('qNum3').value,10)||1;
      srcNote=`（变通取数 月${n1}日${n2}时${n3}）`;
    } else { // char 汉字笔画
      const s=(document.getElementById('qChar').value||'').trim();
      if(!s) return;
      const chars=[...s];
      if(chars.length===1){ n1=n2=n3=chars.map(hanziStrokes)[0]; }
      else if(chars.length===2){ n1=hanziStrokes(chars[0]); n2=hanziStrokes(chars[1]); n3=n1+n2; }
      else { n1=hanziStrokes(chars[0]); n2=hanziStrokes(chars[1]); n3=hanziStrokes(chars[2]); }
      srcNote=chars.length===1?`（汉字笔画 ${s}为${n1}画，三数同取${n1}）`:`（汉字笔画 ${chars.join('、')} → ${n1}/${n2}/${n3}）`;
    }
    rawM=n1; rawD=n2; rawS=n3;
    // 取数需先转为 1-6（÷6 余数，0 记 6）
    const to6=n=>{ const r=n%6; return r===0?6:r; };
    lm=to6(n1); ld=to6(n2); shi=to6(n3);
    lunarStr=mode==='char'?`汉字笔画起课：${(document.getElementById('qChar').value||'').trim()}`:`变通取数起课`;
    lunar=lunar||null;
  }
  document.getElementById('lunarLine').textContent = lunarStr+srcNote;
  // 起课：按所选流派掌诀，月/日/时起宫偏移不同 → 落宫不同（排盘不同）
  const sch=SCHOOLS.find(s=>s.id===document.getElementById('school').value)||SCHOOLS[0];
  const gMonth=(sch.m0+(lm-1))%6;
  const gDay=((sch.m0)+(lm-1)+(ld-1)+sch.d0)%6;
  const gTime=((sch.m0)+(lm-1)+(ld-1)+sch.d0+(shi-1)+sch.t0)%6;
  // 占事盘：时宫基础上再叠“时辰序”顺行。时间模式取地支序 shiIdx；
  // 数字/汉字/随机模式无地支时辰，以第三原始数 rawS 顺行；若结果与时宫重合则再顺移一格，确保占事盘独立。
  let gFour=null;
  if(sch.four){
    const fourExtra=(mode==='time')?shiIdx:rawS;
    gFour=((sch.m0)+(lm-1)+(ld-1)+(shi-1)+fourExtra)%6;
    if(mode!=='time'&&gFour===gTime) gFour=(gFour+1)%6;
  }
  LAST={lm,ld,shi,shiIdx,gMonth,gDay,gTime,gFour,schId:sch.id,mode,
    lunarStr: lunar?`${lunar.getMonthInChinese()}月${lunar.getDayInChinese()} ${ZHI[shiIdx]}时`:lunarStr};
  const stages=[['月宫',gMonth],['日宫',gDay],['时宫（结果）',gTime]];
  let flow=stages.map((s,i)=>{
    const g=GONG[s[1]];
    return `<div class="xlr-step ${i===2?'final':''}">
      <div class="xlr-step-lbl">${s[0]}</div>
      <div class="xlr-gong luck-${g.luck}">
        <div class="xlr-name">${g.n}</div>
        <div class="xlr-meta">${g.sx}　${wxColorSpan(g.wx)}　${g.fx}　<b class="luck-${g.luck}">${g.luck}</b></div>
      </div>
    </div>${i<2?'<div class="xlr-arrow">→</div>':''}`;
  }).join('');
  if(gFour!==null){ flow+=`<div class="xlr-arrow">→</div><div class="xlr-step"><div class="xlr-step-lbl">占事盘</div><div class="xlr-gong luck-${GONG[gFour].luck}"><div class="xlr-name">${GONG[gFour].n}</div><div class="xlr-meta">${GONG[gFour].sx}　${GONG[gFour].luck}</div></div></div>`; }
  const fg=GONG[gTime];
  // 合参合断（三宫合参 + 两宫合断 + 五行生克 + 数理刚柔 合一表）
  const lk=[GONG[gMonth].luck,GONG[gDay].luck,GONG[gTime].luck];
  let hecan;
  if(lk.every(l=>l==='吉')) hecan='三宫皆吉，诸事顺遂，大吉之象。';
  else if(lk.every(l=>l==='凶')) hecan='三宫皆凶，事多阻滞，宜守勿动。';
  else if(GONG[gTime].luck==='吉') hecan='时宫独吉，结局可成，纵中途有阻终得善果。';
  else hecan='时宫独凶，结局受阻，宜缓图改期。';
  const riG=GONG[gDay].n, shiG=GONG[gTime].n;
  const heTxt=(HE_RI[riG]&&HE_RI[riG][shiG])?HE_RI[riG][shiG]:(riG===shiG?'日时同宫，无两宫组合之断，以时宫单宫吉凶为准。':'本组合无传世断语，以时宫单宫吉凶为准。');
  // 五行生克：三宫五行两两关系
  const wMon=GONG[gMonth].wx, wDay=GONG[gDay].wx, wTime=GONG[gTime].wx;
  const wxSegs=[];
  wxSegs.push(wxRelDesc(wMon,wDay,'月→日')+'；');
  wxSegs.push(wxRelDesc(wDay,wTime,'日→时'));
  // 数理刚柔：原始三数和奇偶
  const rawSum=(rawM||0)+(rawD||0)+(rawS||0);
  const gangRou=rawSum%2===0?'偶数（柔），事体缓、宜静观待变':'奇数（刚），事体急、宜主动进取';
  const hecanRows=[
    ['三宫合参', hecan],
    ['两宫合断', heTxt],
    ['五行生克', wxSegs.join('')],
    ['数理刚柔', `三数之和 ${rawSum}，为${gangRou}`],
    ['断语', fg.duan+'（六宫通行断语，各派共用）'],
    ['白话提要', fg.brief]
  ];
  const hecanHtml='<h3 class="rel-title">合参合断</h3><table class="xlr-table xlr-hecan-tbl"><tbody>'+hecanRows.map(r=>`<tr><th>${r[0]}</th><td class="xlr-hecan-td">${r[1]}</td></tr>`).join('')+'</tbody></table>';
  // 占类专项断：表格化（16 类，四列：类别/五行/关系/说明，五行生克单列显示）
  const CATS=[['婚姻','hun'],['求财','cai'],['疾病','bing'],['行人','ren'],['失物','shi'],['寻人','xun'],['生产','chan'],['官非','guan'],['出行','chu'],['谋事','mou'],['交易','jiao'],['学业','xue'],['求职','qiu'],['合伙','hehuo'],['家宅','jia'],['开张','kai']];
  const CAT_WX={'婚姻':'火','求财':'金','疾病':'土','行人':'水','失物':'土','寻人':'水','生产':'金','官非':'金','出行':'火','谋事':'火','交易':'金','学业':'火','求职':'金','合伙':'木','家宅':'土','开张':'金'};
  const wxRelTxt={'比和':'同气','相生':'得助','被生':'气散','相克':'受制','被克':'不顺'};
  const catsRows=CATS.map(([lb,k])=>{
    const cwx=CAT_WX[lb]||'';
    const rel=wxRelTxt[wxShengKe(fg.wx,cwx)]||'';
    const wxCls={'木':'wx-mu','火':'wx-huo','土':'wx-tu','金':'wx-jin','水':'wx-shui'}[cwx]||'';
    const lbCol=wxCls?'<span class="'+wxCls+'">'+lb+'</span>':lb;
    const wxCol=cwx?wxColorSpan(cwx):'';
    const relCol=rel?'<span class="xlr-rel-note">'+rel+'</span>':'';
    return '<tr><td>'+lbCol+'</td><td>'+wxCol+'</td><td>'+relCol+'</td><td class="xlr-hecan-td">'+fg.cats[k]+'</td></tr>';
  }).join('');
  let html=`<h3 class="rel-title">三宫掐指流转 ${sch.name}</h3>
  <div class="xlr-note">${sch.note}</div>

    <div class="xlr-flow">${flow}</div>
    <div class="today-card"><div class="today-top"><div class="xlr-result-host">
      <div class="xlr-result-name luck-${fg.luck}">${fg.n}　<span class="xlr-result-luck">（${fg.luck}）</span></div>
      <div class="zodiac">六神 ${fg.sx}　五行 ${wxColorSpan(fg.wx)}　方位 ${fg.fx}　应期 ${fg.ying}${sch.qiMen?'　奇门方位 '+(['东','东南','南','西南','西','西北','北','东北','东'][(gTime*45)%8]||'中'):''}</div>
    </div></div></div>
    ${hecanHtml}
    <div class="xlr-section"><h3 class="rel-title">占类专项断 ${fg.n}</h3>
      <table class="xlr-table xlr-hecan-tbl"><thead><tr><th>类别</th><th>五行</th><th>关系</th><th>说明</th></tr></thead><tbody>${catsRows}</tbody></table>
    </div>
    `;
  document.getElementById('out').innerHTML=html;
 }catch(e){ document.getElementById('out').innerHTML='<p class="notice">起课出错：'+(e.message||e)+'</p>'; }
}
setNow();
mountAI(function(){
  if(!LAST) return '';
  const fg=GONG[LAST.gTime];
  const sch=LAST.schId?SCHOOLS.find(s=>s.id===LAST.schId):null;
  const aiFour=(LAST.gFour!==null&&LAST.gFour!==undefined)?('\n占事盘：'+GONG[LAST.gFour].n+'（'+GONG[LAST.gFour].luck+'）'):'';
  const aiMath='\n起课数理（算法）：月'+LAST.lm+'、日'+LAST.ld+'、时'+LAST.shi+'（序号 1 大安 … 6 空亡循环）。月宫='+GONG[LAST.gMonth].n+'，日宫='+GONG[LAST.gDay].n+'，时宫='+fg.n+(LAST.gFour!==null&&LAST.gFour!==undefined?('，占事盘='+GONG[LAST.gFour].n):'')+'。';
  return `小六壬起课（${sch?sch.name:''}）\n农历：${LAST.lunarStr}（月${LAST.lm}日${LAST.ld}时${LAST.shi}）\n月宫：${GONG[LAST.gMonth].n}\n日宫：${GONG[LAST.gDay].n}\n时宫（结果）：${fg.n}（${fg.luck}）${aiFour}\n六神：${fg.sx}　五行：${fg.wx}　方位：${fg.fx}　主数：${GONG_NUM[fg.n]}　颜色：${GONG_COLOR[fg.n]}\n断语：${fg.duan}\n白话提要：${fg.brief}${aiMath}`;
}, '小六壬');
</script>
<script>
/* 盘面分享与数据：collect 记录起课方式、三数与流派，restore 回填后按原数重排（不另取随机） */
shareWait({ page:"xiaoliuren", title:"小六壬在线掐算",
  collect:function(){
    const d={m:document.getElementById('qiMode').value};
    ['dInput','shichen','qNum1','qNum2','qNum3','qChar','school'].forEach(function(id){ const el=document.getElementById(id); if(el) d[id]=el.value; });
    return d;
  },
  restore:function(d){
    if(!d||!d.m) return;
    Object.keys(d).forEach(function(k){
      if(k==='m') return;
      const el=document.getElementById(k); if(el) el.value=d[k];
    });
    const m=document.getElementById('qiMode'); if(m){ m.value=d.m; }
    try{ switchQiMode(); }catch(e){}
    try{ query(); }catch(e){}
  },
  /* 刷新重出：全站顶层机制回填输入后按此钩子起重课 */
  recast:function(){ try{ query(); }catch(e){} }
});
</script>
