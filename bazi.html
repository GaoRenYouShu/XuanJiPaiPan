<script>
/* ================= 岁运清洗：剔除含大运/流年/流月/流日 的应期句 ================= */
const YUN_JI=/大运|流年|流月|流日/;
function cleanS(s){ return s.trim().replace(/[\n\r]+/g,' '); }
/* ================= 口径统一（共享函数：四模块强制同源） ================= */
/* 五行能量档走 bazi-rel.js 的 wxTier 单点（真缺 / 平和而势弱 / 平和 / 偏旺 / 过旺），
 * 与量化四柱、婚姻④、合婚五行互补同一阈值，本页不另存一份实现。 */
function tierOf(eS, wx){ return wxTier(eS, wx); }
/* 十神类能量档位（铁律：禁数个数，必须 ssTenGodEnergy(BZ,eScore) 十神级聚合）。
 * 类能量占比分档，阈值读源站 REL.TH 真源：≥25 过旺 / ≥20 偏旺 / ≥12 有力(官杀财星)或平和 / ≥5 平和 / <5 虚浮 / ≈0 真缺 */
function tierOfCat(cat, BZ, eScore){
  try{
    const tenE=(typeof window!=='undefined'&&window.ssTenGodEnergy)?window.ssTenGodEnergy(BZ, eScore||{}):null;
    if(!tenE) return tierOf(eScore||{}, tenWxOf(GAN_WX[BZ.dayGan], cat));
    const pairs={'官杀':['正官','七杀'],'印星':['正印','偏印'],'食伤':['食神','伤官'],'财星':['正财','偏财'],'比劫':['比肩','劫财']};
    const names=pairs[cat]||[cat];
    let e=0; names.forEach(n=>{ e+=(tenE[n]||0); });
    const tot=Object.keys(tenE).reduce((a,b)=>a+(tenE[b]||0),0)||1;
    if(e<=1e-6) return '真缺';
    const p=e/tot*100;
    if(p>=25) return '过旺';
    if(p>=20) return '偏旺';
    if(p>=12) return (cat==='官杀'||cat==='财星')?'有力':'平和';
    if(p>=5) return '平和';
    return '虚浮';
  }catch(err){ return tierOf(eScore||{}, tenWxOf(GAN_WX[BZ.dayGan], cat)); }
}
function xiJiOf(wx, A){
  const xi=new Set((A.synthesis&&A.synthesis.xiWxEff)||[]);
  const ji=new Set((A.synthesis&&A.synthesis.jiWxEff)||[]);
  if(xi.has(wx)) return '为喜用';
  if(ji.has(wx)) return '为忌神';
  return '喜忌无涉';
}
/* ================= 统一十神行（四模块同格式：属X，为喜忌，能量，年支子藏本气癸偏印，主含义，时支亥藏本气壬正印，主含义…）=================
 * 落点按年→月→日→时全列：天干透出（X干G透十神）、地支藏干（X支Z藏本气/中气/余气G十神）
 * 含义优先级：①源文"X支藏/X干透出，主YY"（family 模块例外：用家庭语义字典优先）
 *             ②extra 柱位句（事业2.3"财星在月柱，青年财运渐起…"按柱位映射）
 *             ③模块 fallback 字典（家庭=家庭语义字典；其他=通用命理义） */
const LUO_MEAN_FALLBACK={
  '正印':'母荫学养、家教有源','偏印':'祖荫暗藏、思虑偏多','比肩':'同辈助力、自身持家','劫财':'同辈争竞、家业防分',
  '食神':'温厚生财、子女聪颖','伤官':'才情外显、言传身教','正财':'正业家资、财源稳实','偏财':'人脉浮动之财、父缘家资',
  '正官':'家规严正、名分得体','七杀':'权威果决、管束有力'
};
const FAMILY_LUO_MEAN={
  '正印':'母荫学养、家教有源','偏印':'祖荫暗藏、思虑偏多，宜外拓破滞','比肩':'同辈助力、家业可持','劫财':'同辈争竞、家业防分，宜自立分明',
  '食神':'温厚生财、子女聪颖、家计和顺','伤官':'才情外显、家庭重才艺言传，子女教养宜宽而有度','正财':'正业家资、家道可旺','偏财':'人脉浮动之财、父缘家资，宜善用防散',
  '正官':'家规严正、名分得体','七杀':'权威果决、管束有力'
};
/* 事业2.3柱位句提取："财星在月柱，青年财运渐起…；财星落日支（自身宫位），财根在身…；食伤在时柱，晚年才艺子女显" → {月:青年财运渐起…, 日:财根在身…, 时:晚年才艺子女显} */
/* 切出某大类在十神段内的段落（X星属 → 下一个大类key），源文落点含义只在该段内匹配，防串味 */
function catSegOf(rel, cat){
  const keys={'印星':['印星属'],'比劫':['比劫属','比肩属'],'食伤':['食伤属','食神属','伤官属'],'财星':['财星属','正财属','偏财属'],'官杀':['官杀属','正官属','七杀属']}[cat]||[cat+'属'];
  let i=-1;
  for(const k of keys){ const j=String(rel).indexOf(k); if(j>=0&&(i<0||j<i)) i=j; }
  if(i<0) return String(rel||'');
  const ALL=['印星属','比劫属','比肩属','食伤属','食神属','伤官属','财星属','正财属','偏财属','官杀属','正官属','七杀属','② ','③ ','④ ','⑤ '];
  let end=String(rel).length;
  for(const k of ALL){ const j=String(rel).indexOf(k,i+2); if(j>i&&j<end) end=j; }
  return String(rel).slice(i,end);
}
/* 透干/藏支落点含义（按十神×柱位，覆盖源文 TEN_PILLAR_READ/TEN_ZHI_READ 只按卡×柱位的通用句错位，
 * 源文通用句不分十神：正印年干也配"主早年入行、同辈相扶"（比劫义）、财星月干配"主中年事业平台"（官杀义）。此表按十神精确，优先于源文通用句 */
const LUO_GAN = { /* 透干：0年 1月 2日 3时 */
  '正印':['主早年学养奠基、长辈提携','主青年学养精进、文凭可凭','主自身学养立身、专业为基','主晚成学养之果、荫及子女'],
  '偏印':['主早年学养暗藏、思虑偏多','主青年学养偏门、技艺见长','主自身学养内敛、独研为业','主晚成学养偏果、玄学技艺'],
  '比肩':['主早年入行、同辈相扶','主青年同辈竞合、合伙自立','主自身主见坚定、独立成事','主晚岁同辈助力、后辈相扶'],
  '劫财':['主早年同辈争竞、家业防分','主青年同辈竞合、合伙防分','主自身主见刚强、竞争立身','主晚岁同辈争合、防耗守成'],
  '食神':['主早年才艺启蒙、温厚之质','主青年才艺展露、技艺立身','主自身才情温和、表达为业','主晚成才艺之果、子女承业'],
  '伤官':['主早年才艺外露、聪明卓然','主青年才艺纵横、以技立身','主自身才情外放、口才为业','主晚成才艺显扬、子女英发'],
  '正财':['主早年家资渊源、理财渐习','主青年财运转机、营财渐丰','主自身财根在身、务实理财','主晚成财库归藏、守成防耗'],

/* ============ 事业财运：按章节1-7，纯文本表格化 + 文字层兜底 ============
 * 1 本命基调 | 2 十神关系 | 3 神煞纳音十二长生 | 4 六亲与命局特征
 * 5 风险预警 | 6 职业机遇 | 7 名利层级
 * 铁律：单元格纯文本（无<b>/<span>等HTML标签）；空格以"-"；禁斜杠与全角竖线符号；

function scl(s){ return String(s==null?'':s).replace(/[。；；\s]+$/,'').trim(); }
function sub(seg,a,b){ const i=seg.indexOf(a); if(i<0) return ''; const j=b?seg.indexOf(b,i+a.length):seg.length; return seg.slice(i+a.length,j>i?j:seg.length); }
function stripSecHead(s,secList){ let t=String(s||''); for(const k of secList){ t=t.replace(k,''); } return t.replace(/^[:：\s]+/,'').trim(); }
function cutYunTail(s){ let t=String(s||'');
  t=t.replace(/[，、；](?:须|待|借|须看|看)(?:岁|歲)运[^。，；]*/g,'');
  /* "即便岁运引出亦多主约束压力"类："即"非须/待/借/看，且须在"岁运"剥除前处理，防残留"即便"孤词 */
  t=t.replace(/[，、；]?[^。，；]{0,2}便岁运[^。，；]*/g,'');
  /* "公职须借岁运透出"类：逗号后带前词的须借岁运尾巴，须在通用"岁运"剥除前整段剥，防残留"公职须借/公职" */
  t=t.replace(/[，、；][^。，；]{0,4}(?:须|待|借|须看|看)(?:岁|歲)运[^。，；]*/g,'');
  t=t.replace(/[，、；]?岁运[^。，；]*/g,'');
  t=t.replace(/[。，、；]?(?:旺运|去病之运|逢[^。，；]{0,5}运|运引|应期|临运)[^。，；]*/g,'');
  t=t.replace(/[，、；]\s*$/,'');
  t=t.replace(/[，、；]?(?:须|待|借|看)+$/,'');
  t=t.replace(/[，、；](?:宜|须|待|借|看)[。，、；]?$/,'');

function fp(seg, gs, max){ const out=[]; max=max||1;
  seg.split(/[。；;]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    if(/大运|流年|流月|流日|旺运|去病之运|运引|应期|触发|引动|临运|借运|逢[^。，]{0,3}运/.test(s)) return;
    if(!gs.some(g=>s.includes(g))) return;

function escT(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/[\uFF0F/\u2502|]/g,'、'); }
/* escC = escT 基础上删除十神个数信息（"命局X个"等无意义计数） */
function escC(s){ return escT(String(s==null?'':s).replace(/命局\d+个[、，,；;]?/g,'')); }
/* 文字段尾统一补句号。排除：已有结束标点（。！？…）、冒号未完、纯标点/占位（- 等）、纯数字、短标签（≤2字）。
 * 分号/逗号/顿号结尾→转句号；括号结尾→括号外补句号；按 [[BR]] 分段逐段处理。 */
function addPeriods(s){
  if(s==null) return s;
  return String(s).split('[[BR]]').map(seg=>{
    let x=seg.replace(/\s+$/,'');
    if(!x) return seg;
    if(/[。！？…]$/.test(x)) return seg;
    if(/[:：]$/.test(x)) return seg;
    if(/^[\s\-—–•。，,、；;：:（）()]+$/.test(x)) return seg;
    if(/^[\d\s.％%]+$/.test(x)) return seg;
    if(x.length<=2) return seg;
    /* 无标点的 ≤6 字短语视为名词/标签（神煞名"天乙贵人"、状态词"平和"等），不加句号 */
    if(x.length<=6 && !/[，,、；;：:。！？…（）()]/.test(x)) return seg;
    if(/[；;]$/.test(x)) return x.slice(0,-1)+'。';
    if(/[，,、]$/.test(x)) return x.slice(0,-1)+'。';
    if(/[）)]$/.test(x)) return x+'。';
    return x+'。';
  }).join('[[BR]]');

/* sec(title, rows, heads, lblCol, cls) — 单元格纯文本，空格填-；cls 追加到 table 的 class（供列宽对齐定位）
 * secMerge(title, groups, heads, lblCol) — 首列同类只首行显示其余留空(用于分类合并) */
function sec(title, rows, heads, lblCol, cls){
  if(!rows||!rows.length) return '';

  const th=hd.map(h=>'<th>'+escT(h.t)+'</th>').join('');

      const vv=(isLbl&&(v||'').length<=8)? v : ((hd[i]&&hd[i].noperiod)? v : addPeriods(v));
      return '<td'+((lblCol===0&&i===0)?' class="lbl"':'')+((hd[i]&&hd[i].nowrap)?' class="nowrap"':'')+'>'+escC(vv).replace(/\[\[BR\]\]/g,'<br>')+'</td>'; }).join('');

/* 十神经典断语表（四模块统一渲染）：合并同名分支（按 matchAll 权重序，Map 保持插入序）+ 数量截断。

function queVal(base,A,dw){

          正印:tenWxOf(dw,'印星'),偏印:tenWxOf(dw,'印星'),
          比肩:tenWxOf(dw,'比劫'),劫财:tenWxOf(dw,'比劫'),

  const ZHI_WX={'子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水'};

  const NAYIN=/(海中金|炉中火|大林木|路旁土|剑锋金|山头火|山下火|涧下水|城头土|白蜡金|杨柳木|泉中水|屋上土|霹雳火|松柏木|长流水|沙中金|壁上土|金箔金|覆灯火|天河水|大驿土|钗钏金|桑柘木|石榴木|平地木|大溪水|沙中土|天上火|大海水)/;
  const nav=[];
  [['年柱','年命'],['日柱','日柱'],['月柱','月柱'],['时柱','时柱']].forEach(([t,k])=>{
    const hit=fp(segN,[k],1)[0]; if(!hit) return;
    const m=hit.match(NAYIN);
    const name=m?m[1]:'';
    const rest=hit.replace(NAYIN,'').replace(/^[②③①⑥⑤④]?\s*纳音[:：]?\s*/,'').replace(/^年命|^日柱|^月柱|^时柱|^年|^月|^日|^时/g,'').replace(/^[:：,，、\s]*/,'');
    nav.push([name, cutYunTail(scl(rest))]);
  });
  groups.push(['纳音', nav]);
  // 十二长生：name=长生位（病/帝旺/养/死），content=解释
  const segL=cut(card,'③ 十二长生','4、');
  const zs=[];
  const CSZ=/(病|死|墓|绝|胎|养|长生|沐浴|冠带|临官|帝旺|衰)/;
  [['年柱','年支'],['月柱','月支'],['日柱','日支'],['时柱','时支']].forEach(([t,k])=>{
    const i=segL.indexOf(k); if(i<0) return;
    const s=scl(segL.slice(i,i+42).split(/。|；/)[0]);
    const m=s.match(CSZ);
    const name=m?m[1]:'';
    let rest=s.replace(CSZ,'');
    rest=rest.replace(/^年支|^月支|^日支|^时支/,'').replace(/^[（(]?[子丑寅卯辰巳午未申酉戌亥][）)]?\s*/,'').replace(/^[（()）]+\s*/,'').replace(/^[:：,，、\s]*/,'');
    if(s) zs.push([name, cutYunTail(scl(rest))]);
  });
  groups.push(['十二长生', zs]);
  return secCat('3  神煞、纳音与十二长生', groups, ['分类','名称','内容']);
}
/* 四柱六亲：柱位→六亲；状态与作用=该柱原文解读直接入栏（verbatim，不做改写/拼前缀） */
function T4(card){
  const six=cut(card,'4、六亲','5、风险预警');
  const rows=[];
  // 六亲①段按句切、按柱位词归 年/月/日/时 四桶（通用男女盘，杜绝硬编码锚点致空栏）
  const segSix=sub(six,'①','②').replace(/^①\s*/,'');
  const s6=segSix.split(/[。；]/).map(s=>s.trim()).filter(Boolean);
  const buck={年柱:[],月柱:[],日柱:[],时柱:[]};
  s6.forEach(s=>{
    if(/年柱|祖(?:辈|上|业|荫)|父(?:缘|星|亲)|外祖/.test(s)) buck.年柱.push(s);
    else if(/月干|月支|父母|同辈|朋(?:友|僚)|兄弟/.test(s)) buck.月柱.push(s);
    else if(/日主|日支|自身|配偶|夫妻|夫妇|坐支/.test(s)) buck.日柱.push(s);
    else if(/时柱|晚年|子女|后辈|下属|儿(?:孙)?|晚景/.test(s)) buck.时柱.push(s);
    else buck.日柱.push(s); // 兜底
  });
  // 六亲宫位名一律读 PILLAR_MAP 真源（年=祖辈宫/月=父母宫/日=夫妻宫/时=子女宫），禁另建同义表
  const PM=(typeof window!=='undefined'&&window.PILLAR_MAP)||{};
  const LQ4=p=>{ if(PM[p]&&PM[p].六亲宫位){ const a=PM[p].六亲宫位.split('、'); return p==='日柱'?(a[1]||a[0]):a[0]; } return ({年柱:'祖辈宫',月柱:'父母宫',日柱:'夫妻宫',时柱:'子女宫'})[p]||p; };
  [['年柱','年柱'],['月柱','月柱'],['日柱','日柱'],['时柱','时柱']].forEach(([p,k])=>{
    if(buck[k].length) rows.push([LQ4(p), cutYunTail(scl(buck[k].join('；')))]);
  });
  const tzbody=cut(six,'② 命局特征','5、');
  const tzMap=[['官杀','官杀'],['印星','印星'],['财星','财星'],['比劫','比劫'],['食伤','食伤']];
  tzMap.forEach(([label,key])=>{
    const i=tzbody.indexOf(key+'为');
    if(i<0) return;
    const seg=tzbody.slice(i);
    const endIdx=[tzbody.indexOf('印星为',i+1),tzbody.indexOf('财星为',i+1),tzbody.indexOf('比劫为',i+1),tzbody.indexOf('官杀为',i+1),tzbody.indexOf('食伤为',i+1),tzbody.indexOf('命局食伤',i+1),tzbody.indexOf('命局比劫',i+1)].filter(x=>x>i).sort((a,b)=>a-b)[0];
    let hit=scl((endIdx? seg.slice(0,endIdx-i): seg).split(/[。；]/)[0]);
    if(hit&&hit.length>3){
      // 官杀行去重："官杀为事业星（掌权名位），命局缺，掌权名位" → 删第二个"掌权名位"
      if(label==='官杀') hit=hit.replace(/（掌权名位）([^。；]*?)掌权名位/,'（掌权名位）$1').replace(/[，,]\s*$/,'');
      rows.push([label, cutYunTail(hit)]);
    }
  });
  // 食伤行补齐：源文命局特征只对官杀/印星/财星/比劫输出"X为"段（无"食伤为"），
  // 先取"命局食伤"组合句；再无则按真实判定输出"不现"（食伤不透不藏时源文即无此句，不可留空）
  if(!rows.some(r=>r[0]==='食伤')){
    const sj=cut(six,'命局食伤','宜择');
    const hit=sj?fp(sj,['食伤'],1)[0]:'';
    rows.push(['食伤', cutYunTail(hit||'为才艺表达，原局不现、才情偏藏')]);
  }
  return sec('4  六亲与命局特征', rows, ['宫位十神','状态与作用'], 0);
}
/* ---------- 5 风险预警（分类合并：风险/短板/可证伪 仅首行；匹配不到时取整段兜底，防空表） ---------- */
function T5(card){
  const seg=cut(card,'5、风险预警','6、职业机遇');
  const groups=[];
  const riskBody=sub(seg,'风险提示','短板');
  const rr=[];
  [['比劫夺财'],['印星'],['偏星'],['理财'],['坐班']].forEach(([k])=>{
    const i=riskBody.indexOf(k); if(i<0) return;
    const segi=riskBody.slice(i).split(/[。；]/)[0];
    if(segi.length>3) rr.push([cutYunTail(stripSecHead(segi,['风险提示','：','。']))]);
  });
  // 兜底：无关键词命中时取整段（源文"本局无明显凶格，宜顺势进取"等），防"只有表头无内容"空表
  if(!rr.length){
    const fb=scl(stripSecHead(String(riskBody),['风险提示','短板','：',':','。','；']));
    if(fb&&fb.length>3&&!/大运|流年|流月|流日|旺运|应期|引动|触发/.test(fb)) rr.push([cutYunTail(fb)]);
  }
  groups.push(['风险提示', rr]);
  const db=sub(seg,'短板','可证伪').replace(/^短板[:：]/,'');
  const bb=[];
  db.split(/[，。；]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    s=stripSecHead(s,['：','：']);
    if(/官杀缺|七杀缺|财星全藏/.test(s)) bb.push([cutYunTail(s)]);
  });
  // 兜底：无短板匹配时取整段（"无明显短板，宜扬长避短"）
  if(!bb.length){
    const fb=scl(stripSecHead(String(db),['短板','：',':','。','；']));
    if(fb&&fb.length>3&&!/大运|流年|流月|流日|旺运/.test(fb)) bb.push([cutYunTail(fb)]);
  }
  groups.push(['特征提示', bb]);
  const kz=sub(seg,'可证伪','6、').replace(/^可证伪[:：]/,'');
  const kk=[];
  kz.split(/[。；]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    s=stripSecHead(s,['：','：']);
    const m=s.match(/^([^，]+)，若([^，]+?.+?)则印证，若([^，].+?)则矛盾/);
    if(m) kk.push([m[1]+'：若'+m[2]+'则印证，否则矛盾']);
  });
  // 兜底：无可证伪匹配时取整段（"命局特征平稳，少有强可证伪断语"）
  if(!kk.length){
    const fb=scl(stripSecHead(String(kz),['可证伪','：',':','。','；']));
    if(fb&&fb.length>3&&!/大运|流年/.test(fb)) kk.push([cutYunTail(fb)]);
  }
  groups.push(['可证伪', kk]);
  return secCat('5  风险预警', groups, ['分类','提示']);
}
/* ---------- 6 职业机遇 ---------- */
function T6(card){
  let h='';
  const jobs=extractJobs(card).map(j=>{
    // 依据列统一保证句末句号（分号/逗号/顿号结尾→句号；纯短语如"正官现而中性"→补句号）
    let bs=scl(cutYunTail(j.basis)).replace(/[，、；；](宜|待|看)$/,'').replace(/[，、；;]\s*$/,'');
    if(!/[。！？…]$/.test(bs)) bs+='。';
    return [j.level||'宜', j.god, j.dir, bs];
  });
  const bx=cut(card,'相对不宜','② 五行行业对照').replace(/^相对不宜[:：]?/,'');
  const bxs=[];
  bx.split(/[；;]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    s=s.replace(/^[，。]/,'').trim();
    const m=s.match(/^(正印|偏印|比肩|劫财)[，,]([^（]+)（([^）]+)）/);
    if(m) bxs.push(['不宜', m[1], m[2], m[3]]);
  });
  h+=sec('6.1  职业方向与宜忌', jobs.concat(bxs), ['宜忌',{t:'十神',nowrap:true},{t:'方向',nowrap:true},'依据'], 0, 'stab-cy');
  /* 财库不在此出条：财库定调归表1 本命基调财库栏，开合二说与土库辰戌二说归本命分析墓库速查行，此处不重复输出 */
  // 五行行业对照（第一列=五行 木火土金水）
  const indRaw=cut(card,'② 五行行业对照','行业成败');
  const seg=indRaw.replace(/^[①-⑩]?\s*五行行业对照.*?[。]/,'').replace(/^[。\s]*/,'');
  const listByWx={};
  seg.split(/[；;]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    s=s.replace(/^[。]/,'');
    const m=s.match(/^([木火土金水])([利慎])[（(]([^）)]+)[）)]?[:：](.+)$/);
    if(m) listByWx[m[1]]={st:m[2], list:m[4]};
  });
  const order=['木','火','土','金','水'];
  const inds=order.map(wx=>listByWx[wx]?[wx, listByWx[wx].st, scl(listByWx[wx].list)]:null).filter(Boolean);
  h+=sec('6.2  五行行业对照', inds, ['五行','宜忌','行业'], 0, 'stab-inds');
  // 行业成败 附加说明（原文保留，仅清运势四词）
  const cheng=cut(card,'行业成败','③ 古籍断语').replace(/^行业成败[:：]?/,'').replace(/[，、；]?(?:须|待|借|看)(?:岁|歲)运[^。，；]*/g,'').replace(/[，、；]?岁运[^。，；]*/g,'').trim();
  if(cheng) h+=note('行业成败'+cheng.replace(/^[，,、。\s]+/,''));
  // 古籍断语：整段匹配 "断语…（《出处》）"，勿按"。"拆分(会切断断语与出处)
  const gj=cut(card,'③ 古籍断语','7、').replace(/^③\s*古籍断语[:：]?/,'');
  const gjRows=[];
  const gjRe=/([\s\S]*?)（(《[^）]+》)）\s*/g;
  let gjm;
  while((gjm=gjRe.exec(gj))){
    const duangyu=cutYunTail(gjm[1].replace(/^[。；\s]+/,'').replace(/[；\s]+$/,'').trim());
    const chuchu=gjm[2];
    if(duangyu&&duangyu.length>1&&!/大运|流年/.test(duangyu)) gjRows.push([duangyu, chuchu]);
  }
  h+=sec('6.3  古籍断语', gjRows, ['断语',{t:'出处',noperiod:true}], 0, 'stab-a2');
  return h;
}
/* ---------- 7 名利层级（三维层级 + 综合判定①②③④⑤ + 五者齐备 合并表格；相同八字 作补充） ---------- */
function T7(card){
  const segT=cut(card,'综合判定',null);
  const l3=extractLevel3(card).map(r=>[r.name, r.lv, cutYunTail(r.basis)]);
  const rows=l3.slice();
  const lv3=extractLevel3(card);
  // 层级 = 三维权重加权综合计算（非单取某维度）：主导维度权0.5，其余均权；再映射高/中/低
  const few=cut(segT,'① 原局潜力层级','②').replace(/^①\s*原局潜力层级[:：]?/,'');
  const domM=few.match(/综合以([^，。；：]+)维度为主导/);
  const dom=domM?domM[1].replace(/[潜力层级]/g,''):'';
  const sc={低:1,待运:1.5,中:2,高:3};
  let tot=0,wsum=0;
  (lv3.length?lv3:[{name:'名望',lv:'高'}]).forEach(r=>{
    const isDom=!!(dom&&r.name.includes(dom));
    const w=isDom?0.5:(lv3.length>1?0.5/(lv3.length-1):1);
    tot+=(sc[r.lv]||1)*w; wsum+=w;
  });
  const scr=wsum?tot/wsum:0;
  const lvl=scr>=2.6?'高':scr>=1.7?'中':'低';
  const addL=(k,lev,c)=>c&&String(c).trim()?rows.push([k,lev,cleanNar(c)]):null;
  const addE=(k,lev,c)=>c&&String(c).trim()?rows.push([k,lev,cleanNar(cleanExt(c))]):null;
  addL('综合判定', lvl, cut(segT,'综合判定','① 原局').replace(/^综合判定[:：]?/,'').split(/[。；]/).slice(0,2).join('。'));
  // 事业综合判定说明：名利层级结论须原局条件叠加方可兑现（不附加"非原局自带"字样）
  { const zi=rows.findIndex(r=>r[0]==='综合判定');
    if(zi>=0) rows[zi][2]=(rows[zi][2]?rows[zi][2]+'。':'')+'名利所赖财库、格局、官杀、官印相生、杀印相生、印星、财官相生、比劫、正官、学识等项原局不足或为忌，须五层条件叠加方能充分兑现'; }
  addL('原局潜力', lvl, few.split(/[。；]/)[0]);
  addE('大运流年', '外部', cut(segT,'② 大运流年引动','③').replace(/^②\s*大运流年引动[:：]?/,'').split(/[。；]/)[0]);
  addE('风水合局', '外部', cut(segT,'③ 风水合局','④').replace(/^③\s*风水合局[:：]?/,''));
  addE('社会时代', '外部', cut(segT,'④ 社会时代机遇','⑤').replace(/^④\s*社会时代机遇[:：]?/,''));
  addE('个人经营', '内在', cut(segT,'⑤ 个人经营主观能动性','五者齐备').replace(/^⑤\s*个人经营主观能动性[:：]?/,''));
  // 事业总取向（五者齐备 + 源文动态路径句 合并一行）：第二句=源文"五者齐备"之后整段，
  // 男命"事业X"/女命"女命X"（X=pathCore 随盘变：管理掌权/专精技术商贸/凭管理成事等），从源文截取、绝不写死
  const wuzSeg=cut(segT,'五者齐备','相同八字');
  const wuz=wuzSeg.split(/[。；]/)[0].replace(/。?$/,'');
  const shiye=wuzSeg.slice(wuz.length).replace(/^[。；\s]+/,'').replace(/[。；\s]+$/,'').trim();
  const total=[wuz, shiye].filter(Boolean).join('。');
  if(total) rows.push(['总体取向', '', cleanNar(total)]);
  rows.forEach(r=>{ if(r[2]&&typeof r[2]==='string') r[2]=sentBR(r[2]); });
  return sec('7  名利层级', rows, ['维度','层级','说明'], 0, 'stab-a3');
}
function cleanNar(s){ return String(s||'').replace(/[，、；：]\s*$/,'').trim(); }
/* 综合判定"外部/内在条件"段：剥离开头的标签（外部条件/内在条件 及其"机遇/主观能动性"前缀与括号），
   因"层级"列已显示"外部/内在"，说明列只保留实际内容，避免"外部外部条件/内在内在条件"重复。 */
function cleanExt(s){
  return String(s==null?'':s)
    .replace(/^[（(]\s*/,'')
    .replace(/[）)]。?\s*$/,'')
    .replace(/^(?:机遇|主观能动性)?[（(]?(?:外部条件|内在条件)[：:]?/,'');
}
/* 说明列每句话分段：仅在句号后换行（[[BR]]），分号（；）为句内并列不换行，避免"长期投入；命理示…"被拆成两行；括号内不换行。 */
function sentBR(s){
  let t=String(s==null?'':s);
  // 逐句断行：句号后换行；成对（）内的。不换行（如"（…结识。主晚运…缘）"保持一排）
  t=t.replace(/。/g,function(m,off,str){
    const before=str.slice(0,off);
    return (before.lastIndexOf('（')>before.lastIndexOf('）'))? m : m+'[[BR]]';
  });
  return t.replace(/\[\[BR\]\][\s]*\[\[BR\]\]/g,'[[BR]]');
}
/* {"相同八字…"} 作为补充文字 */
function T7note(card){
  const segT=cut(card,'综合判定',null);
  const same=cut(segT,'相同八字',null).split(/[。；]/)[0]||'';
  if(!same) return '';
  return note(scl(same)+'。');
}

/* ============ 婚姻/性格健康/家庭子女 V17：按事业财运同样逻辑（章节.子表、纯文本、sub-note补充） ============ */
/* 复用通用工具：sec/secCat/note/scl/sub/fp/cutYunTail/queVal/yinYangPill/extractShenSha/extractLevel3/stripSecHead */
/* 剥段首标题：③ X深析：内容 → 内容（男女盘标题词不同，如妻星深析/夫星深析） */
function stripLeadTitle(s){ return String(s==null?"":s).replace(/^[①②③④⑤⑥⑦⑧⑨⑩]?\s*[^：:，。；]{1,14}[:：]?\s*/,""); }
/* 具体十神判定（相对日主）：五行生克+阴阳。返回 比肩/劫财/食神/伤官/正财/偏财/正官/七杀/正印/偏印 */
/* 地支本气 */
/* 去全角括号、拆内部分句为顿号、规整重复标点（用于家庭模块十神/六亲内容去括号净化） */
function stripBr(s){
  let t=String(s==null?'':s);
  t=t.replace(/[（(]/g,'，').replace(/[）)]/g,'');
  t=t.replace(/[。；；]+/g,'；').replace(/；+/g,'；');
  t=t.replace(/，{2,}/g,'，').replace(/；{2,}/g,'；');
  // 合并 "日支，未" 类地支标注（原"日支(未)"）；以及"年命，海中金"类
  t=t.replace(/(年支|月支|日支|时支)，([子丑寅卯辰巳午未申酉戌亥])/g,'$1$2');
  t=t.replace(/^[，、；\s]+/,'').replace(/[，、；\s]+$/,'');
  return t;
}
/* ---- 纳音自坐（四卡纳音表通用收尾）：该柱纳音五行折本气阳干后在本柱地支所得十二长生（走引擎全局 nayinZizuo 单点），
 *   释义按卡取 CS_MEAN_ALL 对应字段；与四柱基础表所记"自坐"（该柱天干在本柱地支）为两套口径，并行参看。
 *   事业/婚姻/健康/家庭四卡纳音表一律同此收尾，禁只在某一卡出现。 ---- */
function nayZizuoNote(gz, field){
  const zz=(typeof window!=='undefined'&&typeof window.nayinZizuo==='function')?window.nayinZizuo(gz):'';
  if(!zz) return '';
  const m=(typeof window!=='undefined'&&window.CS_MEAN_ALL&&window.CS_MEAN_ALL[zz])||{};
  const mean=m[field]||'';
  return '纳音自坐'+zz+(mean?('，'+mean):'')+'。';
}
/* ---- 家庭专用：神煞纳音十二长生（与事业/婚姻/健康完全同构：神煞补齐四柱、纳音四柱全列、长生四柱全列；名称列纯名、落柱进内容列；无关神煞标注"与家庭子女关联较少"） ---- */
function shenshaBlock(card, title, BZ){
  const groups=[];
  // ① 神煞：遍历四柱补齐全部，源文有家庭义用源文，无关标注
  const shaMean={};
  extractShenSha(card).forEach(s=>{ const nm=(s.name||'').replace(/[（(][^）)]*[）)]$/,'').trim(); if(nm) shaMean[nm]=s.body; });
  const ss=[];
  [['shaYear','年'],['shaMonth','月'],['shaDay','日'],['shaTime','时']].forEach(([prop,p])=>{
    const arr=((BZ&&BZ[prop])||[]).map(x=>(x||'').replace(/（纳音）/,'').trim()).filter(Boolean);
    arr.forEach(sn=>{ if(ss.some(o=>o[0]===sn)) return; const _m=shaMean[sn]?shaMean[sn]:'该神煞与家庭子女关联较少'; if(!/关联较少/.test(_m)) ss.push(shaUnify(sn, _m, BZ)); });
  });
  groups.push(['神煞', ss]);
  // ② 纳音：四柱全列，名称=纯纳音名；源文有解读用源文，无解读用简短柱位家庭义
  const P=['年','月','日','时'];
  const nay=(typeof window!=='undefined'&&window.nayinOf)?window.nayinOf:(()=> '');
  const segN=String(cut(card,'② 纳音','③ 十二长生')||'');
  const nayRows=[];
  const NAYFB={0:'祖上根基、家运之始',1:'主同辈环境、兄弟亲缘',2:'主自身成家立室',3:'主子女宫、晚景家运'};
  BZ.zhis.forEach((z,i)=>{
    const gz=BZ.gans[i]+BZ.zhis[i], nm=nay(gz)||'';
    const key= i===0?'年命':(P[i]+'柱');
    const sm=segN.match(new RegExp(key+'[^。；]{0,4}'+nm+'[^。；]*。?'));
    let body='';
    if(sm&&segN.indexOf(key)>=0){
      body=cleanCell(cutYunTail(scl(sm[0].replace(new RegExp('^'+key+nm),'').replace(/^（[^）]*）[，,、]?/,'').replace(/^[：:，,、\s]+/,''))));
    } else {
      // 子女宫/时柱也尝试按"子女宫X纳音"匹配
      if(i===3){ const sm2=segN.match(new RegExp('子女宫[^。；]{0,4}'+nm+'[^。；]*。?')); if(sm2){ body=cleanCell(cutYunTail(scl(sm2[0].replace(new RegExp('^子女宫'+nm),'').replace(/^（[^）]*）[，,、]?/,'').replace(/^[：:，,、\s]+/,'')))); } }
    }
    if(!body) body= nm? (NAYFB[i]||('主'+P[i]+'柱')) : '';
    const _nz=nayZizuoNote(gz,'family');
    if(_nz) body=(body?String(body).replace(/[。；]+$/,''):'')+(body?'；':'')+_nz;
    if(body) nayRows.push([nm, body]);
  });
  if(nayRows.length) groups.push(['纳音', nayRows]);
  // ③ 十二长生：四柱全列，名称=长生位；内容=源文柱位义＋简短家庭方向
  const segL=cut(card,'③ 十二长生',null).split('4、')[0].split('①')[0];
  const zsRows=[];
  const CS_MEAN3={长生:'家运渐兴',沐浴:'家宅宜静',冠带:'家道渐立',临官:'家运旺相',帝旺:'家运正盛、宜守成',衰:'家运转弱、宜守',病:'家运根基宜培',死:'晚景与子女缘宜用心维系',墓:'家财宜固',绝:'家运微弱、宜扶持',胎:'家运待兴',养:'家宅和顺、宜用心经营'};
  [['年柱','年支'],['月柱','月支'],['日柱','日支'],['时柱','时支']].forEach(([t,k])=>{
    const m=segL.match(new RegExp(k+'[子丑寅卯辰巳午未申酉戌亥]（([^）]*)）'));
    if(!m) return;
    const inside=m[1];
    const mm=inside.match(/^(病|死|墓|绝|胎|养|长生|沐浴|冠带|临官|帝旺|衰)?[，,、：:]?\s*(.*)$/);
    const name=(mm&&mm[1])?mm[1]:'';
    const yu=(mm&&mm[2]?mm[2]:'').replace(/^主/,'').replace(/、.*$/,'').trim();
    const fb=CS_MEAN3[name]||'';
    const content=[yu, fb].filter(Boolean).join('，');
    if(content) zsRows.push([name, cutYunTail(scl(content))]);
  });
  if(zsRows.length) groups.push(['十二长生', zsRows]);
  return secCat(title, groups, ['分类','名称','内容']);
}
/* ---- 婚姻专用：神煞/纳音补全四柱（源文只列"临到且有婚恋义"的神煞，故常缺年/时柱；补全每柱都列所临神煞，纳音四柱全） ---- */
function marryShaBlock(card, BZ){
  const groups=[];
  const PILLAR_LUO=['年','月','日','时'];
  const stage=['早年年门、祖上根基','青年同辈环境','自身夫妻宫正缘','晚运情缘子女'];
  // ① 神煞：按四柱顺序（年→月→日→时）依次排；婚恋义统一读顶层真源 SHA_MEAN.marry（bazi-data.js），
  // 临柱即输出，不另设局部白名单
  // 源文已列（有婚恋断语）按落柱归位：名称=神煞名（落柱），内容=纯断语（统一事业式：剥"落宫语义；"前缀，与事业/健康格式一致）
  const stripLuo=b=>String(b||'').replace(/^(?:早年|青年|自身|晚运)[^；；]*[；]?\s*/,'');
  const rawRows=extractShenSha(card).map(s=>({name:(s.name||'').replace(/[①-⑩]*(神煞|综合)/,''), col:s.col||'', body:scl(stripLuo(s.body))}));
  const outRows=[];
  const shaCols=[['shaYear',0],['shaMonth',1],['shaDay',2],['shaTime',3]];
  shaCols.forEach(([prop,pi])=>{
    const luo=PILLAR_LUO[pi], stg=stage[pi];
    const arr=((BZ&&BZ[prop])||[]).map(x=>(x||'').replace(/（纳音）/,'').trim()).filter(Boolean);
    // 该柱源文已列的神煞（body 含落宫语义）优先，统一式：名称列纯神煞名，落柱进内容列开头
    rawRows.filter(r=>r.col&&r.col.indexOf(luo)>=0).forEach(r=>{
      if(outRows.some(o=>(o[0]||'').indexOf(r.name)>=0)) return;
      outRows.push(shaUnify(r.name, r.body, BZ));
    });
    arr.forEach(sn=>{
      if(outRows.some(o=>(o[0]||'').indexOf(sn)>=0)) return;
      const _mm=(typeof window!=='undefined'&&window.SHA_MEAN&&window.SHA_MEAN[sn])?window.SHA_MEAN[sn].marry:'';
      const body= _mm ? _mm : '该神煞与婚姻感情关联较少';
      if(!/关联较少/.test(body)) outRows.push(shaUnify(sn, body, BZ));
    });
  });
  // 源文落柱为多柱合一（如"年、日柱"）的，已按年柱归位；漏网的源文神煞（未match四柱）补在末
  rawRows.forEach(r=>{ if(r.col&&!outRows.some(o=>o[0].indexOf(r.name)>=0)) outRows.push(shaUnify(r.name, r.body, BZ)); });
  if(outRows.length) groups.push(['神煞', outRows]);
  // ② 纳音四柱全列：内容=纳音五行与该柱日主/阶段针对性解读（源文配偶宫断语保留；余柱据纳音五行与日主五行生克、落到柱位阶段），
  //   末并出纳音自坐（nayZizuoNote）；纳音五行与自坐走引擎全局 nayinWxOf 与 nayinZizuo，禁另建局部表
  const segN=String(cut(card,'② 纳音','③ 十二长生')||'');
  const nay=(typeof window!=='undefined'&&window.nayinOf)?window.nayinOf:(()=> '');
  const nayWxF=(typeof window!=='undefined'&&window.nayinWxOf)?window.nayinWxOf:(()=> '');
  const dayWx=GAN_WX[BZ.dayGan]||'';
  const SH={'木':'火','火':'土','土':'金','金':'水','水':'木'}, KE={'木':'土','土':'水','水':'火','火':'金','金':'木'};
  // gxOf(a纳音,b日主)：a===b→比和；SH[a]===b→a生b；KE[a]===b→a克b；否则反向查看身生/克
  const gxOf=(a,b)=>{ if(!a||!b)return''; if(a===b)return'比和'; if(SH[a]===b)return a+'生'+b; if(SH[b]===a)return b+'生'+a; if(KE[a]===b)return a+'克'+b; if(KE[b]===a)return b+'克'+a; return''; };
  const nayRows=[];
  BZ.zhis.forEach((_z,i)=>{
    const gz=BZ.gans[i]+BZ.zhis[i], nm=nay(gz)||'', wx=nayWxF(gz);
    let body='';
    if(i===2){
      const src=segN.match(/配偶宫[^。；]*。?/);
      body=src? cleanCell(cutYunTail(scl(src[0].replace(/^配偶宫[:：]?\s*/,'')))) : ('配偶宫纳音'+nm);
    } else {
      const gxy=gxOf(wx,dayWx);
      let eff='主该柱婚恋闲适平淡';
      if(gxy==='比和') eff='与日主同气，主该柱婚恋顺平无碍、宜顺其自然';
      else if(gxy===(wx+'生'+dayWx)) eff='纳音生身，主该柱婚恋有所裨益';
      else if(gxy===(dayWx+'生'+wx)) eff='身生纳音，主该柱婚恋多付出包容';
      else if(gxy===(wx+'克'+dayWx)) eff='纳音克身，主该柱婚恋有制、宜以柔调和';
      else if(gxy===(dayWx+'克'+wx)) eff='身克纳音，主该柱婚恋可控、宜防过刚';
      body=(gxy?('与日主'+gxy+'，'):'')+eff+'。';
    }
    const _nz=nayZizuoNote(gz,'marry');
    if(_nz) body=(body?String(body).replace(/[。；]+$/,''):'')+(body?'；':'')+_nz;
    nayRows.push([nm, body]);
  });
  if(nayRows.length) groups.push(['纳音', nayRows]);
  // ③ 十二长生（复用共享：名称=长生位，内容=落宫＋婚恋解读）
  const segL=cut(card,'③ 十二长生',null).split('4、')[0].split('①')[0].replace(/^③\s*十二长生[:：]?\s*/,'');
  const zs=[];
  segL.split(/[；;。]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{
    if(/神煞与喜忌|日柱纳音自坐/.test(s)) return;
    const m=s.match(/^([^（(]+?)[（(]([子丑寅卯辰巳午未申酉戌亥])[）)]\s*(病|死|墓|绝|胎|养|长生|沐浴|冠带|临官|帝旺|衰)?\s*([（(][^）)]*[）)])?\s*$/);
    if(!m) return;
    const luo=scl(m[1]); const cs=m[3]||'';
    const jiedu=scl((m[4]||'').replace(/[（()）]/g,''));
    const content=[luo||'', jiedu||''].filter(Boolean).join('；');
    if(content&&content.length>1) zs.push([cs||'—', cutYunTail(content)]);
  });
  if(!zs.length){ const fb=scl(segL.split(/神煞与喜忌/)[0]); if(fb) zs.push(['—', cutYunTail(fb)]); }
  if(zs.length) groups.push(['十二长生', zs]);
  return groups.length? secCat('2  神煞、纳音与十二长生', groups, ['分类','名称','内容']) : '';
}
/* ---- 模块通用：风险预警（三栏恒有：风险提示/特征提示/可证伪 仅首行；源文缺段时按模块兜底，保证各模块样式一致） ---- */
function riskBlock(card, a, b, title){
  const seg=cut(card,a,b);
  if(!seg||!seg.trim()) return '';
  const groups=[];
  // 每个分类一律合并为“一整格一段”，禁止逐句拆多排（断上下文语义）
  const riskEnd=seg.indexOf('短板')>0?seg.indexOf('短板'):(seg.indexOf('特征提示')>0?seg.indexOf('特征提示'):(seg.indexOf('可证伪')>0?seg.indexOf('可证伪'):seg.length));
  const riskBody=seg.slice(seg.indexOf('风险提示')>=0?seg.indexOf('风险提示'):0, riskEnd);
  const rr=[];
  const rOne=String(riskBody).replace(/^风险提示[:：]?\s*/,'').replace(/[。；\s]+$/,'').trim();
  if(rOne.length>3&&!/大运|流年|流月|流日|旺运|应期|引动|触发/.test(rOne)) rr.push([cutYunTail(scl(rOne))]);
  if(rr.length) groups.push(['风险提示', rr]);
  // 特征提示/短板段：整段一股；源文缺段时按模块兜底（三栏恒有）
  const dbStart=seg.indexOf('短板')>0?seg.indexOf('短板'):seg.indexOf('特征提示');
  const dbKz=seg.indexOf('可证伪')>dbStart?seg.indexOf('可证伪'):seg.length;
  const dbLen=seg.indexOf('短板')>0?'短板'.length:'特征提示'.length;
  const dbSrc=dbStart>0? seg.slice(dbStart+dbLen, dbKz) : '';
  const db=dbSrc.replace(/^(短板|特征提示)?[:：]/,'').replace(/^[。；\s]+/,'').replace(/^[:：,，\s]+/,'').replace(/[。；\s]+$/,'').trim();
  const bb=[];
  if(db&&!/大运|流年|流月|流日|旺运/.test(db)) bb.push([cutYunTail(scl(db))]);
  if(!bb.length){
    const featFb = b.indexOf('养护调护')>=0 ? '本局无明显体质特征提示，顺时养护就好。'
      : b.indexOf('家庭经营')>=0 ? '本局无明显家庭特征提示，寻常经营即可。'
      : '本局无明显婚恋特征提示，顺其自然经营就好。';
    bb.push([featFb]);
  }
  groups.push(['特征提示', bb]);
  // 可证伪：整段一股；源文缺段时给通用兜底（三栏恒有）
  const kz=String(sub(seg,'可证伪',null)||'').replace(/^可证伪[:：]/,'').replace(/^[:：,，\s]+/,'').replace(/[。；\s]+$/,'').trim();
  const kk=[];
  if(kz&&!/大运|流年/.test(kz)) kk.push([cutYunTail(scl(kz))]);
  if(!kk.length) kk.push(['命局特征平稳，少有强可证伪断语。']);
  groups.push(['可证伪', kk]);
  return secCat(title, groups, ['分类','提示']);
}
/* ---- 模块通用：层级表（三维 + 综合判定①②③④⑤ + 取向） ---- */
function levelBlock(card, title, domWords){
  const segT=cut(card,'综合判定',null);
  const l3raw=extractLevel3(card);
  const rows=l3raw.map(r=>[r.name, r.lv, cutYunTail(r.basis)]);
  // 综合判定/原局潜力层级 层级 = 三维权重加权计算（主导维度权0.5，其余均权）
  const few=cut(segT,'① 原局潜力层级','②').replace(/^①\s*原局潜力层级[:：]?/,'');
  const domM=few.match(/综合以([^，。；：]+)维度为主导/);
  const dom=domM?domM[1].replace(/[潜力层级]/g,''):'';
  const sc={低:1,待运:1.5,中:2,高:3};
  let tot=0,wsum=0;
  (l3raw.length?l3raw:[{name:'',lv:'中'}]).forEach(r=>{
    const isDom=!!(dom&&r.name.includes(dom));
    const w=isDom?0.5:(l3raw.length>1?0.5/(l3raw.length-1):1);
    tot+=(sc[r.lv]||1)*w; wsum+=w;
  });
  const lvl=wsum? (tot/wsum>=2.6?'高':tot/wsum>=1.7?'中':'低') : '';
  const addL=(k,lev,c)=>c&&String(c).trim()?rows.push([k,lev,cleanNar(c)]):null;
  const addE=(k,lev,c)=>c&&String(c).trim()?rows.push([k,lev,cleanNar(cleanExt(c))]):null;
  addL('综合判定', lvl, cut(segT,'综合判定','① 原局').replace(/^综合判定[:：]?/,'').split(/[。；]/).slice(0,2).join('。'));
  if(domWords.zongheNote){
    const zi=rows.findIndex(r=>r[0]==='综合判定');
    if(zi>=0) rows[zi][2]=(rows[zi][2]?rows[zi][2]+'。':'')+domWords.zongheNote;
  }
  addL('原局潜力', lvl, few.split(/[。；]/)[0]);
  addE('大运流年', '外部', cut(segT,'② 大运流年引动','③').replace(/^②\s*大运流年引动[:：]?/,'').split(/[。；]/)[0]);
  // ③④⑤ 外部/内在条件：字段名随模块可变（婚姻=风水合局/社会时代机遇/个人经营主观能动性；家庭=风水合局/家风环境/经营主观能动性→标签家庭经营）
  const E3=domWords.e3||'风水合局', E4=domWords.e4||'社会时代机遇', E5=domWords.e5||'个人经营主观能动性';
  const E3full=domWords.e3f||('③ '+E3), E4full=domWords.e4f||('④ '+E4), E5full=domWords.e5f||('⑤ '+E5);
  const nextSec=function(seg, kw){ const i=seg.indexOf(kw); if(i<0) return ''; const rest=seg.slice(i+kw.length); const stops=['④ ','⑤ ','① ','② ','③ ','五者齐备']; let end=rest.length; for(const st of stops){ const j=rest.indexOf(st); if(j>0&&j<end) end=Math.min(end,j); } return rest.slice(0,end); };
  addE(E3, '外部', nextSec(segT, E3full));
  addE(E4, '外部', nextSec(segT, E4full));
  addE(E5, '内在', nextSec(segT, E5full));
  const wuz=cut(segT,'五者齐备','相同八字').split(/[。；]/)[0].replace(/。?$/,'');
  const zx=cut(segT,domWords.orient,'相同八字').replace(/。$/,'').trim();
  let total='';
  if(domWords.orientText) total=domWords.orientText;
  else total=[wuz, zx].filter(Boolean).join('。');
  if(total) rows.push([domWords.orientL||'总取向', '', cleanNar(total)]);
  rows.forEach(r=>{ if(r[2]&&typeof r[2]==='string') r[2]=sentBR(r[2]); });
  let html=sec(title, rows, ['维度','层级','说明'], 0, 'stab-a3');
  if(domWords.sameNote) html+=note(domWords.sameNote);
  return html;
}
/* 计数表述归一：把"比劫2个""命局3个""印星1个透干"等个数说法转为存在判断（能量以能量分判，不数个数） */
function stripGeShu(s){
  return String(s==null?'':s)
    .replace(/命局\d+个[、，,；;]?/g,'')
    .replace(/([一-龥]{1,4})\d+个[，,、]?/g,'$1现，')
    .replace(/[，,、]?\d+个[，,、]?/g,'')
    .replace(/[，,、]{2,}/g,'，');
}
/* 单元格收尾：去尾随圈序号（②③④…）、补齐失衡全角括号（cutYunTail 剥"、待岁运引出"会留孤儿"（"） */
function cleanCell(s){
  let t=String(s==null?'':s);
  t=t.replace(/^[①②③④⑤⑥⑦⑧⑨⑩]+/,'').replace(/[①②③④⑤⑥⑦⑧⑨⑩]+$/,'').trim();
  // 补齐{开多闭}的全角括号（营养强括号内被剥闭符）
  let openCount=(t.match(/（/g)||[]).length, closeCount=(t.match(/）/g)||[]).length;
  if(openCount>closeCount) t+='）'.repeat(openCount-closeCount);

/* 短标签列（首列）宽度/换行方案：按【本列最长词字数】决定。
 *   最长 ≤3 字（日主/祖辈宫/红艳煞…）：整列 nowrap 整词单行，列宽 auto（=最长词宽）→ 绝不单字孤行。

function layoutYitiTables(root){
  if(!root) return;

  const isMob = window.innerWidth <= 760;

    Array.from(t.querySelectorAll('tr')).forEach(tr=>{

/* 列宽对齐（alignLblCols）：把同组表格的对应列设成同宽，保证视觉整齐。
 *   组2 ::stab-a2 第2列 → 古籍断语"出处"列，按内容量取整条单行宽，上限取可用宽一半
 *   组1 ::stab-a1 首列 → 以命局断事(stab-ds)"项目"列为基准，对齐 事业十神"十神"、身心基调"项目"首列（仅桌面）
 *   组3 ::stab-a3 第1、2列 → 以第一张(事业)"维度/层级"列为基准，对齐其他卡层级"维度/层级"列（仅桌面）
 * 响应式(≤760px)下组1/组3不写列宽，交还 CSS 自适应（清掉桌面端残留的 inline 宽度）。 */
function alignLblCols(root){
  root = root || document;
  const isResp = window.innerWidth <= 760;
  const clearCol = (t, idxs) => { t.querySelectorAll('tr').forEach(r=>{ idxs.forEach(i=>{ const c=r.cells&&r.cells[i]; if(c){ c.style.removeProperty('width'); c.style.removeProperty('min-width'); c.style.removeProperty('max-width'); } }); }); };
  const applyW = (c, colW) => { if(!c||!colW||colW<=0) return; c.style.setProperty('width', colW+'px','important'); c.style.setProperty('min-width', colW+'px','important'); c.style.setProperty('max-width', colW+'px','important'); };
  const firstCellW = t => { const h=t.querySelector('tr:first-child>th:first-child'); if(h&&h.offsetWidth>0) return h.offsetWidth; const tr=t.querySelector('tr'); if(tr&&tr.cells&&tr.cells[0]) return tr.cells[0].offsetWidth; return 0; };
  /* 量某表指定列"整条不折行"的自然渲染宽（含左右 padding/border 与 2px 余量）。
     探测 span 挂 body（挂表格内 absolute 会塌陷为 0 宽），字体逐属性复制（禁 font shorthand）。 */
  const measureCol = (t, idx) => {
    const ref = t.querySelector('tr > td:nth-child(' + (idx+1) + ')') || t.querySelector('tr > th:nth-child(' + (idx+1) + ')');
    if(!ref) return 0;
    const cs = window.getComputedStyle(ref);
    const probe = document.createElement('span');
    probe.style.cssText = 'position:absolute;visibility:hidden;left:-99999px;top:-99999px;white-space:nowrap;'
      + 'font-family:' + cs.fontFamily + ';'
      + 'font-size:' + cs.fontSize + ';'
      + 'font-weight:' + cs.fontWeight + ';'
      + 'letter-spacing:' + (cs.letterSpacing || 'normal') + ';';
    document.body.appendChild(probe);
    let textW = 1;
    t.querySelectorAll('tr').forEach(r=>{
      const c = r.cells && r.cells[idx]; if(!c) return;
      const s = (c.textContent || '').trim(); if(!s) return;
      probe.textContent = s;
      const w = probe.getBoundingClientRect().width;
      if(w > textW) textW = w;
    });
    document.body.removeChild(probe);
    const padSum = (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0)
                 + (parseFloat(cs.borderLeftWidth)||0) + (parseFloat(cs.borderRightWidth)||0);
    return Math.ceil(textW + padSum + 2);
  };
  // 响应式：先清掉桌面端写入的首列/次列内联宽度，交还 CSS 自适应（组1/组3 在响应式下不写宽）
  if(isResp) root.querySelectorAll('table.stab').forEach(t=>clearCol(t,[0,1]));
  // 组2：古籍断语出处列(第2列)。出处列按内容量取整条单行宽，上限取可用宽一半，
  //   使断语列在窄屏下保有主体宽度；断语列占余宽随文折行。各表独立量取。
  root.querySelectorAll('table.stab-a2').forEach(t=>{
    const host = (t.parentNode && t.parentNode.clientWidth > 0) ? t.parentNode : t;
    let avail = host.clientWidth || 0;
    // 模块默认折叠，表所在的 .mod-body 为 display:none 量不到宽；取最近的可见祖先（折叠态下即模块本身）宽度作容器宽
    for(let p = t.parentElement; p && !avail; p = p.parentElement) avail = p.clientWidth || 0;
    if(!avail) return;
    const w2 = measureCol(t, 1);
    if(w2 <= 0) return;
    const colW = Math.min(w2, Math.round(avail * 0.5));
    t.querySelectorAll('tr').forEach(r=>{ if(r.cells&&r.cells[1]) applyW(r.cells[1], colW); });
  });
  // 响应式下组1/组3 不写宽，交还 CSS 自适应
  if(isResp) return;
  // 组1：stab-ds 首列 → 全部 stab-a1 首列
  const ds = root.querySelector('table.stab-ds');
  if(ds){ const bw = firstCellW(ds); if(bw>0) root.querySelectorAll('table.stab-a1').forEach(t=>{ t.querySelectorAll('tr').forEach(r=>{ if(r.cells&&r.cells[0]) applyW(r.cells[0],bw); }); }); }
  // 组3：第一张 stab-a3 第1、2列 → 其余 stab-a3 第1、2列
  const a3 = root.querySelectorAll('table.stab-a3');
  if(a3.length){ const ref = a3[0]; clearCol(ref,[0,1]);
    const bw1=(()=>{const h=ref.querySelector('tr:first-child>th:nth-child(1)'); return (h&&h.offsetWidth>0)?h.offsetWidth:0;})();
    const bw2=(()=>{const h=ref.querySelector('tr:first-child>th:nth-child(2)'); return (h&&h.offsetWidth>0)?h.offsetWidth:0;})();
    if(bw1>0||bw2>0) a3.forEach(t=>{ if(t===ref) return; t.querySelectorAll('tr').forEach(r=>{
      if(r.cells&&r.cells[0]&&bw1>0) applyW(r.cells[0],bw1);
      if(r.cells&&r.cells[1]&&bw2>0) applyW(r.cells[1],bw2);
    }); }); }
}

/* 响应式重算：窗口缩放时先重分配首列 class（layoutYitiTables），再对齐基准列宽（alignLblCols） */
(function(){
  if(window._alignYitiBound) return; window._alignYitiBound = true;
  var _t=null;
  window.addEventListener('resize', ()=>{
    clearTimeout(_t);
    _t = setTimeout(()=>{
      try{
        const sec=document.getElementById('mod-yiti');
        if(typeof layoutYitiTables==='function') layoutYitiTables(sec||document);
        if(typeof alignLblCols==='function') alignLblCols(document);
      }catch(e){}
    }, 150);
  });
})();
function render(BZ, txt, err){
  const el=document.getElementById('proto');
  if(!BZ){ el.innerHTML='<div class="subnote">'+(err||'未排盘')+'</div>'; return; }
  const A=getAnalysis(BZ), eS=wxElementScore(BZ);
  const isMale=(BZ.sex===1||BZ.sex==='男');
  const cards={
    career:segCard(txt,'事业财运','婚姻感情'),
    marry:segCard(txt,'婚姻感情','性格健康'),
    health:segCard(txt,'性格健康','家庭子女'),
    family:segCard(txt,'家庭子女','宜忌选择')
  };
  let h='';
  if(err) h+='<div class="subnote err">排盘提示：'+esc(err)+'</div>';
  const dw=GAN_WX[BZ.dayGan];
  /* ---- 一、事业财运：7 张表（对应7章节） ---- */
  h+='<h3 class="m-h">一、事业财运</h3>'+renderCareer7(cards.career,BZ,A,eS,isMale);
    /* ---- 二、婚姻感情 / 三、性格健康 / 四、家庭子女：按事业逻辑（章节.子表 + sub-note 补充） ---- */
  h+='<h3 class="m-h">二、婚姻感情</h3>'+renderMarry7(cards.marry,BZ,A,eS,isMale);
  h+='<h3 class="m-h">三、性格健康</h3>'+renderHealth7(cards.health,BZ,A,eS,isMale);
  h+='<h3 class="m-h">四、家庭子女</h3>'+renderFamily7(cards.family,BZ,A,eS,isMale);
el.innerHTML=h;
}
