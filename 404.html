<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: http: blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self';">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面未寻见 玄机排盘</title>
<meta name="robots" content="noindex">
<link id="nf-font" rel="stylesheet" href="assets/fonts/noto-serif-sc.css?v=20260913a1">
<link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg?v=20260914c">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf9f6;font-family:"Noto Serif SC",serif;color:#1a1a1a}
  .nf{position:relative;width:min(640px,88vw);border:3px solid #1a1a1a;padding:60px 40px 54px;text-align:center}
  .nf::after{content:"";position:absolute;inset:6px;border:1px solid rgba(26,26,26,.5);pointer-events:none}
  .nf-seal{width:88px;height:88px}
  .nf-code{margin:26px 0 0;font-size:92px;font-weight:700;letter-spacing:.12em;line-height:1.1}
  .nf-rule{width:64px;height:4px;background:#b84a3a;margin:28px auto}
  .nf-text{margin:0;font-size:19px;color:#52525a;letter-spacing:.1em}
  .nf-home{display:inline-block;margin-top:32px;padding:10px 36px;border:1.5px solid #1a1a1a;color:#1a1a1a;text-decoration:none;font-size:18px;letter-spacing:.28em;transition:border-color .2s,color .2s}
  .nf-home:hover{border-color:#b84a3a;color:#b84a3a}
  @media (max-width:480px){.nf-code{font-size:72px}.nf-text{font-size:17px}}
  @media (prefers-color-scheme:dark){
    body{background:#17171a;color:#e6e1d6}
    .nf{border-color:#e6e1d6}
    .nf::after{border-color:rgba(230,225,214,.5)}
    .nf-text{color:#a39e93}
    .nf-home{border-color:#e6e1d6;color:#e6e1d6}
    .nf-home:hover{border-color:#c65a48;color:#c65a48}
  }
</style>
</head>
<body>
  <main class="nf">
    <img id="nf-seal" class="nf-seal" src="assets/logo/xuanji-seal.svg" alt="玄机排盘">
    <div class="nf-code">四〇四</div>
    <div class="nf-rule"></div>
    <p class="nf-text">此页未载于玄机　或已迁易其处</p>
    <a id="nf-home" class="nf-home" href="index.html">回到首页</a>
  </main>
  <script>
  /* 深层路径下的 404（如 /a/b）相对资源会落空：按实际路径前缀重写首页链接、印章与字体表 */
  (function () {
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return;
    var dir = location.pathname.slice(0, location.pathname.lastIndexOf('/') + 1);
    document.getElementById('nf-home').href = dir + 'index.html';
    document.getElementById('nf-seal').src = dir + 'assets/logo/xuanji-seal.svg';
    document.getElementById('nf-font').href = dir + 'assets/fonts/noto-serif-sc.css?v=20260913a1';
  })();
  </script>
</body>
</html>
