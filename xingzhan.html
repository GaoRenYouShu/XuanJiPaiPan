<script>
renderChrome('xingzhan.html');
let __xz = '';
/* 出生地三级联动：provList/PROV/distList 由 latlng.js 提供，坐标单源禁止本页自维护。
   bindPlace('xz') 绑本命行，bindPlace('xzB') 绑第二人合盘行（#1180） */
function xzBindPlace(pre){
  const sp=document.getElementById(pre+'Prov'),sc=document.getElementById(pre+'City'),sd=document.getElementById(pre+'Dist');
  sp.innerHTML=provList().map(p=>`<option value="${p}">${p}</option>`).join('');
  function fillCity(){ sc.innerHTML=PROV[sp.value].map(c=>`<option value="${c.c}">${c.c}</option>`).join(''); fillDist(); }
  function fillDist(){
    const c=PROV[sp.value].find(x=>x.c===sc.value)||PROV[sp.value][0];
    if(!c) return;
    let html=`<option value="">${c.c}</option>`;
    distList(sp.value,c.c).forEach(k=> html+=`<option value="${k}">${k}</option>`);
    sd.innerHTML=html;
  }
  sp.onchange=fillCity; sc.onchange=fillDist;
  sp.value='北京市'; fillCity();
}
xzBindPlace('xz'); xzBindPlace('xzB');
/* 手动经纬度宽容解析：接受十进制、度分（°′）、度分秒、W/E/S/N 与中文“西经/东经/南纬/北纬”
   前缀等多种写法。返回 {v, ok, bad}：ok 时 v 为十进制度（负=西经/南纬）；
   有内容但无法解析时 ok=false、bad=原文（供警示），空串返回 {ok:null}。
   度分混合写法（如 -74°30′ 折算 -74.5）按“最后一段是分、再有第三段是秒”的顺序折算。 */
function xzCoordParse(s, isLat){
  if(s == null || s.trim() === '') return {ok: null};
  /* 归一化：全角句点与 Unicode 减号（−）转 ASCII，兼容粘贴文本 */
  const str = s.trim().replace(/．/g, '.').replace(/[−–—]/g, '-');
  const nums = (str.match(/-?\d+(?:\.\d+)?/g) || []).map(Number);
  /* 半球前缀：西经（W）与南纬（S）强制负，东经（E）与北纬（N）强制正，按经/纬取对应字母 */
  const hemiW = isLat ? (/S/i.test(str) || str.includes('南')) : (/W/i.test(str) || str.includes('西'));
  const hemiE = isLat ? (/N/i.test(str) || str.includes('北')) : (/E/i.test(str) || str.includes('东'));
  if(!nums.length){ return {ok: false, bad: s}; }
  let v = 0;
  const abs = nums.map(n => Math.abs(n));
  if(nums.length === 1){
    v = nums[0] < 0 ? -abs[0] : abs[0];
  } else {
    /* 度分/度分秒折算：符号取第一段的符号；-74°30′ → -(74+30/60) */
    v = abs[0] + (abs[1] || 0) / 60 + (abs[2] || 0) / 3600;
    if(nums[0] < 0) v = -v;
  }
  /* 半球前缀强制覆盖符号（带 W/S 时正数也按西/南处理；带 E/N 时负号视为笔误纠正为正） */
  if(hemiW) v = -Math.abs(v);
  else if(hemiE) v = Math.abs(v);
  const lim = isLat ? 90 : 180;
  if(!Number.isFinite(v) || Math.abs(v) > lim){ return {ok: false, bad: s}; }
  return {ok: true, v: Math.round(v * 10000) / 10000};
}
/* 境外手填经纬度的健壮性提示与核对回显：
   半填（另一项回退出生地成混合坐标）、无效输入（非数字或超出经度±180/纬度±90，已忽略并回退）、
   疑似境外经度（中国范围约东经73°–135°之外）而时区仍为默认 UTC+8 时提醒核对；
   手动经纬完整生效时回显半球标注（东经/西经、北纬/南纬），供用户核对正负号是否填反 */
function xzCoordWarn(lonV, latV, lon, lat, tz, place, bads){
  const parts = [];
  const bads2 = (bads || []).filter(x => x != null);
  if(bads2.length) parts.push(`手动经纬度“${bads2.join('”“')}”无效（经度范围-180~180、纬度范围-90~90），已忽略并按出生地取数`);
  if((lonV !== '') !== (latV !== '')){
    parts.push(`手动经纬度仅填写了${lonV !== '' ? '经度' : '纬度'}，另一项按出生地${place ? '（' + place + '）' : ''}取数，坐标为混合来源，上升与宫位将因此偏移，请补全或清空重填`);
  }
  if(tz === 8 && (lon < 73 || lon > 135)){
    parts.push('手动经度在中国范围（约东经73°–135°）之外，疑似境外出生而时区仍为UTC+8，请把时区改为出生地当地时间，否则行星落座与上升将整体偏移');
  }
  let hint = '';
  if(lonV !== '' && latV !== '' && !bads2.length){
    hint = `<div class="sub-note">手动坐标已生效：${lon >= 0 ? '东经' + lon.toFixed(2) + '°' : '西经' + (-lon).toFixed(2) + '°'}、${lat >= 0 ? '北纬' + lat.toFixed(2) + '°' : '南纬' + (-lat).toFixed(2) + '°'}（西经、南纬以负数表示，请核对是否填反）</div>`;
  }
  return hint + (parts.length ? `<div class="sub-note xz-warn">⚠ ${parts.join('；')}。</div>` : '');
}
/* 当前年龄（按出生时刻精确到年，供大运与副运定位）；出生时刻在今天尚未到达时钳为 0，防负岁数令小限轮转出第 0 宫 */
function xzAgeNow(dt){
  const now = new Date();
  const born = new Date(dt.y, dt.m - 1, dt.d, dt.hh, dt.mm);
  return Math.max(0, (now - born) / (365.25 * 24 * 3600 * 1000));
}
/* 年龄区间数字格式化：整数去小数、带小数统一保留一位，使各运表年龄列位数一致 */
function xzAgeTxt(n){
  return Number.isInteger(n) ? String(n) : n.toFixed(1);
}
function renderWheel(chart){
  /* 盘面半径留出外圈标注带：上升标记落在圆盘之外，不与宫号同带相挤 */
  const cx = 180, cy = 180, R = 152;
  const asc = chart.asc.lon;
  /* 宫线屏幕角（自顶端顺时针，ASC 恒在 9 点即 270°）：整宫制宫头=ASC 星座边界，Placidus=分宫头 */
  const lineA = chart.cusps.map(c => ((c - asc + 270) % 360 + 360) % 360);
  const pt = (angDeg, rr) => { const a = angDeg * XZ_DEG; return {x: cx + rr * Math.sin(a), y: cy - rr * Math.cos(a)}; };
  let s = `<svg class="xz-wheel" viewBox="0 0 360 360" role="img" aria-label="星盘">`;
  s += `<circle class="ring" cx="${cx}" cy="${cy}" r="${R}"/>`;
  s += `<circle class="ring2" cx="${cx}" cy="${cy}" r="${R*0.82}"/>`;
  s += `<circle class="ring2" cx="${cx}" cy="${cy}" r="${R*0.46}"/>`;
  /* 宫线 + 宫号/宫头星座/星体（按第 h 宫两宫线夹角的屏幕中点定位，宫宽不恒 30°）
     🔴 全盘文字一律正立不加 transform：西洋盘是盘转字不转，ASC 恒锚 9 点，整条黄道随出生
     时刻地点转，第几宫落在哪个屏幕方位是随盘变的，不比二十八宿、十二时辰各有固有方位语义，
     故不适用全站最外圈环布 WHEEL.ring 那条口径；且象限宫位制下宫宽自几度至三百余度不等，
     环布会使相邻宫号歪斜不一、窄宫处挤作一堆。行业实现同此：kerykeion 画宫号明写 keep text
     upright 并以 rotate(-mid) rotate(90+mid) 反向抵消，hew/astrology-chart-wheel 全文件零 rotate。
     详见规则档第七条取字法段的西洋占星盘例外，勿按环布口径改回去。 */
  for(let h = 1; h <= 12; h++){
    const c = pt(lineA[h - 1], R);
    const cls = (h === 1) ? 'asc' : '';
    s += `<line class="${cls}" x1="${cx}" y1="${cy}" x2="${c.x.toFixed(1)}" y2="${c.y.toFixed(1)}"/>`;
    let nxt = lineA[h % 12];
    if(nxt <= lineA[h - 1]) nxt += 360;
    const mid = (lineA[h - 1] + nxt) / 2;
    const hn = pt(mid, R * 0.925);
    const sg = pt(mid, R * 0.75);
    const cuspSignIdx = XZ_SIGNS.indexOf(xz_cuspSign(chart, h));
    s += `<text class="hnum" x="${hn.x.toFixed(1)}" y="${(hn.y+3).toFixed(1)}" text-anchor="middle">${h}</text>`;
    s += `<text class="sgn" x="${sg.x.toFixed(1)}" y="${(sg.y+5).toFixed(1)}" text-anchor="middle">${XZ_SIGN_GLYPH[cuspSignIdx]}</text>`;
    // 该宫星体
    const inHouse = XZ_PLANETS.filter(p => chart.planets[p.key].house === h);
    inHouse.forEach((p, i) => {
      const pr = R * (0.565 - i * 0.15);
      const pp = pt(mid, pr);
      s += `<text class="pl" x="${pp.x.toFixed(1)}" y="${(pp.y+4).toFixed(1)}" text-anchor="middle">${p.glyph}</text>`;
    });
  }
  // ASC 标记（固定 9 点方向，落在圆盘左外侧）
  s += `<text class="asc-t" x="${(cx - R - 6).toFixed(1)}" y="${(cy + 4).toFixed(1)}" text-anchor="end">ASC</text>`;
  s += `</svg>`;
  return s;
}
/* =================== 黄道落星盘 ===================
   “星体落入十二星座”一类表一律上盘：黄道十二星座是天然成环的序数，星体按黄经落位，
   盘面只承担序数与吉凶二值两类（规则档第七条“量值型数据怎么上盘”）。
   骨架照“两字外圈”体系：盘心 220、弧 188、外圈线 179、刻度 171 至 177、环名 206、
   盘心 78、指针 82 至 100、热区 104 至 194。
   🔴 内界圈由 120 收到 104、内签拆成 160 与 138 与 116 三圈：十星常有三颗并落一处窄角域，
   字高 18.7 的三行相邻行心须相距 22（斜向时方框沿轴向的投影短于径向距离，20 会在四隅相碰），
   120 至刻度内沿 171 的 51 单位只容得下两行，装不下才按“只把内界圈往里挪”这条口径内挪，
   外圈线 179、外签 206、弧 188、刻度 171 至 177、盘心 78 五处一律照骨架不动。
   全盘文字恒正立，不套 WHEEL.ring 与 WHEEL.radial：西洋盘是盘转字不转，星座名与星体符号
   皆无固有方位语义（规则档第七条西洋占星盘例外），各字只按位置角取 x 与 y。
   星体按各自黄经定角，落在同一窄角域者按半径错开一档，故相邻两星不叠作一团。 */
const XZW_C = 220, XZW_STEP = 30, XZW_ARC = 188, XZW_OUT = 179,
  XZW_TICK0 = 171, XZW_TICK1 = 177, XZW_LAB_OUT = 206, XZW_IN = 104,
  XZW_LAB_IN = [160, 138, 116], XZW_CORE = 78,
  XZW_P0 = 82, XZW_P1 = 100, XZW_HIT1 = XZW_ARC + 6;
const XZW_STATE = {};
/* 九曜单字：印度两盘内圈取七曜加罗计的传统单字简称，全名留给盘下详情条 */
const XZ_NAV_MARK = {sun:'日', moon:'月', mars:'火', mercury:'水', jupiter:'木', venus:'金', saturn:'土', rahu:'罗', ketu:'计'};
function xzWheelMid(i){ return i * XZW_STEP + XZW_STEP / 2; }
function xzWheelSign(lon){ return Math.floor(xz_norm360(lon) / XZW_STEP) % 12; }
/* 两黄经的角距，跨 0 度处按绕圈的短弧取 */
function xzWheelGap(a, b){
  const d = Math.abs(xz_norm360(a) - xz_norm360(b));
  return Math.min(d, 360 - d);
}
/* 吉凶二值色：庙旺本垣归吉、弱陷归凶，中性档不着色。吉凶是全站语义二值，不引第三支色相 */
function xzWheelFill(level){
  if(level === '庙' || level === '旺' || level === '本垣' || level === '本垣强位') return 'var(--wheel-good)';
  if(level === '弱' || level === '落' || level === '陷') return 'var(--wheel-bad)';
  return '';
}
function xzWheelCls(level){
  const f = xzWheelFill(level);
  return f ? (f.indexOf('good') >= 0 ? 'wd-g' : 'wd-x') : '';
}
function xzWheelBuild(id, items, sel, detail, alt){
  const inSign = function(i){ return items.filter(function(t){ return xzWheelSign(t.lon) === i; }); };
  const core = function(i){
    const list = inSign(i);
    return [XZ_SIGNS[i] + XZ_SIGN_GLYPH[i],
      list.length ? list.map(function(t){ return t.glyph; }).join(' ') : (alt ? alt(i) : '无星体'),
      XZ_SIGN_EL[i] + '象、' + XZ_SIGN_RULER[XZ_SIGNS[i]] + '主'];
  };
  let s = '';
  for(let i = 0; i < 12; i++) s += `<path d="${WHEEL.arc(XZW_ARC, i * XZW_STEP, (i + 1) * XZW_STEP)}" class="w-arc"/>`;
  for(let i = 0; i < 12; i++){
    const a = WHEEL.px(XZW_TICK0, xzWheelMid(i)), b = WHEEL.px(XZW_TICK1, xzWheelMid(i));

  }
  for(let i = 0; i < 12; i++){

    s += `<path d="${d}" class="w-hit${i === sel ? ' is-on' : ''}" data-i="${i}" onclick="xzWheelPick('${id}',${i})"/>`
      + `<path d="${d}" class="w-sel"/>`;
  }
  s += `<path id="${id}Arc" d="${WHEEL.arc(XZW_ARC, sel * XZW_STEP, (sel + 1) * XZW_STEP)}" class="w-arc w-arc-cur"/>`;
  for(let i = 0; i < 12; i++){
    const p = WHEEL.px(XZW_LAB_OUT, xzWheelMid(i));
    s += `<text x="${WHEEL.n(p[0])}" y="${WHEEL.n(p[1])}" class="w-lab w-lab-xl${i === sel ? ' w-lab-cur' : ''}" data-i="${i}">${XZ_SIGNS[i]}</text>`;
  }
  const used = [];
  items.forEach(function(it){
    const lon = xz_norm360(it.lon), si = Math.floor(lon / XZW_STEP) % 12;
    /* 落在同一窄角域的星体按半径错开：取本行内已有星体中角距最大的那一行，错不开时留最宽的一行 */
    const rr = XZW_LAB_IN.map(function(r){

        .reduce(function(m, u){ return Math.min(m, xzWheelGap(u.lon, lon)); }, 999)};
    }).sort(function(a, b){ return b.near - a.near; })[0].r;
    used.push({r: rr, lon: lon});
    const p = WHEEL.px(rr, lon), fl = xzWheelFill(it.level);

  });

  s += `<circle cx="${XZW_C}" cy="${XZW_C}" r="${XZW_IN}" class="w-ring"/>`;
  s += `<circle cx="${XZW_C}" cy="${XZW_C}" r="${XZW_CORE}" class="w-core"/>`;
  const q0 = WHEEL.px(XZW_P0, xzWheelMid(sel)), q1 = WHEEL.px(XZW_P1, xzWheelMid(sel));
  s += `<line id="${id}Needle" x1="${WHEEL.n(q0[0])}" y1="${WHEEL.n(q0[1])}" x2="${WHEEL.n(q1[0])}" y2="${WHEEL.n(q1[1])}" class="w-needle"/>`;
  s += `<circle id="${id}Dot" cx="${WHEEL.n(q1[0])}" cy="${WHEEL.n(q1[1])}" r="3.5" class="w-dot"/>`;
  const c = core(sel);
  s += `<text x="${XZW_C}" y="${XZW_C - 16}" class="w-c1" id="${id}C1">${c[0]}</text>`;
  s += `<text x="${XZW_C}" y="${XZW_C + 14}" class="w-c2" id="${id}C2">${c[1]}</text>`;
  s += `<text x="${XZW_C}" y="${XZW_C + 34}" class="w-c3" id="${id}C3">${c[2]}</text>`;
  XZW_STATE[id] = {sel: sel, core: core, detail: detail};
  return `<svg class="wheel" id="${id}" viewBox="0 0 440 440" role="img" aria-label="黄道落星盘">${s}</svg>`;

/* 综合解读：基于宫主星、落座、相位与庙旺，逐键值行输出具体事实与指向 */
function buildSynthesis(chart){
  const ai = chart.ascSignIdx;
  function houseSign(h){ return xz_cuspSign(chart, h); }
  function rulerOf(sign){ return XZ_SIGN_RULER[sign]; }
  function pl(name){ return chart.planets[XZ_PLANETS.find(p => p.name === name).key]; }
  function plInHouse(h){
    return XZ_PLANETS.filter(p => chart.planets[p.key].house === h)
      .map(p => `${p.name}（${chart.planets[p.key].signT}${chart.planets[p.key].dignity === '平' ? '' : ' '+chart.planets[p.key].dignity}）`);
  }
  function aspectsOf(key){
    return chart.aspects.filter(a => a.a === key || a.b === key)
      .map(a => {

/* 日期加 n 天（纯日历算术，规避 Date 对 1-99 年的映射 bug） */
function xzDaysFromCivil(y, m, d){
  y -= m <= 2 ? 1 : 0;
  const era = Math.floor(y / 400);
  const yoe = y - era * 400;
  const mp = (m + 9) % 12;
  const doy = Math.floor((153 * mp + 2) / 5) + d - 1;
  const doe = yoe * 365 + Math.floor(yoe / 4) - Math.floor(yoe / 100) + doy;
  return era * 146097 + doe - 719468;
}
function xzCivilFromDays(z){
  z += 719468;
  const era = Math.floor(z / 146097);
  const doe = z - era * 146097;
  const yoe = Math.floor((doe - Math.floor(doe / 1460) + Math.floor(doe / 36524) - Math.floor(doe / 146096)) / 365);
  const y = yoe + era * 400;
  const doy = doe - (365 * yoe + Math.floor(yoe / 4) - Math.floor(yoe / 100));
  const mp = Math.floor((5 * doy + 2) / 153);
  const d = doy - Math.floor((153 * mp + 2) / 5) + 1;
  const m = mp < 10 ? mp + 3 : mp - 9;
  return {y: y + (m <= 2 ? 1 : 0), m, d};
}
function xzAddDays(y, m, d, n){ return xzCivilFromDays(xzDaysFromCivil(y, m, d) + n); }
function xzYmdStr(y, m, d){ return y + '-' + String(m).padStart(2, '0') + '-' + String(d).padStart(2, '0'); }
function xzTodayYmd(){

}

function xzTrTimelineHtml(chart){

  const evs = xz_slowTransitScan(chart, jdStart, 365);
  if(!evs.length) return '<p class="sub-note">未来一年内木星及以上外行星与本命敏感点无主要相位精确日（外行星行运节奏慢，属常态），可回看行运快照观察当下落宫。</p>';
  const rows = evs.map(e => {

    if(e.kind === 'phase'){

/* 基本盘对照：双方三要素与太阳星座档案并排，先立两人骨架再看互动 */
function xzRelBasicBlk(chartA, chartB){
  const sA = chartA.planets.sun, sB = chartB.planets.sun, mA = chartA.planets.moon, mB = chartB.planets.moon;
  const ascA = XZ_SIGNS[chartA.ascSignIdx], ascB = XZ_SIGNS[chartB.ascSignIdx];

    + `<tr><td>↑ 上升（外在气质）</td><td>${cell(ascA, chartA.asc.lon % 30)}</td><td>${cell(ascB, chartB.asc.lon % 30)}</td></tr>`

  const sameSign = (a, b) => a === b;
  const sunTxt = sameSign(sA.signT, sB.signT) ? `双方太阳同落${sA.signT}座，自我意志完全同频`
    : el(sA.signT) === el(sB.signT) ? `太阳${sA.signT}座对${sB.signT}座，同属${el(sA.signT)}象，价值观底色相通`
    : `太阳${sA.signT}座（${el(sA.signT)}象）对${sB.signT}座（${el(sB.signT)}象），内核气质两路`;
  const moonTxt = sameSign(mA.signT, mB.signT) ? `月亮同落${mA.signT}座，情绪节奏一致`
    : el(mA.signT) === el(mB.signT) ? `月亮${mA.signT}座对${mB.signT}座，同属${el(mA.signT)}象，情绪反应方式相近`
    : `月亮${mA.signT}座（${el(mA.signT)}象）对${mB.signT}座（${el(mB.signT)}象），情绪节奏不同须互留余地`;
  const ascTxt = sameSign(ascA, ascB) ? `上升同落${ascA}座，初见气场如出一辙`
    : `上升${ascA}座对${ascB}座，外在气质互为补色`;
  const reson = `<p class="sub-note">${sunTxt}，${moonTxt}，${ascTxt}。</p>`;
  const prA = XZ_SIGN_PROFILE[sA.signT], prB = XZ_SIGN_PROFILE[sB.signT];
  const signLine = s => { const i = XZ_SIGNS.indexOf(s); return `${s}（${XZ_SIGN_EN[i]}）${XZ_SIGN_EL[i]}象、${XZ_SIGN_MODAL[i]}宫、${XZ_SIGN_POLAR[i]}性`; };
  const profTbl = `<div class="xz-tbl-wrap"><table class="xz-tbl xz-trtbl"><thead><tr><th>太阳星座档案</th><th>第一人</th><th>第二人</th></tr></thead><tbody>`
    + `<tr><td>太阳星座</td><td class="xz-1ln"><b>${signLine(sA.signT)}</b></td><td class="xz-1ln"><b>${signLine(sB.signT)}</b></td></tr>`
    + `<tr><td>守护星</td><td>${prA.ruler}</td><td>${prB.ruler}</td></tr>`
    + `<tr><td>恋爱倾向</td><td>${prA.love}</td><td>${prB.love}</td></tr>`
    + `<tr><td>事业倾向</td><td>${prA.work}</td><td>${prB.work}</td></tr>`
    + `<tr><td>财运倾向</td><td>${prA.money}</td><td>${prB.money}</td></tr>`
    + `<tr><td>最佳配对</td><td>${prA.best}</td><td>${prB.best}</td></tr>`
    + `<tr><td>挑战配对</td><td>${prA.hard}</td><td>${prB.hard}</td></tr>`
    + `</tbody></table></div>`;
  const aInBest = prB.best.split('、').includes(sA.signT);
  const bInBest = prA.best.split('、').includes(sB.signT);
  const aInHard = prB.hard.split('、').includes(sA.signT);
  const bInHard = prA.hard.split('、').includes(sB.signT);
  const parts = [];

  if(aInBest) parts.push('第一人太阳落第二人最佳配对之列');
  if(bInHard) parts.push('第二人太阳在第一人挑战配对之列');
  if(aInHard) parts.push('第一人太阳在第二人挑战配对之列');
  const pairTxt = (parts.length ? parts.join('，') : '双方均不在对方通行最佳或挑战配对之列')
    + '；速览配对仅依太阳星座通识，实际契合以下方交叉相位与宫位互落为准';
  return triTbl + reson + profTbl + `<p class="sub-note">配对互参：${pairTxt}</p>`;
}

    '轴点宿命': '宿命连线少：关系推进靠自觉经营，重要时机节点须主动把握。',
    '整体相位基调': '把紧张相位对应的差异议题逐条列明协商，避免笼统互相归咎。',
    '组合盘三柱': '组合盘目标与情绪有分歧：定期对齐共同目标，关系实体需要"共同日程"来养。',

  if(H.length){ rows.push('<tr class="hh-adv-sec"><td colspan="2">亮点</td></tr>'); H.forEach(it => rows.push(`<tr><th><span class="hh-adv-pill hh-adv-pill-g">${it[0]}</span></th><td>${HHL[it[0]] || it[3]}</td></tr>`)); }
  if(W.length){ rows.push('<tr class="hh-adv-sec"><td colspan="2">短板</td></tr>'); W.forEach(it => rows.push(`<tr><th><span class="hh-adv-pill hh-adv-pill-d">${it[0]}</span></th><td>${it[3]}</td></tr>`)); }

/* 匹配度总评：综合分盒加七维核心与专项分析两段评分条，机制与八字合婚页同款
   （综合分 = 七维归一×0.7 + 专项归一×0.3，评分数据真源 xz_matchFinal，样式复用全局 .hh-*） */
function xzRelMatchBlk(chartA, chartB){
  const m = xz_matchFinal(chartA, chartB);
  const WX_HEX = {'火':'#F65352','金':'#D4A017','土':'#A07040','水':'#4190FA','木':'#5DC336'};
  const barColor = r => r >= 0.8 ? WX_HEX['火'] : r >= 0.6 ? WX_HEX['金'] : r >= 0.4 ? WX_HEX['土'] : r >= 0.2 ? WX_HEX['水'] : WX_HEX['木'];
  const color = xzMatchColor(m.composite);
  const bar = it => {
    const pct = Math.round(it[1] / it[2] * 100);
    return `<div class="hh-item">
      <div class="hh-item-top"><span class="hh-name">${it[0]}</span><span class="hh-score">${it[1]}分（满分${it[2]}）</span></div>
      <div class="hh-bar"><div class="hh-bar-in" style="width:${pct}%;background:${barColor(it[1] / it[2])}"></div></div>
      <div class="hh-desc">${it[3]}</div>
    </div>`;
  };
  const coreRows = m.core.items.map(bar).join('');
  const specRows = m.spec.items.map(bar).join('');
  const wPct = Math.round(m.specW * 100);
  return `<div class="hh-total" style="border-color:${color};margin-top:16px">
      <div class="xz-cap-blk">双人合盘综合分（七维核心${100 - wPct}% + 专项加权${wPct}%=100）</div>
      <div class="hh-total-num" style="color:${color}">${m.composite}<span>分</span></div>
      <div class="hh-total-lv" style="color:${color}">${m.level}</div>
    </div>
    <h4>七维核心评分<span class="xz-cap">（${m.core.total}，权重 ${100 - wPct}%）</span></h4>
    <div class="hh-items">${coreRows}</div>
    <h4>专项分析<span class="xz-cap">（${m.spec.total}，满分${m.spec.max}，权重 ${wPct}%）</span></h4>
    <div class="hh-items">${specRows}</div>
    ${xzRelAdviceHtml(m)}`;
}
/* 合盘总块：第二人资料行恒显示（含手填经纬的境外出生），出生地文字在有省市区联动时附加 */
function xzRelHtml(chartA, chartB, placeB, warn){
  const bdt = chartB.dt;
  const note = `<p class="sub-note">第二人：${bdt.y}-${pad2(bdt.m)}-${pad2(bdt.d)} ${pad2(bdt.hh)}:${pad2(bdt.mm)}(UTC${chartB.tz >= 0 ? '+' : ''}${chartB.tz})${placeB ? '，' + placeB : ''}，东经${chartB.lon.toFixed(2)}° 北纬${chartB.lat.toFixed(2)}°，${chartB.sex}命；宫位制与第一人一致。</p>${warn || ''}`;
  return `<div class="xz-vedic xz-tr">
    ${note}
    ${xzRelMatchBlk(chartA, chartB)}
    <h4>基本盘对照（三要素与太阳星座档案并排）</h4>${xzRelBasicBlk(chartA, chartB)}
    <h4>Synastry 比较盘（十三敏感点互落宫位与交叉相位）</h4>${xzRelOverlayBlk(chartA, chartB)}${xzRelSynBlk(chartA, chartB)}
    <h4>Composite 组合中点盘（同名星取中点成盘）</h4>${xzRelCompositeBlk(chartA, chartB)}
    <h4>Davison 时空中点盘（出生时刻与地点双中点成盘）</h4>${xzRelDavisonBlk(chartA, chartB)}
  </div>`;
}
