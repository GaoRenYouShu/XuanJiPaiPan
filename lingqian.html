<body>
<div id="topbar"></div>
<div class="wrap page-lq">
  <div class="page">
    <h1>灵签</h1>
    <div class="lead">默念所求之事，摇筒求签，得签诗与逐项解签。</div>
    <div class="form-row">
      <div class="field"><label>签种</label><select id="lqSet"></select></div>
      <div class="field"><label>所求之事（可选）</label><input id="question" placeholder="如：问事业、问姻缘、问出行…"></div>
      <button class="btn gold" onclick="draw()">🎋 摇签求签</button>
      <button class="btn" onclick="pickNo()">指定签号</button>
    </div>
    <div id="out"></div>
  </div>
</div>
<footer id="footer"></footer>
<script src="assets/lunar.js?v=20260826a"></script>
<script src="assets/app.js?v=20260924i"></script>
<script src="assets/ai.js?v=20260924a"></script>
<script src="assets/lingqian-data.js?v=20260925a"></script>
<script>
renderChrome('lingqian.html');
const LV_CLS={'上上':'lv-ji','上上签':'lv-ji','上上大吉签':'lv-ji','大吉':'lv-ji','上吉':'lv-ji','上吉签':'lv-ji','上平签':'lv-ji','上签':'lv-ji','上':'lv-ji','中吉':'lv-ji','中上签':'lv-ji','中平':'lv-ping','中平签':'lv-ping','中签':'lv-ping','中':'lv-ping','中下':'lv-xiong','下签':'lv-xiong','下下':'lv-xiong','下吉':'lv-xiong','下':'lv-xiong'};
let LAST=null, LAST_SET=null;
function curSet(){ return LQ_SETS[document.getElementById('lqSet').value]||LQ_SETS['三山国王灵签41签']; }
function fillSet(){
  const sel=document.getElementById('lqSet');
  sel.innerHTML=Object.keys(LQ_SETS).map(k=>`<option value="${k}">${k}</option>`).join('');
}
fillSet();
/* 签诗按两句一联装箱：联内随行高，联间另行取同组档，四句读作两联 */
function shiHtml(shi){
  const lian=[];
  for(let i=0;i<shi.length;i+=2) lian.push(shi.slice(i,i+2));
  return lian.map(rows=>`<div class="lq-lian">${rows.map(l=>`<div>${l}</div>`).join('')}</div>`).join('');
}
function show(sign, setKey){
  const set=LQ_SETS[setKey]||curSet();
  const cats=Object.keys(sign.fen||{});
  const fenHtml=cats.length?`<h3 class="rel-title">逐项解签</h3><div class="lq-info">${cats.map(k=>`<div class="lq-i"><span class="k">${k}</span><span class="v">${sign.fen[k]}</span></div>`).join('')}</div>`:'';
  const guHtml=sign.gu?`<p class="lq-gu">古人典故：${sign.gu}</p>`:'';
  const lvHtml=sign.lv?`<div class="lq-lv ${LV_CLS[sign.lv]||''}">${sign.lv}</div>`:'';
  const jieHtml=sign.jie?`<h4 class="det-h">解曰</h4><div class="lq-jie">${sign.jie.split('\n').filter(p=>p.trim()).map(p=>`<p>${p}</p>`).join('')}</div>`:'';
  const dianHtml=set.dian?`<details class="lq-ref"><summary>${setKey}典故</summary><div class="lq-ref-b">${set.dian}</div></details>`:'';
  document.getElementById('out').innerHTML=`
  <div class="lq-slip">
    <div class="lq-head">
      <div class="lq-no">第 ${sign.no} 签</div>
      ${lvHtml}
    </div>
    <div class="lq-poem">${shiHtml(sign.shi)}</div>
    ${guHtml}
    ${jieHtml}
  </div>
  ${fenHtml}
  ${dianHtml}
  <p class="sub-note">※ 求签贵在诚心，一事一签，不宜反复重摇。切换签种可对比不同体系之签文。</p>`;
  LAST=sign; LAST_SET=setKey;
}
function draw(){
  const set=curSet(), key=document.getElementById('lqSet').value;
  const idx=Math.floor(Math.random()*set.signs.length);
  const box=document.getElementById('out');
  box.innerHTML='<div class="lq-shake">🎋 签筒摇动中…</div>';
  setTimeout(()=>show(set.signs[idx], key),650);
}
function pickNo(){
  const key=document.getElementById('lqSet').value, set=curSet();
  const s=prompt('请输入签号（1 - '+set.signs.length+'）：');
  if(!s)return; const n=parseInt(s,10);
  const sign=set.signs.find(x=>x.no===n);
  if(sign) show(sign, key); else alert('暂无该签号（当前收录 1-'+set.signs.length+'）');
}
const LQ_SEL_KEY='lq_set_sel';
function saveSel(){ try{ localStorage.setItem(LQ_SEL_KEY, document.getElementById('lqSet').value); }catch(e){} }
document.getElementById('lqSet').addEventListener('change',()=>{ const k=document.getElementById('lqSet').value; saveSel(); show(curSet().signs[0], k); });
(function initLq(){
  let saved='三山国王灵签41签';
  try{ const v=localStorage.getItem(LQ_SEL_KEY); if(v && LQ_SETS[v]) saved=v; }catch(e){}
  document.getElementById('lqSet').value=saved;
  show(curSet().signs[0], saved);
})();
mountAI(function(){
  if(!LAST) return '';
  const q=document.getElementById('question').value;
  let s=`${LAST_SET||'三山国王灵签41签'}\n第${LAST.no}签（${LAST.lv||'未标吉凶'}${LAST.gu?' '+LAST.gu:''}）\n签诗：${LAST.shi.join('，')}\n`;
  if(LAST.jie) s+=`解曰：${LAST.jie}\n`;
  if(LAST.fen) s+='逐项：'+Object.keys(LAST.fen).map(k=>`${k}-${LAST.fen[k]}`).join('；');
  if(q) s+=`\n所求：${q}`;
  return s;
}, '灵签');
</script>
<script>
/* 盘面分享与数据：collect 记录签种与已得签号，restore 按签号原样重出（不 recast，避免随机重抽覆盖还原结果） */
shareWait({ page:"lingqian", title:"在线灵签求签",
  collect:function(){
    if(!LAST) return {};
    return {set:LAST_SET, no:LAST.no, q:(document.getElementById('question')||{}).value||''};
  },
  restore:function(d){
    if(!d||!d.set||!d.no) return;
    const sel=document.getElementById('lqSet'); if(sel) sel.value=d.set;
    const q=document.getElementById('question'); if(q&&d.q) q.value=d.q;
    const set=LQ_SETS[d.set]; if(!set) return;
    const sign=set.signs.find(x=>x.no===d.no);
    if(sign) show(sign, d.set);
  }
});
</script>
