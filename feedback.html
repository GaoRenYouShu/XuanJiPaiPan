<div class="wrap page-fb">
<main class="page">
  <h1>反馈建议</h1>
  <p class="lead">选择工具页与模块，写下所见问题或改进建议，生成结构化文本复制发出；本页不收集任何信息。</p>
  <section class="mod" id="fbmod-write">
    <div class="mod-head" onclick="toggleMod('fbmod-write')"><span class="mod-caret">▾</span><span class="mod-title">提交反馈</span><span class="mod-sub">选页、定类型、写描述、生成并复制</span></div>
    <div class="mod-body">
      <div class="form-row">
        <div class="field"><label for="fbPage">工具页</label><select id="fbPage">
          <option value="">全站或未列之页</option>
          <optgroup label="历法"><option value="wannianli.html">万年历</option><option value="laohuangli.html">老黄历</option><option value="foli.html">佛历</option><option value="daoli.html">道历</option><option value="zangli.html">藏历</option><option value="zeri.html">择日</option><option value="huangji.html">皇极经世</option></optgroup>
          <optgroup label="命理"><option value="bazi.html">八字排盘</option><option value="hehun.html">八字合婚</option><option value="ziwei.html">紫微斗数</option><option value="heluo.html">河洛理数</option><option value="tieban.html">铁板神数</option><option value="xingming.html">姓名学</option><option value="xingzhan.html">占星术</option><option value="qizheng.html">七政四余</option></optgroup>
          <optgroup label="三式"><option value="qimen.html">奇门遁甲</option><option value="daliuren.html">大六壬</option><option value="taiyi.html">太乙神数</option></optgroup>
          <optgroup label="占卜"><option value="liuyao.html">六爻</option><option value="meihua.html">梅花易数</option><option value="xiaoliuren.html">小六壬</option><option value="lingqian.html">灵签</option><option value="tarot.html">塔罗牌</option><option value="lenormand.html">雷诺曼</option></optgroup>
          <optgroup label="民俗"><option value="minsu.html">民俗占法</option><option value="cezi.html">测字</option><option value="zhougong.html">周公解梦</option><option value="xingxiu.html">二十八宿</option><option value="taisui.html">太岁生肖</option></optgroup>
          <optgroup label="运气"><option value="yunqi.html">五运六气</option></optgroup>
          <optgroup label="相术"><option value="shouxiang.html">手相</option><option value="mianxiang.html">面相</option><option value="fengshui.html">阳宅风水</option><option value="fengshui-yin.html">阴宅风水</option><option value="luopan.html">罗经仪</option></optgroup>
          <optgroup label="附录"><option value="dianji.html">典籍参考</option><option value="shuoming.html">说明文档</option><option value="opensource.html">算法数据</option></optgroup>
        </select></div>
        <div class="field"><label for="fbMod">模块（可留空）</label><input type="text" id="fbMod" placeholder="如：四柱命盘"></div>
        <div class="field"><label for="fbPos">位置（可留空）</label><input type="text" id="fbPos" placeholder="如：结果区第一行"></div>
      </div>
      <div class="form-row" role="radiogroup" aria-labelledby="fbTypeLabel">
        <span class="fb-row-label" id="fbTypeLabel">问题类型</span>
        <div class="field chk"><input type="radio" id="fbTypeShow" name="fbType" value="显示" checked><label for="fbTypeShow">显示</label></div>
        <div class="field chk"><input type="radio" id="fbTypeText" name="fbType" value="内容"><label for="fbTypeText">内容</label></div>
        <div class="field chk"><input type="radio" id="fbTypeCalc" name="fbType" value="计算"><label for="fbTypeCalc">计算</label></div>
        <div class="field chk"><input type="radio" id="fbTypeIdea" name="fbType" value="建议"><label for="fbTypeIdea">建议</label></div>
      </div>
      <div class="form-row">
        <div class="field fb-desc"><label for="fbDesc">问题描述</label><textarea id="fbDesc" rows="1" placeholder="请尽量写清所见现象与复现步骤"></textarea></div>
      </div>
      <div class="form-row">
        <div class="field"><label for="fbContact">联系方式（可选）</label><input type="text" id="fbContact" placeholder="留空即匿名"></div>
        <button id="fbCopyBtn" class="btn gold" type="button">复制反馈内容</button>
        <span class="fb-status" id="fbStatus" role="status" aria-live="polite"></span>
      </div>
      <div class="fb-out" id="fbOut" hidden></div>

  </section>
  <section class="mod" id="fbmod-note">
    <div class="mod-head" onclick="toggleMod('fbmod-note')"><span class="mod-caret">▾</span><span class="mod-title">说明与须知</span><span class="mod-sub">数据去向、匿名与发送方式</span></div>
    <div class="mod-body">
      <p class="sub-note">本页不向服务器上传任何数据，不收集任何信息，也无须登录；所填内容只在浏览器内生成文本，关闭页面即失。</p>
      <p class="sub-note">点复制后，把生成的结构化文本粘贴到本站页首的仓库或联络入口发送即可。联系方式可留空；涉及具体命盘时，建议在描述里附上出生时间与所查项目，便于核对。</p>
      <p class="sub-note">反馈如被收录，会列在下方已收录反馈区，供后来者查阅。</p>
    </div>
  </section>
  <section class="mod collapsed" id="fbmod-list">
    <div class="mod-head" onclick="toggleMod('fbmod-list')"><span class="mod-caret">▾</span><span class="mod-title">已收录反馈</span><span class="mod-sub">收录与处理说明</span></div>
    <div class="mod-body">
      <p class="sub-note">本区用于陈列已收录的反馈与处理说明，整理后逐条列出，现暂无。</p>
    </div>

<script>
/* 模块开合：与全站各页同名同法，点题头收起或展开 */
function toggleMod(id){ var el=document.getElementById(id); if(el) el.classList.toggle('collapsed'); }

/* 生成结构化反馈文本：逐行拼出已填字段，空项略过 */
function fbBuildText(){
  var sel=document.getElementById('fbPage');
  var name=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].textContent:'';
  var lines=['玄机排盘 反馈建议','页面：'+(name||'全站或未列之页')];
  if(sel.value) lines.push('文件：'+sel.value);
  var mod=document.getElementById('fbMod').value.replace(/\s+/g,' ').trim();
  if(mod) lines.push('模块：'+mod);
  var pos=document.getElementById('fbPos').value.replace(/\s+/g,' ').trim();
  if(pos) lines.push('位置：'+pos);
  var type=document.querySelector('input[name="fbType"]:checked');
  lines.push('类型：'+(type?type.value:'未定'));
  var desc=document.getElementById('fbDesc').value.trim();
  lines.push('描述：'+(desc||'（未填写）'));
  var contact=document.getElementById('fbContact').value.replace(/\s+/g,' ').trim();
  if(contact) lines.push('联系：'+contact);
  return lines.join('\n');
}

/* 复制到剪贴板：现代接口优先，被拒时回落选中复制 */
function fbCopyText(text, done){
  function fallback(){
    try{
      var ta=document.createElement('textarea');
      ta.value=text; ta.setAttribute('readonly','');
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,text.length);
      var ok=document.execCommand('copy');
      document.body.removeChild(ta); done(ok);
    }catch(e){ done(false); }
  }
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ done(true); }, fallback);
  } else { fallback(); }
}

/* 复制按钮：生成文本上屏并复制，状态字报出结果 */
function fbOnCopy(){
  var text=fbBuildText();
  var out=document.getElementById('fbOut');
  out.textContent=text; out.hidden=false;
  fbCopyText(text, function(ok){
    document.getElementById('fbStatus').textContent=ok?'已复制，粘贴发送即可。':'复制未成，请手动选中下方文本复制。';
  });
}

window.addEventListener('load', function () {
  setTimeout(function () {
    renderChrome('feedback.html');
    var btn=document.getElementById('fbCopyBtn');
    if(btn) btn.addEventListener('click', fbOnCopy);
  }, 0);
});
</script>
