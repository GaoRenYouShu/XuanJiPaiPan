const YIMA={'申':'寅','子':'寅','辰':'寅','寅':'申','午':'申','戌':'申','巳':'亥','酉':'亥','丑':'亥','亥':'巳','卯':'巳','未':'巳'};
// 天马：正月起午，顺行六阳辰（午申戌子寅辰循环）
const TIANMA={'寅':'午','卯':'申','辰':'戌','巳':'子','午':'寅','未':'辰','申':'午','酉':'申','戌':'戌','亥':'子','子':'寅','丑':'辰'};

const LIUCHONG={子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};

const DIAOKE={寅:'子',卯:'丑',辰:'寅',巳:'卯',午:'辰',未:'巳',申:'午',酉:'未',戌:'申',亥:'酉',子:'戌',丑:'亥'};

const WX_MU={木:'未',火:'戌',土:'戌',金:'丑',水:'辰'};
// 地支六合
const LIUHE=['子丑','寅亥','卯戌','辰酉','巳申','午未'];
const isLiuHe=(a,b)=>LIUHE.some(p=>p.indexOf(a)>=0&&p.indexOf(b)>=0);
// 长生十二宫（阳干顺/阴干逆），用于干支败气判定
const CHANGSHENG={木:['亥','子','丑','寅','卯','辰','巳','午','未','申','酉','戌'],火:['寅','卯','辰','巳','午','未','申','酉','戌','亥','子','丑'],金:['巳','午','未','申','酉','戌','亥','子','丑','寅','卯','辰'],水:['申','酉','戌','亥','子','丑','寅','卯','辰','巳','午','未']};
// 毕法赋（凌福之《六壬毕法赋》/《六壬大全》卷十）：精选可用课盘判定的条目
// 每条 {n:第几, title:条目名, hit:命中判定返回 true/false, say:释义}
// 判定所需：o（日干支/四课/三传/天将/神煞等盘面数据）
function bifaVerdicts(o){
  const c=o.chuan; const tj=z=>o.jiangOnTian[z]||'';
  const tianOn=z=>o.tian[ZHI.indexOf(z)];
  const ganWx=GAN_WX2[o.dGan];
  const dun=DUN_GAN[o.dGan]||{};
  const luZhi=dun.lu, dingZhi=dun.ding;
  const dingOn=tianOn(dingZhi);
  const jg=JIGONG[o.dGan];
  const ganShang=tianOn(jg), zhiShang=tianOn(o.dZhi);   // 干上神、支上神
  // 三传十神简判：比/生/食/财/官/泄
  const tenOf = z => { const w=ZHI_WX2[z]; if(w===ganWx)return '比'; if(SHENG[ganWx]===w)return '生'; if(SHENG[w]===ganWx)return '食'; if(WX_KE2[ganWx]===w)return '财'; if(WX_KE2[w]===ganWx)return '官'; return '泄'; };
  const t1=tenOf(c.chu), t2=tenOf(c.zhong), t3=tenOf(c.mo);
  const hits=[];
  // 第三十一 三传递生人举荐：三传递相生
  if(SHENG[ganWx]===ZHI_WX2[c.chu]&&SHENG[ZHI_WX2[c.chu]]===ZHI_WX2[c.zhong]&&SHENG[ZHI_WX2[c.zhong]]===ZHI_WX2[c.mo])
    hits.push({n:'三十一',title:'三传递生人举荐',say:'三传干支递相生，主得人层层举荐、步步有人提携，谋事易成。'});
  // 第三十二 三传互克众人欺：三传相互克制
  if(WX_KE2[ZHI_WX2[c.chu]]===ZHI_WX2[c.zhong]||WX_KE2[ZHI_WX2[c.zhong]]===ZHI_WX2[c.mo]||WX_KE2[ZHI_WX2[c.chu]]===ZHI_WX2[c.mo])
    hits.push({n:'三十二',title:'三传互克众人欺',say:'三传相互克制，主同行相争、众人排挤，凡事多掣肘难成。'});
  // 第二十一 交车相合交关利：干支上神相合
  if(isLiuHe(ganShang,zhiShang))
    hits.push({n:'二十一',title:'交车相合交关利',say:'干支上神六合，主内外交关顺遂、合作交易有利。'});
  // 第二十二 上下皆合两心齐：干上神与支上神合（交车）、日干寄宫与日支相合
  if(isLiuHe(ganShang,zhiShang)&&isLiuHe(jg,o.dZhi))
    hits.push({n:'二十二',title:'上下皆合两心齐',say:'干支上下皆合，主双方心意相合、宾主融洽，谋事顺遂。'});
  // 第二十五 金日逢丁凶祸动：金日（庚辛）逢丁神动
  if((o.dGan==='庚'||o.dGan==='辛')&&dingOn)
    hits.push({n:'二十五',title:'金日逢丁凶祸动',say:'庚辛金日而丁神动，主凶祸变动，家有惊扰，宜静守防意外。'});
  // 第二十六 水日逢丁财动之：水日（壬癸）逢丁神动
  if((o.dGan==='壬'||o.dGan==='癸')&&dingOn)
    hits.push({n:'二十六',title:'水日逢丁财动之',say:'壬癸水日而丁神动，主动财、财利有变，求财易动。'});
  // 第七 旺禄临身徒妄作：日禄（又作日旺神）临于干上，宜守禄勿妄作
  if(ganShang===luZhi)
    hits.push({n:'七',title:'旺禄临身徒妄作',say:'日之旺禄临于干上，宜安守本禄；舍此而别谋，反多虚妄、得不偿失。'});
  // 第八 权摄不正禄临支：日干禄神加临日支（地盘）上
  if(tianOn(luZhi)===o.dZhi)
    hits.push({n:'八',title:'权摄不正禄临支',say:'日禄加临支上，主所谋权柄不正、受宅事或他人牵制，禄不自主。'});
  // 第一 前后引从升迁吉：初传居干（寄宫）前为引、末传居干后为从，或初末引从支
  //（近似：初传所临地盘在日干寄宫与日支之间的序位关系引从）
  {
    const chuZi=ZHI.indexOf(c.chu), moZi=ZHI.indexOf(c.mo), jiZhi=ZHI.indexOf(jg), zhZhi=ZHI.indexOf(o.dZhi);

function yueJiang(lunar,mode){
  const t=lunar.getJieQiTable();
  const cur=lunar.getSolar().toYmd();
  const tab=(mode==='jieqi')?JIANG_JIE:JIANG_QI;
  let best=null,bestZhi='';
  Object.keys(t).forEach(k=>{
    const nm=JIANG_ALIAS[k]||k;
    if(!(nm in tab)) return;
    const s=t[k];
    if(!s||s.toYmd()>cur) return;
    if(!best||s.toYmd()>best){ best=s.toYmd(); bestZhi=tab[nm]; }
  });
  return bestZhi||'子';
}

      return info && info[0]==='吉' ? '吉神' : '凶神';
    };
    const luInfo=luT ? '，临'+tj(luT)+jxSuffix(tj(luT)) : '';
    const deInfo=deT ? '，临'+tj(deT)+jxSuffix(tj(deT)) : '';
    const dinInfo=dinT ? '，临'+tj(dinT)+jxSuffix(tj(dinT)) : '';
    dunLine=`<p>${o.dGan}干之禄神在<b>${dun.lu}</b>（天盘${luT}）${luInfo}；德神在<b>${dun.de}</b>（天盘${deT}）${deInfo}；丁神在<b>${dun.ding}</b>（天盘${dinT}）${dinInfo}。禄德为旺气吉神，丁神主动应，视其临传与类神定其吉凶。</p>`;
  }
  // 本命行年
  let benLine='';
  if(o.benMing&&o.xingNian){
    const bz=o.benMing.zhi, bzT=tianOn(bz);
    const xz=o.xingNian.zhi, xzT=tianOn(xz);
    benLine=`<p><b>本命行年</b>：本命 <b>${o.benMing.gan}${o.benMing.zhi}</b>，${o.sex}命，虚岁 ${o.xingNian.age}，行年支 <b>${xz}</b>（${xzT?'天盘'+xzT+'，临'+tjInfo(xzT):'天盘'+xzT}）；本命支 ${bz}（${bzT?'天盘'+bzT+'，临'+tjInfo(bzT):'天盘'+bzT}）。行年落宫之神即本人当前所行之气，参其吉凶与类神生克断事。</p>`;
  }
  // 三传行（同句分号分隔）
  const chuanHtml = `初传 ${wxSpan(c.chu)} ${tjInfo(c.chu)}（${yz(c.chu)}）；中传 ${wxSpan(c.zhong)} ${tjInfo(c.zhong)}（${yz(c.zhong)}）；末传 ${wxSpan(c.mo)} ${tjInfo(c.mo)}（${yz(c.mo)}）`;
  const rows = [
    ['起课', `本课排 ${o.dgz}日、${o.shiZhi}时，月将 ${o.jiang}。${o.day?'昼占阳贵':'夜占阴贵'}（贵人${o.guiZhi}）`],
    ['天地盘', '天盘为月将加占时布出的动态盘，地盘为十二地支本位；十二天将随天盘排布，各主吉凶。'],
    ['四课', `以日干、日支为中心取上方天盘之神成四层。${keDesc}。`],
    ['三传', `${chuanHtml}`],
    ['类神', `本占（${o.dcat}）以 ${o.lei.yong} 为类神。${o.lei.desc}类神落 ${wxSpan(leiZhi)}（${leiFrom}），临 ${tjInfo(leiZhi)}。${leiState}。`],
    ['干遁', dunLine ? dunLine.replace(/<[^>]+>/g,'').replace(/<p>/g,'').replace(/<\/p>/g,'') : '无'],
    ['本命', benLine ? benLine.replace(/<[^>]+>/g,'').replace(/<p>/g,'').replace(/<\/p>/g,'') : '未填本命年'],
    ['吉凶', tjSummary],
    ['应期', `${yq}（阳传应期速、阴传应期迟）。`],
    ['总结', `占${o.dcat}，以类神为事之核心，看类神旺衰与所临天将吉凶，再合三传定应期，${jiN>xN?'吉神多于凶神，整体偏利':jiN<xN?'凶神多于吉神，宜谨慎防阻':'吉凶参半，须审时度势'}。`]
  ];
  return '<table class="lr-bh-tbl"><tbody>'+rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')+'</tbody></table>';
}
function render(o){

    <section class="mod collapsed" id="dlrModPan"><div class="mod-head" onclick="dlrToggleMod('dlrModPan')"><span class="mod-caret">▾</span><span class="gua-ico">☷</span><span class="mod-title">一、天地盘</span><span class="mod-sub">${o.jiangKey} 十二天将</span></div><div class="mod-body">${grid}</div></section>
    <section class="mod collapsed" id="dlrModKe"><div class="mod-head" onclick="dlrToggleMod('dlrModKe')"><span class="mod-caret">▾</span><span class="gua-ico">☵</span><span class="mod-title">二、四课</span><span class="mod-sub">干支阴阳</span></div><div class="mod-body"><div class="lr-kes">${keHtml}</div></div></section>
    <section class="mod collapsed" id="dlrModChuan"><div class="mod-head" onclick="dlrToggleMod('dlrModChuan')"><span class="mod-caret">▾</span><span class="gua-ico">☳</span><span class="mod-title">三、三传</span><span class="mod-sub">初传 中传 末传</span></div><div class="mod-body"><div class="lr-chuans">${trip}</div><p class="sub-note">取法：${c.method}。</p></div></section>
    <section class="mod collapsed" id="dlrModLei"><div class="mod-head" onclick="dlrToggleMod('dlrModLei')"><span class="mod-caret">▾</span><span class="gua-ico">☰</span><span class="mod-title">四、类神取用</span><span class="mod-sub">${o.dcat}</span></div><div class="mod-body"><div class="info-box lr-lei" id="lrLeiBox"><p>本占（${o.dcat}）以 <b>${o.lei.yong}</b> 为类神。${o.lei.desc}</p>${o.benMing&&o.xingNian?`<p class="lr-lei-sub"><b>本命行年</b>：${o.benMing.gan}${o.benMing.zhi}命、${o.sex}、虚岁${o.xingNian.age}、行年 ${o.xingNian.zhi}（${o.jiangOnTian[o.tian[ZHI.indexOf(o.xingNian.zhi)]]?'临'+o.jiangOnTian[o.tian[ZHI.indexOf(o.xingNian.zhi)]]:'天盘'+o.tian[ZHI.indexOf(o.xingNian.zhi)]}）</p>`:''}${o.sha?`<p class="lr-lei-sub"><b>神煞</b>：驿马${o.sha.yima||'-'}，天马${o.sha.tianma||'-'}，天喜${o.sha.tianxi||'-'}，天医${o.sha.tianyi||'-'}，劫煞${o.sha.jiesha||'-'}，灾煞${o.sha.zaisha||'-'}，亡神${o.sha.wangshen||'-'}，破碎${o.sha.posui||'-'}，三合${o.sha.sanhe||'-'}，六冲${o.sha.liuchong||'-'}，日德${o.sha.ride||'-'}，丧门${o.sha.sangmen||'-'}，吊客${o.sha.diaoke||'-'}，病符${o.sha.bingfu||'-'}</p>`:''}</div></div></section>

  dlrApplyModState();
}
